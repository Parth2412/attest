name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-v0.1.1
  cancel-in-progress: false

env:
  PRODUCT_VERSION: "0.1.1"
  PRODUCT_TAG: v0.1.1
  ACTION_VERSION_TAG: v1.0.1
  IMAGE_NAME: ghcr.io/parth2412/attest
  REVIEWED_IMAGE_DIGEST: sha256:0e5073cb4f2a9cc484f15aded43b7f0b8ac432a0a8b31fc401b7e361cd0509f3
  FIRST_RELEASE_SHA: a1c59cc67bf67aba22ffca876309f855ea8663af

jobs:
  preflight:
    if: github.repository == 'Parth2412/attest' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate patch source and repository controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "main"
          uv lock --check

          mkdir -p patch-preflight-evidence
          gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            > patch-preflight-evidence/rulesets.json
          ruleset_id="$(jq -er \
            '.[] | select(.name == "Protect immutable release tags" and .target == "tag" and .enforcement == "active") | .id' \
            patch-preflight-evidence/rulesets.json)"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
            > patch-preflight-evidence/tag-ruleset.json
          jq -e '
            (.bypass_actors // []) == [] and
            (.conditions.ref_name.include | sort) ==
              (["refs/tags/v0.1.0", "refs/tags/v0.1.1", "refs/tags/v1.0.0", "refs/tags/v1.0.1"] | sort) and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | sort) == (["deletion", "update"] | sort)
          ' patch-preflight-evidence/tag-ruleset.json > /dev/null

          gh api "repos/${GITHUB_REPOSITORY}/environments/pypi-attest-cli" \
            > patch-preflight-evidence/pypi-attest-cli-environment.json
          jq -e --arg owner "${GITHUB_REPOSITORY_OWNER}" '
            .name == "pypi-attest-cli" and
            .can_admins_bypass == false and
            .deployment_branch_policy.protected_branches == true and
            .deployment_branch_policy.custom_branch_policies == false and
            ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 1 and
            ([
              .protection_rules[] |
              select(.type == "required_reviewers") |
              .prevent_self_review
            ] == [false]) and
            ([
              .protection_rules[] |
              select(.type == "required_reviewers") |
              .reviewers[] |
              {type, login: .reviewer.login}
            ] == [{type: "User", login: $owner}])
          ' patch-preflight-evidence/pypi-attest-cli-environment.json > /dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > patch-preflight-evidence/main-ci-runs.json
          jq -e --arg sha "${GITHUB_SHA}" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            patch-preflight-evidence/main-ci-runs.json > /dev/null

          for tag in v0.1.0 v1.0.0 v1; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" \
              = "${FIRST_RELEASE_SHA}"
          done
          test "$(git tag --points-at "${FIRST_RELEASE_SHA}" | LC_ALL=C sort)" = $'v0.1.0\nv1\nv1.0.0'
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /dev/null 2>&1; then
              echo "patch preflight: tag already exists: ${tag}" >&2
              exit 1
            fi
          done
          if gh release view "${PRODUCT_TAG}" > /dev/null 2>&1; then
            echo "patch preflight: release already exists: ${PRODUCT_TAG}" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.0" \
            > patch-preflight-evidence/first-release.json
          jq -e --arg sha "${FIRST_RELEASE_SHA}" '
            .tag_name == "v0.1.0" and
            .target_commitish == $sha and
            .draft == false and
            .prerelease == false and
            .immutable == true
          ' patch-preflight-evidence/first-release.json > /dev/null

          curl --fail --silent --show-error \
            https://pypi.org/pypi/attest-cli/json \
            > patch-preflight-evidence/attest-cli-pypi.json
          jq -e '
            .info.name == "attest-cli" and
            .info.version == "0.1.0" and
            (.releases | keys) == ["0.1.0"] and
            (.releases | keys | index("0.1.1") | not)
          ' patch-preflight-evidence/attest-cli-pypi.json > /dev/null

          uv run --no-project python - <<'PY'
          import tomllib
          from pathlib import Path

          project = tomllib.loads(
              Path("packages/attest-cli/pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          patch = tomllib.loads(
              Path("release/patches/0.1.1.toml").read_text(encoding="utf-8")
          )
          dependencies = {
              value for value in project["dependencies"] if value.startswith("attest-")
          }
          expected = {
              "attest-core==0.1.0",
              "attest-collect==0.1.0",
              "attest-sign==0.1.0",
              "attest-store==0.1.0",
              "attest-policy==0.1.0",
          }
          if project["version"] != "0.1.1" or dependencies != expected:
              raise SystemExit("CLI patch metadata differs from the closed contract")
          if patch["release"] != {
              "version": "0.1.1",
              "distributions": ["attest-cli"],
          }:
              raise SystemExit("patch manifest differs from the closed distribution set")
          if patch["compatibility"] != {
              "library-version": "0.1.0",
              "action-version": "v1.0.1",
              "image": (
                  "ghcr.io/parth2412/attest@sha256:"
                  "0e5073cb4f2a9cc484f15aded43b7f0b8ac432a0a8b31fc401b7e361cd0509f3"
              ),
          }:
              raise SystemExit("patch compatibility differs from the closed contract")
          PY

          current_image="$(awk '/^  image: docker:\/\// {sub(/^  image: docker:\/\//, ""); print}' action/action.yml)"
          test "${current_image}" = "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}"
          if grep -F "github." action/action.yml > /dev/null; then
            echo "patch preflight: Action metadata references an unsupported context" >&2
            exit 1
          fi

          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}" --raw \
            > patch-preflight-evidence/image-manifest.json
          observed="sha256:$(sha256sum patch-preflight-evidence/image-manifest.json | cut -d ' ' -f 1)"
          test "${observed}" = "${REVIEWED_IMAGE_DIGEST}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("patch-preflight-evidence/image-manifest.json").read_text(encoding="utf-8")
          )
          platforms = {
              f"{item['platform']['os']}/{item['platform']['architecture']}"
              for item in manifest["manifests"]
              if item["platform"]["os"] != "unknown"
          }
          if platforms != {"linux/amd64", "linux/arm64"}:
              raise SystemExit(f"unexpected image platforms: {sorted(platforms)}")
          PY
      - name: Retain patch preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-preflight-evidence-v0.1.1
          path: patch-preflight-evidence
          if-no-files-found: error
          retention-days: 90

  build-cli:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - name: Build and validate only the CLI patch
        shell: bash
        run: |
          set -euo pipefail
          uv build --package attest-cli --out-dir build/patch-dist \
            --clear --no-create-gitignore
          uv run --no-project python scripts/validate_release_artifacts.py \
            build/patch-dist \
            --manifest release/patches/0.1.1.toml \
            --hash-output build/SHA256SUMS
          mkdir -p build/release-assets
          cp build/patch-dist/* build/release-assets/
          cp build/SHA256SUMS build/release-assets/SHA256SUMS
          git archive \
            --format=tar.gz \
            --prefix="attest-${PRODUCT_VERSION}/" \
            --output="build/release-assets/attest-${PRODUCT_VERSION}-source.tar.gz" \
            "${GITHUB_SHA}"
          cd build/release-assets
          sha256sum "attest-${PRODUCT_VERSION}-source.tar.gz" >> SHA256SUMS
          LC_ALL=C sort --key=2 --output=SHA256SUMS SHA256SUMS
          LC_ALL=C sort --check=quiet --key=2 SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-distributions-v0.1.1
          path: build/patch-dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-v0.1.1
          path: build/release-assets
          if-no-files-found: error
          retention-days: 90

  smoke-cli:
    needs: build-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-distributions-v0.1.1
          path: dist
      - name: Install and smoke-test the CLI patch
        shell: bash
        run: |
          set -euo pipefail
          uv venv build/patch-smoke --python "${{ matrix.python }}" --clear
          uv pip install \
            --python build/patch-smoke/bin/python \
            --strict \
            --no-cache \
            dist/attest_cli-0.1.1-py3-none-any.whl
          build/patch-smoke/bin/python - <<'PY'
          from importlib import metadata

          assert metadata.version("attest-cli") == "0.1.1"
          for distribution in (
              "attest-core",
              "attest-collect",
              "attest-sign",
              "attest-store",
              "attest-policy",
          ):
              assert metadata.version(distribution) == "0.1.0"
          PY
          build/patch-smoke/bin/attest --help > /dev/null

  attest-artifacts:
    needs: [build-cli, smoke-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-v0.1.1
          path: release-assets
      - name: Attest the source and release artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publicly verify every GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patch-attestation-evidence
          for subject in release-assets/*; do
            name="$(basename "${subject}")"
            gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-digest "${GITHUB_SHA}" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --format json \
              > "patch-attestation-evidence/${name}.verification.json"
          done
          cp "${{ steps.attest.outputs.bundle-path }}" \
            patch-attestation-evidence/github-artifact-attestations.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-attestation-evidence-v0.1.1
          path: patch-attestation-evidence
          if-no-files-found: error
          retention-days: 90

  publish-cli:
    needs: [attest-artifacts, smoke-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-attest-cli
      url: https://pypi.org/p/attest-cli
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-distributions-v0.1.1
          path: dist
      - name: Record the bounded Trusted Publishing context
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          mkdir -p trusted-publisher-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schemaVersion": 1,
              "authentication": "oidc-trusted-publishing",
              "distribution": "attest-cli",
              "environment": "pypi-attest-cli",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "releaseRef": os.environ["GITHUB_REF"],
              "releaseRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "releaseRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
              "publisherAction": (
                  "pypa/gh-action-pypi-publish@"
                  "dc37677b2e1c63e2034f94d8a5b11f265b73ba33"
              ),
          }
          Path("trusted-publisher-evidence/attest-cli.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-publisher-evidence-attest-cli-v0.1.1
          path: trusted-publisher-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Publish the CLI patch with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          print-hash: true
          attestations: true

  verify-published-cli:
    needs: publish-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-v0.1.1
          path: release-assets
      - name: Verify public CLI bytes and clean installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-cli-evidence
          uv run --no-project python scripts/verify_published_release.py \
            release-assets \
            --manifest release/patches/0.1.1.toml \
            --version "${PRODUCT_VERSION}" \
            | tee "public-cli-evidence/pypi-verification-python-${{ matrix.python }}.txt"
          uv venv build/public-cli-smoke --python "${{ matrix.python }}" --clear
          uv pip install \
            --python build/public-cli-smoke/bin/python \
            --strict \
            --no-cache \
            "attest-cli==${PRODUCT_VERSION}"
          uv pip freeze --python build/public-cli-smoke/bin/python \
            > "public-cli-evidence/installed-python-${{ matrix.python }}.txt"
          build/public-cli-smoke/bin/python - <<'PY'
          from importlib import metadata

          assert metadata.version("attest-cli") == "0.1.1"
          for distribution in (
              "attest-core",
              "attest-collect",
              "attest-sign",
              "attest-store",
              "attest-policy",
          ):
              assert metadata.version(distribution) == "0.1.0"
          PY
          build/public-cli-smoke/bin/attest --help > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-cli-evidence-python-${{ matrix.python }}-v0.1.1
          path: public-cli-evidence
          if-no-files-found: error
          retention-days: 90

  dogfood:
    needs: verify-published-cli
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_IDENTITY: https://github.com/Parth2412/attest/.github/workflows/release.yml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - name: Install the public CLI patch in isolation
        shell: bash
        run: |
          uv venv build/patch-dogfood --python 3.12 --clear
          uv pip install \
            --python build/patch-dogfood/bin/python \
            --strict \
            --no-cache \
            "attest-cli==${PRODUCT_VERSION}"
      - name: Attest and publicly verify the patch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          build/patch-dogfood/bin/attest run \
            --output "build/release-evidence/attest-${PRODUCT_TAG}.bundle.json" \
            --repository . \
            --work-directory build/release-evidence/work \
            --policy release/attest-release-policy.yaml \
            --base "${FIRST_RELEASE_SHA}" \
            --head "${GITHUB_SHA}" \
            --target-branch main \
            --git-backend subprocess \
            --signing-environment production \
            --identity "${RELEASE_IDENTITY}" \
            --issuer "${OIDC_ISSUER}" \
            --verify-environment production \
            --online \
            --store-backend filesystem \
            --store-directory build/release-evidence/store \
            --fallback-directory build/release-evidence/fallback \
            --config release/attest-release-config.yaml \
            --json \
            > build/release-evidence/attest-run-report.json
          build/patch-dogfood/bin/attest verify \
            --input "build/release-evidence/attest-${PRODUCT_TAG}.bundle.json" \
            --repository . \
            --base "${FIRST_RELEASE_SHA}" \
            --head "${GITHUB_SHA}" \
            --identity "${RELEASE_IDENTITY}" \
            --issuer "${OIDC_ISSUER}" \
            --verify-environment production \
            --online \
            --config release/attest-release-config.yaml \
            --json \
            > build/release-evidence/public-verification.json
      - name: Retain attest dogfood evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attest-release-evidence-v0.1.1
          path: build/release-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  publish-release:
    needs: [attest-artifacts, dogfood, verify-published-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-v0.1.1
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-evidence*v0.1.1"
          path: retained-evidence
      - name: Assemble the retained release evidence index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-release-assets
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path("final-release-assets")
          for source_root in (Path("release-assets"), Path("retained-evidence")):
              for path in sorted(source_root.rglob("*"), key=lambda item: item.as_posix()):
                  relative = path.relative_to(source_root)
                  if any(part.startswith(".") for part in relative.parts):
                      raise SystemExit(f"hidden retained evidence is forbidden: {path}")
                  if path.is_dir() and not path.is_symlink():
                      continue
                  if not path.is_file() or path.is_symlink():
                      raise SystemExit(f"invalid retained evidence: {path}")
                  target = root / path.name
                  if target.exists():
                      raise SystemExit(f"duplicate release asset name: {path.name}")
                  shutil.copyfile(path, target)

          assets = []
          for path in sorted(root.iterdir(), key=lambda item: item.name):
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"invalid release asset: {path}")
              content = path.read_bytes()
              assets.append(
                  {
                      "name": path.name,
                      "sha256": hashlib.sha256(content).hexdigest(),
                      "size": len(content),
                  }
              )
          index = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "releaseRunId": os.environ["GITHUB_RUN_ID"],
              "firstReleaseCommit": os.environ["FIRST_RELEASE_SHA"],
              "imageDigest": os.environ["REVIEWED_IMAGE_DIGEST"],
              "majorTagMoved": False,
              "tags": [
                  os.environ["PRODUCT_TAG"],
                  os.environ["ACTION_VERSION_TAG"],
              ],
              "assets": assets,
          }
          (root / "release-evidence-index.json").write_text(
              json.dumps(index, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Create, verify, and publish the immutable patch Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${PRODUCT_TAG}" \
            --target "${GITHUB_SHA}" \
            --draft \
            --title "attest CLI ${PRODUCT_VERSION} / Action v1.0.1" \
            --notes-file release/RELEASE_NOTES-v0.1.1.md
          gh release upload "${PRODUCT_TAG}" final-release-assets/*

          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${PRODUCT_TAG}\" and .draft == true)" \
              > release-draft.json
            if python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          release = json.loads(Path("release-draft.json").read_text(encoding="utf-8"))
          remote = {item["name"]: item["digest"] for item in release["assets"]}
          local = {
              path.name: f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}"
              for path in Path("final-release-assets").iterdir()
              if path.is_file()
          }
          if remote != local:
              raise SystemExit("draft release assets differ from retained local evidence")
          PY
            then
              break
            fi
            if test "${attempt}" = "30"; then
              echo "patch release: draft asset digests were not observed" >&2
              exit 1
            fi
            sleep 2
          done

          gh release edit "${PRODUCT_TAG}" --draft=false --latest
          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" \
              > release-published.json
            if jq -e '
              .draft == false and
              .prerelease == false and
              .immutable == true
            ' release-published.json > /dev/null; then
              break
            fi
            if test "${attempt}" = "30"; then
              echo "patch release: immutable state was not observed" >&2
              exit 1
            fi
            sleep 10
          done

          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --field ref="refs/tags/${ACTION_VERSION_TAG}" \
            --field sha="${GITHUB_SHA}" > /dev/null
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" \
              = "${GITHUB_SHA}"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1" --jq '.object.sha')" \
            = "${FIRST_RELEASE_SHA}"
