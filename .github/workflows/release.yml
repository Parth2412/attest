name: release

on:
  workflow_dispatch:
    inputs:
      performance_run_id_1:
        description: First consecutive attempt-1 performance run for this exact main commit
        required: true
        type: string
      performance_run_id_2:
        description: Second consecutive attempt-1 performance run for this exact main commit
        required: true
        type: string
      performance_run_id_3:
        description: Third consecutive attempt-1 performance run for this exact main commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-v0.1.8
  cancel-in-progress: false

env:
  PRODUCT_VERSION: "0.1.8"
  PRODUCT_TAG: v0.1.8
  ACTION_VERSION_TAG: v1.0.8
  SIGN_VERSION: "0.1.1"
  PUBLIC_CLI_VERSION: "0.1.5"
  IMAGE_NAME: ghcr.io/parth2412/attest
  PRIOR_RELEASE_SHA: c42e52d038f5ecdcc498679cb7648e5b0957d489
  REVIEWED_CANDIDATE_RUN_ID: 40674146751
  REVIEWED_CANDIDATE_SOURCE_SHA: 905c30679d291bce13ad3140703162cf3405e55b
  REVIEWED_CONTEXT_DIGEST: sha256:8b863e6dc4733bb7050b27f34863b3db87db7ff069562ce348a98db0642c17bd
  REVIEWED_IMAGE_DIGEST: sha256:1b40c02bfacaae958a2adf9bfc25485fe0c22794db50c19aa401db530ea36c61
jobs:
  preflight:
    if: github.repository == 'Parth2412/attest' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate source and immutable repository controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "main"
          uv lock --check
          mkdir -p release-preflight-evidence
          test "$(git rev-parse "${REVIEWED_CANDIDATE_SOURCE_SHA}:uv.lock")" \
            = "$(git hash-object uv.lock)"

          gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            > release-preflight-evidence/rulesets.json
          ruleset_id="$(jq -er \
            '.[] | select(.name == "Protect immutable release tags" and .target == "tag" and .enforcement == "active") | .id' \
            release-preflight-evidence/rulesets.json)"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
            > release-preflight-evidence/tag-ruleset.json
          jq -e '
            (.bypass_actors // []) == [] and
            (.conditions.ref_name.include | sort) ==
              ([
                "refs/tags/v0.1.0",
                "refs/tags/v0.1.1",
                "refs/tags/v0.1.2",
                "refs/tags/v0.1.3",
                "refs/tags/v0.1.4",
                "refs/tags/v0.1.5",
                "refs/tags/v0.1.6",
                "refs/tags/v0.1.7",
                "refs/tags/v0.1.8",
                "refs/tags/v1.0.0",
                "refs/tags/v1.0.1",
                "refs/tags/v1.0.2",
                "refs/tags/v1.0.3",
                "refs/tags/v1.0.4",
                "refs/tags/v1.0.5",
                "refs/tags/v1.0.6",
                "refs/tags/v1.0.7",
                "refs/tags/v1.0.8"
              ] | sort) and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | sort) == (["deletion", "update"] | sort)
          ' release-preflight-evidence/tag-ruleset.json > /dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > release-preflight-evidence/main-ci-runs.json
          jq -e --arg sha "${GITHUB_SHA}" \
            'any(.workflow_runs[]; .head_sha == $sha and .run_attempt == 1 and .conclusion == "success")' \
            release-preflight-evidence/main-ci-runs.json > /dev/null

          for tag in v0.1.7 v1.0.7 v1; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" \
              = "${PRIOR_RELEASE_SHA}"
          done
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            if observed="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null)"; then
              test "${observed}" = "${GITHUB_SHA}"
            fi
          done

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.7" \
            > release-preflight-evidence/prior-release.json
          jq -e --arg sha "${PRIOR_RELEASE_SHA}" '
            .tag_name == "v0.1.7" and
            .target_commitish == $sha and
            .draft == false and
            .prerelease == false and
            .immutable == true
          ' release-preflight-evidence/prior-release.json > /dev/null
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > release-preflight-evidence/release-pages.json
          jq -e --arg sha "${GITHUB_SHA}" --arg tag "${PRODUCT_TAG}" '
            [.[][] | select(.tag_name == $tag)] as $matches |
            ($matches | length) <= 1 and
            (
              ($matches | length) == 0 or
              (
                $matches[0].target_commitish == $sha and
                $matches[0].prerelease == false and
                (
                  ($matches[0].draft == true and $matches[0].immutable == false) or
                  ($matches[0].draft == false and $matches[0].immutable == true)
                )
              )
            )
          ' release-preflight-evidence/release-pages.json > /dev/null
      - name: Validate the reviewed candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEWED_CANDIDATE_RUN_ID}" \
            > release-preflight-evidence/candidate-run.json
          jq -e \
            --arg source "${REVIEWED_CANDIDATE_SOURCE_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" '
              .name == "action-candidate" and
              .path == ".github/workflows/action-candidate.yml" and
              .event == "push" and
              .head_branch == "dev" and
              .head_sha == $source and
              .repository.full_name == $repository and
              .status == "completed" and
              .conclusion == "success" and
              .run_attempt == 1
            ' release-preflight-evidence/candidate-run.json > /dev/null
      - name: Download the reviewed candidate build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-build-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-build
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Download the reviewed corresponding-source evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-source-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-source
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Download the reviewed component scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-component-scan-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-component-scan
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Download the reviewed amd64 scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-scan-linux-amd64-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-scan-amd64
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Download the reviewed arm64 scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-scan-linux-arm64-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-scan-arm64
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Download the reviewed amd64 container evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-container-linux-amd64-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-container-amd64
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Download the reviewed arm64 container evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-container-linux-arm64-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-container-arm64
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Download the reviewed candidate attestation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-attestation-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-attestation
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Materialize and verify the public corresponding source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source_digest="$(tr -d '\n' < "${RUNNER_TEMP}/candidate-source/source-artifact-digest.txt")"
          source_reference="$(tr -d '\n' < "${RUNNER_TEMP}/candidate-source/source-artifact-reference.txt")"
          test "${source_digest}" != "${source_digest#sha256:}"
          test "${#source_digest}" -eq 71
          test "${source_reference}" = "${IMAGE_NAME}@${source_digest}"
          docker buildx imagetools inspect "${source_reference}" --raw \
            > release-preflight-evidence/live-source-artifact-manifest.json
          observed="sha256:$(sha256sum release-preflight-evidence/live-source-artifact-manifest.json | cut -d ' ' -f 1)"
          test "${observed}" = "${source_digest}"
          cmp "${RUNNER_TEMP}/candidate-source/source-artifact-manifest.json" \
            release-preflight-evidence/live-source-artifact-manifest.json
          docker pull "${source_reference}"
          container="$(docker create "${source_reference}" /unused)"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          mkdir "${RUNNER_TEMP}/reviewed-runtime-sources"
          docker cp "${container}:/source/." "${RUNNER_TEMP}/reviewed-runtime-sources"
          gh attestation verify \
            "oci://${source_reference}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/action-candidate.yml" \
            --source-digest "${REVIEWED_CANDIDATE_SOURCE_SHA}" \
            --source-ref refs/heads/dev \
            --deny-self-hosted-runners \
            --format json \
            > release-preflight-evidence/candidate-source-attestation-verification.json
      - name: Prove candidate context, image, scans, and identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project python scripts/prepare_action_context.py \
            "${RUNNER_TEMP}/release-action-context" \
            --runtime-sources "${RUNNER_TEMP}/reviewed-runtime-sources" \
            --manifest-output release-preflight-evidence/current-context-manifest.json \
            --digest-output release-preflight-evidence/current-context-digest.txt
          uv run --no-project python scripts/validate_release_candidate.py \
            --evidence-directory "${RUNNER_TEMP}/candidate-build" \
            --source-evidence-directory "${RUNNER_TEMP}/candidate-source" \
            --runtime-sources "${RUNNER_TEMP}/reviewed-runtime-sources" \
            --component-scan "${RUNNER_TEMP}/candidate-component-scan/grype-runtime-components.json" \
            --current-context-manifest release-preflight-evidence/current-context-manifest.json \
            --action-manifest action/action.yml \
            --expected-context-digest "${REVIEWED_CONTEXT_DIGEST}" \
            --expected-image-digest "${REVIEWED_IMAGE_DIGEST}"

          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}" --raw \
            > release-preflight-evidence/live-image-manifest.json
          observed="sha256:$(sha256sum release-preflight-evidence/live-image-manifest.json | cut -d ' ' -f 1)"
          test "${observed}" = "${REVIEWED_IMAGE_DIGEST}"
          cmp "${RUNNER_TEMP}/candidate-build/manifest.json" \
            release-preflight-evidence/live-image-manifest.json
          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}" --format '{{json .Image}}' \
            > release-preflight-evidence/live-image-configs.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          images = json.loads(
              Path("release-preflight-evidence/live-image-configs.json").read_text(
                  encoding="utf-8"
              )
          )
          if set(images) != {"linux/amd64", "linux/arm64"}:
              raise SystemExit(f"unexpected live image platforms: {sorted(images)}")
          source_reference = Path(
              os.environ["RUNNER_TEMP"],
              "candidate-source/source-artifact-reference.txt",
          ).read_text(encoding="utf-8").strip()
          expected = {
              "io.github.parth2412.attest.context-digest": os.environ[
                  "REVIEWED_CONTEXT_DIGEST"
              ],
              "io.github.parth2412.attest.source-artifact": source_reference,
              "org.opencontainers.image.revision": os.environ[
                  "REVIEWED_CANDIDATE_SOURCE_SHA"
              ],
              "org.opencontainers.image.source": "https://github.com/Parth2412/attest",
              "org.opencontainers.image.version": "0.1.8-candidate",
          }
          for platform, image in images.items():
              if image.get("config", {}).get("Labels") != expected:
                  raise SystemExit(f"invalid image labels for {platform}")
          PY

          python3 scripts/check_action_scan.py \
            "${RUNNER_TEMP}/candidate-scan-amd64/trivy-linux-amd64.json"
          python3 scripts/check_action_scan.py \
            "${RUNNER_TEMP}/candidate-scan-arm64/trivy-linux-arm64.json"
          python3 scripts/check_action_component_scan.py \
            "${RUNNER_TEMP}/candidate-component-scan/grype-runtime-components.json" \
            --sbom "${RUNNER_TEMP}/reviewed-runtime-sources/runtime-components.spdx.json" \
            --vex "${RUNNER_TEMP}/reviewed-runtime-sources/runtime-components.openvex.json"
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          output = Path("release-preflight-evidence")
          digest = re.compile(r"[0-9a-f]{64}")
          forbidden = (
              "libpcre2-8.so",
              "libcares.so",
              "libnghttp2.so",
              "libidn2.so",
              "libpsl.so",
              "libzstd.so",
              "libbrotlidec.so",
              "libbrotlicommon.so",
              "libunistring.so",
          )
          for architecture in ("amd64", "arm64"):
              slug = f"linux-{architecture}"
              root = Path(os.environ["RUNNER_TEMP"], f"candidate-container-{architecture}")
              expected_files = {
                  f"{slug}-sizes.json",
                  f"{slug}-loader-dependencies.txt",
                  f"{slug}.xml",
              }
              if {path.name for path in root.iterdir()} != expected_files:
                  raise SystemExit(f"invalid {slug} container evidence set")
              sizes = json.loads((root / f"{slug}-sizes.json").read_text(encoding="utf-8"))
              if set(sizes) != {
                  "platform",
                  "imageBytes",
                  "standardLibraryArchiveBytes",
                  "runtimeArchiveBytes",
                  "gitBytes",
                  "gitSha256",
                  "gitRemoteHttpBytes",
                  "gitRemoteHttpSha256",
                  "libcurlBytes",
                  "libcurlSha256",
                  "gitVersion",
                  "curlVersion",
              }:
                  raise SystemExit(f"invalid {slug} runtime size evidence")
              if sizes["platform"] != f"linux/{architecture}":
                  raise SystemExit(f"invalid {slug} runtime platform")
              if sizes["gitVersion"] != "git version 2.52.0":
                  raise SystemExit(f"invalid {slug} Git version")
              if sizes["curlVersion"] != "libcurl/8.23.0 OpenSSL/3.5.9 zlib/1.3.2":
                  raise SystemExit(f"invalid {slug} curl version")
              for name in (
                  "imageBytes",
                  "standardLibraryArchiveBytes",
                  "runtimeArchiveBytes",
                  "gitBytes",
                  "gitRemoteHttpBytes",
                  "libcurlBytes",
              ):
                  if isinstance(sizes[name], bool) or not isinstance(sizes[name], int) or sizes[name] <= 0:
                      raise SystemExit(f"invalid {slug} size: {name}")
              for name in ("gitSha256", "gitRemoteHttpSha256", "libcurlSha256"):
                  if not isinstance(sizes[name], str) or digest.fullmatch(sizes[name]) is None:
                      raise SystemExit(f"invalid {slug} digest: {name}")
              mapping = (root / f"{slug}-loader-dependencies.txt").read_text(encoding="utf-8")
              if (
                  "/usr/bin/git|" not in mapping
                  or "/usr/libexec/git-core/git-remote-http|libcurl.so.4" not in mapping
                  or any(library in mapping for library in forbidden)
              ):
                  raise SystemExit(f"invalid {slug} loader-dependencies.txt")
              for name in expected_files:
                  shutil.copyfile(root / name, output / f"candidate-{name}")
          PY
          source_digest="$(tr -d '\n' < "${RUNNER_TEMP}/candidate-source/source-artifact-digest.txt")"
          source_reference="$(tr -d '\n' < "${RUNNER_TEMP}/candidate-source/source-artifact-reference.txt")"
          jq -e \
            --arg imageRef "${IMAGE_NAME}:candidate-${REVIEWED_CANDIDATE_SOURCE_SHA}-${REVIEWED_CANDIDATE_RUN_ID}-1" \
            --arg context "${REVIEWED_CONTEXT_DIGEST}" \
            --arg image "${REVIEWED_IMAGE_DIGEST}" \
            --arg sourceDigest "${source_digest}" \
            --arg sourceRef "${source_reference}" '
              ."image-ref" == $imageRef and
              ."context-digest" == $context and
              ."image-digest" == $image and
              ."source-artifact-digest" == $sourceDigest and
              ."source-artifact-ref" == $sourceRef
            ' "${RUNNER_TEMP}/candidate-attestation/candidate-outputs.json" > /dev/null
          gh attestation verify \
            "oci://${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/action-candidate.yml" \
            --source-digest "${REVIEWED_CANDIDATE_SOURCE_SHA}" \
            --source-ref refs/heads/dev \
            --deny-self-hosted-runners \
            --format json \
            > release-preflight-evidence/candidate-attestation-verification.json

          cp "${RUNNER_TEMP}/candidate-build/context-manifest.json" \
            release-preflight-evidence/candidate-context-manifest.json
          cp "${RUNNER_TEMP}/candidate-build/manifest.json" \
            release-preflight-evidence/candidate-image-manifest.json
          cp "${RUNNER_TEMP}/candidate-build/manifest-linux-amd64.json" \
            release-preflight-evidence/candidate-image-manifest-linux-amd64.json
          cp "${RUNNER_TEMP}/candidate-build/manifest-linux-arm64.json" \
            release-preflight-evidence/candidate-image-manifest-linux-arm64.json
          cp "${RUNNER_TEMP}/candidate-build/layers-linux-amd64.json" \
            release-preflight-evidence/candidate-image-layers-linux-amd64.json
          cp "${RUNNER_TEMP}/candidate-build/layers-linux-arm64.json" \
            release-preflight-evidence/candidate-image-layers-linux-arm64.json
          cp "${RUNNER_TEMP}/candidate-build/sbom.spdx.json" \
            release-preflight-evidence/candidate-image-sbom.spdx.json
          cp "${RUNNER_TEMP}/candidate-build/provenance.slsa.json" \
            release-preflight-evidence/candidate-image-provenance.slsa.json
          cp "${RUNNER_TEMP}/candidate-scan-amd64/trivy-linux-amd64.json" \
            release-preflight-evidence/candidate-scan-linux-amd64.json
          cp "${RUNNER_TEMP}/candidate-scan-arm64/trivy-linux-arm64.json" \
            release-preflight-evidence/candidate-scan-linux-arm64.json
          cp "${RUNNER_TEMP}/candidate-attestation/candidate-outputs.json" \
            release-preflight-evidence/candidate-outputs.json
          cp "${RUNNER_TEMP}/candidate-source/source-artifact-digest.txt" \
            release-preflight-evidence/candidate-source-artifact-digest.txt
          cp "${RUNNER_TEMP}/candidate-source/source-artifact-reference.txt" \
            release-preflight-evidence/candidate-source-artifact-reference.txt
          cp "${RUNNER_TEMP}/candidate-source/source-artifact-manifest.json" \
            release-preflight-evidence/candidate-source-artifact-manifest.json
          cp "${RUNNER_TEMP}/candidate-source/source-manifest.json" \
            release-preflight-evidence/candidate-source-manifest.json
          cp "${RUNNER_TEMP}/candidate-source/runtime-components.spdx.json" \
            release-preflight-evidence/candidate-runtime-components.spdx.json
          cp "${RUNNER_TEMP}/candidate-source/runtime-components.openvex.json" \
            release-preflight-evidence/candidate-runtime-components.openvex.json
          cp "${RUNNER_TEMP}/candidate-component-scan/grype-runtime-components.json" \
            release-preflight-evidence/candidate-runtime-component-scan.json
      - name: Retain the exact corresponding source for release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-corresponding-source-v0.1.8
          path: ${{ runner.temp }}/reviewed-runtime-sources
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
      - name: Validate the three consecutive performance runs
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_RUN_ID_1: ${{ inputs.performance_run_id_1 }}
          PERFORMANCE_RUN_ID_2: ${{ inputs.performance_run_id_2 }}
          PERFORMANCE_RUN_ID_3: ${{ inputs.performance_run_id_3 }}
        shell: bash
        run: |
          set -euo pipefail
          run_ids=(
            "${PERFORMANCE_RUN_ID_1}"
            "${PERFORMANCE_RUN_ID_2}"
            "${PERFORMANCE_RUN_ID_3}"
          )
          expected_events=("push" "workflow_dispatch" "workflow_dispatch")
          previous=0
          for offset in 0 1 2; do
            index=$((offset + 1))
            run_id="${run_ids[${offset}]}"
            if ! [[ "${run_id}" =~ ^[1-9][0-9]*$ ]]; then
              echo "performance run ${index} ID must be a positive decimal integer" >&2
              exit 1
            fi
            if ! test "${run_id}" -gt "${previous}"; then
              echo "performance run IDs must be strictly increasing" >&2
              exit 1
            fi
            previous="${run_id}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              > "release-preflight-evidence/performance-run-${index}.json"
            if ! jq -e \
                --argjson runId "${run_id}" \
                --arg sha "${GITHUB_SHA}" \
                --arg repository "${GITHUB_REPOSITORY}" \
                --arg event "${expected_events[${offset}]}" '
                  .id == $runId and
                  .name == "measure Action cold start" and
                  .path == ".github/workflows/action-performance.yml" and
                  .event == $event and
                  .head_branch == "main" and
                  .head_sha == $sha and
                  .repository.full_name == $repository and
                  .status == "completed" and
                  .conclusion == "success" and
                  .run_attempt == 1
                ' "release-preflight-evidence/performance-run-${index}.json" > /dev/null; then
              jq '{id, name, path, event, head_branch, head_sha, status, conclusion, run_attempt}' \
                "release-preflight-evidence/performance-run-${index}.json" >&2
              echo \
                "performance run ${index} does not match the required event, exact main commit, and successful attempt-1 contract" \
                >&2
              exit 1
            fi
          done
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/action-performance.yml/runs?branch=main&per_page=100" \
            > release-preflight-evidence/performance-runs.json
          if ! jq -e \
            --arg sha "${GITHUB_SHA}" \
            --argjson one "${PERFORMANCE_RUN_ID_1}" \
            --argjson two "${PERFORMANCE_RUN_ID_2}" \
            --argjson three "${PERFORMANCE_RUN_ID_3}" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.run_number)
              | (length >= 3 and (.[-3:] | map(.id)) == [$one, $two, $three])
            ' release-preflight-evidence/performance-runs.json > /dev/null; then
            echo "latest three exact-commit performance runs are not the supplied sequence" >&2
            exit 1
          fi
      - name: Download performance evidence 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-performance-v1.0.8-${{ inputs.performance_run_id_1 }}
          path: ${{ runner.temp }}/performance-evidence-1
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ inputs.performance_run_id_1 }}
      - name: Download performance evidence 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-performance-v1.0.8-${{ inputs.performance_run_id_2 }}
          path: ${{ runner.temp }}/performance-evidence-2
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ inputs.performance_run_id_2 }}
      - name: Download performance evidence 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-performance-v1.0.8-${{ inputs.performance_run_id_3 }}
          path: ${{ runner.temp }}/performance-evidence-3
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ inputs.performance_run_id_3 }}
      - name: Recompute all performance results and the 60-sample gate
        env:
          PERFORMANCE_RUN_ID_1: ${{ inputs.performance_run_id_1 }}
          PERFORMANCE_RUN_ID_2: ${{ inputs.performance_run_id_2 }}
          PERFORMANCE_RUN_ID_3: ${{ inputs.performance_run_id_3 }}
        shell: bash
        run: |
          set -euo pipefail
          run_ids=(
            "${PERFORMANCE_RUN_ID_1}"
            "${PERFORMANCE_RUN_ID_2}"
            "${PERFORMANCE_RUN_ID_3}"
          )
          for offset in 0 1 2; do
            index=$((offset + 1))
            evidence="${RUNNER_TEMP}/performance-evidence-${index}"
            run_id="${run_ids[${offset}]}"
            cmp "${evidence}/source/action-performance.yml" \
              .github/workflows/action-performance.yml
            cmp "${evidence}/source/config.yaml" action/performance/config.yaml
            cmp "${evidence}/source/policy.yaml" action/performance/policy.yaml
            cmp "${evidence}/source/summarize_action_performance.py" \
              scripts/summarize_action_performance.py
            cmp "${evidence}/source/combine_action_performance.py" \
              scripts/combine_action_performance.py
            python scripts/summarize_action_performance.py \
              --jobs "${evidence}/jobs.json" \
              --metadata-directory "${evidence}/metadata" \
              --config action/performance/config.yaml \
              --policy action/performance/policy.yaml \
              --output \
                "release-preflight-evidence/recomputed-performance-summary-${index}.json" \
              --repository "${GITHUB_REPOSITORY}" \
              --run-id "${run_id}" \
              --run-attempt 1 \
              --head-sha "${GITHUB_SHA}" \
              --expected-action-sha "${GITHUB_SHA}" \
              --expected-image-digest "${REVIEWED_IMAGE_DIGEST}" \
              --expected-samples 20 \
              --engineering-target-seconds 15 \
              --slo-threshold-seconds 18 \
              --require-run-attempt 1
            cmp "${evidence}/summary.json" \
              "release-preflight-evidence/recomputed-performance-summary-${index}.json"
            cp "${evidence}/summary.json" \
              "release-preflight-evidence/performance-summary-${index}.json"
            cp "${evidence}/jobs.json" \
              "release-preflight-evidence/performance-jobs-${index}.json"
            for sample in "${evidence}"/metadata/sample-*.json; do
              cp "${sample}" \
                "release-preflight-evidence/performance-${index}-$(basename "${sample}")"
            done
          done
          python scripts/combine_action_performance.py \
            --summary release-preflight-evidence/performance-summary-1.json \
            --expected-run-id "${PERFORMANCE_RUN_ID_1}" \
            --summary release-preflight-evidence/performance-summary-2.json \
            --expected-run-id "${PERFORMANCE_RUN_ID_2}" \
            --summary release-preflight-evidence/performance-summary-3.json \
            --expected-run-id "${PERFORMANCE_RUN_ID_3}" \
            --output release-preflight-evidence/combined-performance-summary.json \
            --repository "${GITHUB_REPOSITORY}" \
            --head-sha "${GITHUB_SHA}" \
            --expected-image-digest "${REVIEWED_IMAGE_DIGEST}" \
            --expected-runs 3 \
            --expected-samples-per-run 20 \
            --engineering-target-seconds 15 \
            --slo-threshold-seconds 18
          cp "${RUNNER_TEMP}/performance-evidence-1/source/action-performance.yml" \
            release-preflight-evidence/performance-workflow.yml
      - name: Retain release preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preflight-evidence-v0.1.8
          path: release-preflight-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  verify-public-packages:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - name: Verify unchanged public packages and corrected CA resolution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-package-evidence
          for specification in \
            attest-core:0.1.0 \
            attest-collect:0.1.0 \
            attest-sign:0.1.1 \
            attest-store:0.1.2 \
            attest-policy:0.1.0 \
            attest-cli:0.1.5; do
            distribution="${specification%%:*}"
            version="${specification##*:}"
            metadata="public-package-evidence/pypi-${distribution}-${version}-python-${{ matrix.python }}.json"
            curl --silent --show-error --fail \
              "https://pypi.org/pypi/${distribution}/${version}/json" \
              > "${metadata}"
            jq -e --arg distribution "${distribution}" --arg version "${version}" '
              .info.name == $distribution and
              .info.version == $version and
              (.urls | length) == 2 and
              all(.urls[];
                (.filename | type == "string" and length > 0) and
                (.digests.sha256 | test("^[0-9a-f]{64}$"))
              )
            ' "${metadata}" > /dev/null
          done

          uv venv build/public-package-smoke --python "${{ matrix.python }}" --clear
          uv pip install \
            --python build/public-package-smoke/bin/python \
            --strict \
            --no-cache \
            "attest-sign==${SIGN_VERSION}" \
            "attest-cli==${PUBLIC_CLI_VERSION}"
          uv pip freeze --python build/public-package-smoke/bin/python \
            > "public-package-evidence/installed-python-${{ matrix.python }}.txt"
          build/public-package-smoke/bin/python - <<'PY'
          import json
          import re
          from importlib import metadata
          from pathlib import Path

          expected = {
              "attest-core": "0.1.0",
              "attest-collect": "0.1.0",
              "attest-sign": "0.1.1",
              "attest-store": "0.1.2",
              "attest-policy": "0.1.0",
              "attest-cli": "0.1.5",
          }
          observed = {name: metadata.version(name) for name in expected}
          if observed != expected:
              raise SystemExit(f"unexpected public package set: {observed}")

          certifi = metadata.version("certifi")
          match = re.fullmatch(r"(\d{4})\.(\d{1,2})\.(\d{1,2})", certifi)
          if match is None or tuple(map(int, match.groups())) < (2026, 10, 19):
              raise SystemExit(f"affected certifi resolution: {certifi}")
          dnspython = metadata.version("dnspython")
          match = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", dnspython)
          if match is None or tuple(map(int, match.groups())) < (2, 9, 0):
              raise SystemExit(f"affected dnspython resolution: {dnspython}")
          for excluded in ("msgpack", "virtualenv", "python-discovery"):
              try:
                  metadata.version(excluded)
              except metadata.PackageNotFoundError:
                  continue
              raise SystemExit(f"development-only package entered runtime: {excluded}")

          evidence = {
              "schemaVersion": 1,
              "python": "${{ matrix.python }}",
              "packages": observed,
              "certifi": certifi,
              "dnspython": dnspython,
              "minimumSafeCertifi": "2026.10.19",
              "minimumSafeDnspython": "2.9.0",
              "pythonDistributionsPublished": [],
          }
          Path(
              "public-package-evidence/verification-python-${{ matrix.python }}.json"
          ).write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          build/public-package-smoke/bin/attest --help > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-package-evidence-python-${{ matrix.python }}-v0.1.8
          path: public-package-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  assemble-assets:
    needs: [preflight, verify-public-packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-preflight-evidence-v0.1.8
          path: preflight
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-corresponding-source-v0.1.8
          path: corresponding-source
      - name: Assemble the image-only security release assets
        env:
          PERFORMANCE_RUN_ID_1: ${{ inputs.performance_run_id_1 }}
          PERFORMANCE_RUN_ID_2: ${{ inputs.performance_run_id_2 }}
          PERFORMANCE_RUN_ID_3: ${{ inputs.performance_run_id_3 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp action/action.yml release-assets/action-v1.0.8.yml
          cp preflight/candidate-image-manifest.json \
            release-assets/image-manifest-v0.1.8.json
          cp preflight/candidate-image-manifest-linux-amd64.json \
            release-assets/image-manifest-linux-amd64-v0.1.8.json
          cp preflight/candidate-image-manifest-linux-arm64.json \
            release-assets/image-manifest-linux-arm64-v0.1.8.json
          cp preflight/candidate-image-sbom.spdx.json \
            release-assets/image-sbom-v0.1.8.spdx.json
          cp preflight/candidate-image-provenance.slsa.json \
            release-assets/image-provenance-v0.1.8.slsa.json
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner \
            --format=posix -C corresponding-source -cf - . \
            | gzip -n -9 > release-assets/action-corresponding-source-v1.0.8.tar.gz
          cp preflight/performance-summary-1.json \
            release-assets/performance-run-1-summary-v1.0.8.json
          cp preflight/performance-summary-2.json \
            release-assets/performance-run-2-summary-v1.0.8.json
          cp preflight/performance-summary-3.json \
            release-assets/performance-run-3-summary-v1.0.8.json
          cp preflight/combined-performance-summary.json \
            release-assets/performance-summary-v1.0.8.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = {
              "schemaVersion": 1,
              "requirement": "REQ-F11-340",
              "acceptanceCriterion": "AC-F11-340",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "productVersion": os.environ["PRODUCT_VERSION"],
              "productTag": os.environ["PRODUCT_TAG"],
              "actionTag": os.environ["ACTION_VERSION_TAG"],
              "publicCliVersion": os.environ["PUBLIC_CLI_VERSION"],
              "pythonDistributionsPublished": [],
              "candidate": {
                  "runId": int(os.environ["REVIEWED_CANDIDATE_RUN_ID"]),
                  "source": os.environ["REVIEWED_CANDIDATE_SOURCE_SHA"],
                  "contextDigest": os.environ["REVIEWED_CONTEXT_DIGEST"],
                  "imageDigest": os.environ["REVIEWED_IMAGE_DIGEST"],
                  "sourceArtifactDigest": Path(
                      "preflight/candidate-source-artifact-digest.txt"
                  ).read_text(encoding="utf-8").strip(),
                  "sourceArtifactReference": Path(
                      "preflight/candidate-source-artifact-reference.txt"
                  ).read_text(encoding="utf-8").strip(),
              },
              "performanceRunIds": [
                  int(os.environ["PERFORMANCE_RUN_ID_1"]),
                  int(os.environ["PERFORMANCE_RUN_ID_2"]),
                  int(os.environ["PERFORMANCE_RUN_ID_3"]),
              ],
              "majorTagMoved": False,
          }
          Path("release-assets/release-contract-v0.1.8.json").write_text(
              json.dumps(contract, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          (
            cd release-assets
            sha256sum -- * | LC_ALL=C sort --key=2 > SHA256SUMS
            LC_ALL=C sort --check=quiet --key=2 SHA256SUMS
          )
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-v0.1.8
          path: release-assets
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  attest-artifacts:
    needs: assemble-assets
    if: >-
      always() && needs.assemble-assets.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-v0.1.8
          path: release-assets
      - name: Attest the image-only release assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publicly verify every release asset attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset-attestation-evidence
          for subject in release-assets/*; do
            name="$(basename "${subject}")"
            gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-digest "${GITHUB_SHA}" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --format json \
              > "release-asset-attestation-evidence/${name}.verification.json"
          done
          cp "${{ steps.attest.outputs.bundle-path }}" \
            release-asset-attestation-evidence/github-release-asset-attestations.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-asset-attestation-evidence-v0.1.8
          path: release-asset-attestation-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  promote-image:
    needs: [preflight, verify-public-packages]
    if: >-
      always() &&
      needs.preflight.result == 'success' &&
      needs.verify-public-packages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Promote the exact candidate manifest without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          release_image="${IMAGE_NAME}:${PRODUCT_VERSION}"
          mkdir -p image-promotion-evidence
          inspection_state=""
          for attempt in $(seq 1 5); do
            if docker buildx imagetools inspect "${release_image}" --raw \
              > image-promotion-evidence/promoted-image-manifest.json \
              2> image-promotion-evidence/initial-inspection.txt; then
              inspection_state=present
              break
            fi
            if grep -Eiq 'manifest unknown|manifest_unknown|not found' \
              image-promotion-evidence/initial-inspection.txt; then
              inspection_state=absent
              break
            fi
            if test "${attempt}" = "5"; then
              echo "image promotion: registry state remained indeterminate" >&2
              exit 1
            fi
            sleep 2
          done
          if test "${inspection_state}" = "present"; then
            promotion_state=existing-exact
          elif test "${inspection_state}" = "absent"; then
            docker buildx imagetools create \
              --tag "${release_image}" \
              "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}"
            docker buildx imagetools inspect "${release_image}" --raw \
              > image-promotion-evidence/promoted-image-manifest.json
            promotion_state=created
          else
            echo "image promotion: registry state was not classified" >&2
            exit 1
          fi
          printf 'inspection-state=%s\n' "${inspection_state}" \
            >> image-promotion-evidence/initial-inspection.txt
          observed="sha256:$(sha256sum image-promotion-evidence/promoted-image-manifest.json | cut -d ' ' -f 1)"
          test "${observed}" = "${REVIEWED_IMAGE_DIGEST}"
          printf '%s\n' "${release_image}@${REVIEWED_IMAGE_DIGEST}" \
            > image-promotion-evidence/release-image.txt
          printf '%s\n' "${promotion_state}" \
            > image-promotion-evidence/promotion-state.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-promotion-evidence-v0.1.8
          path: image-promotion-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  dogfood:
    needs: [promote-image, verify-public-packages]
    if: >-
      always() &&
      needs.promote-image.result == 'success' &&
      needs.verify-public-packages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_IDENTITY: https://github.com/Parth2412/attest/.github/workflows/release.yml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - name: Install the exact unchanged public signer and CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dogfood-evidence
          uv venv build/release-dogfood --python 3.12 --clear
          uv pip install \
            --python build/release-dogfood/bin/python \
            --strict \
            --no-cache \
            "attest-cli==${PUBLIC_CLI_VERSION}"
          build/release-dogfood/bin/python - <<'PY'
          from importlib import metadata

          if metadata.version("attest-cli") != "0.1.5":
              raise SystemExit("unexpected public CLI version")
          if metadata.version("attest-sign") != "0.1.1":
              raise SystemExit("unexpected public signer version")
          PY
      - name: Attest and publicly verify the release source
        shell: bash
        run: |
          set -euo pipefail
          build/release-dogfood/bin/attest run \
            --output "release-dogfood-evidence/attest-${PRODUCT_TAG}.bundle.json" \
            --repository . \
            --work-directory release-dogfood-evidence/work \
            --policy release/attest-release-policy.yaml \
            --base "${PRIOR_RELEASE_SHA}" \
            --head "${GITHUB_SHA}" \
            --target-branch main \
            --git-backend subprocess \
            --signing-environment production \
            --identity "${RELEASE_IDENTITY}" \
            --issuer "${OIDC_ISSUER}" \
            --verify-environment production \
            --online \
            --store-backend filesystem \
            --store-directory release-dogfood-evidence/store \
            --fallback-directory release-dogfood-evidence/fallback \
            --config release/attest-release-config.yaml \
            --json \
            > release-dogfood-evidence/attest-run-report.json
          build/release-dogfood/bin/attest verify \
            --input "release-dogfood-evidence/attest-${PRODUCT_TAG}.bundle.json" \
            --repository . \
            --base "${PRIOR_RELEASE_SHA}" \
            --head "${GITHUB_SHA}" \
            --identity "${RELEASE_IDENTITY}" \
            --issuer "${OIDC_ISSUER}" \
            --verify-environment production \
            --online \
            --config release/attest-release-config.yaml \
            --json \
            > release-dogfood-evidence/public-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dogfood-evidence-v0.1.8
          path: release-dogfood-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  publish-release:
    needs: [attest-artifacts, dogfood, promote-image, verify-public-packages]
    if: >-
      always() &&
      needs.attest-artifacts.result == 'success' &&
      needs.dogfood.result == 'success' &&
      needs.promote-image.result == 'success' &&
      needs.verify-public-packages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-v0.1.8
          path: retained/release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-preflight-evidence-v0.1.8
          path: retained/preflight
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-asset-attestation-evidence-v0.1.8
          path: retained/attestations
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-promotion-evidence-v0.1.8
          path: retained/promotion
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dogfood-evidence-v0.1.8
          path: retained/dogfood
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-package-evidence-python-3.12-v0.1.8
          path: retained/public-package-python-3.12
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-package-evidence-python-3.13-v0.1.8
          path: retained/public-package-python-3.13
      - name: Assemble the immutable release evidence index
        env:
          PERFORMANCE_RUN_ID_1: ${{ inputs.performance_run_id_1 }}
          PERFORMANCE_RUN_ID_2: ${{ inputs.performance_run_id_2 }}
          PERFORMANCE_RUN_ID_3: ${{ inputs.performance_run_id_3 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-release-assets
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path("final-release-assets")
          for path in sorted(Path("retained").rglob("*"), key=lambda item: item.as_posix()):
              relative = path.relative_to("retained")
              if any(part.startswith(".") for part in relative.parts):
                  raise SystemExit(f"hidden retained evidence is forbidden: {path}")
              if path.is_dir() and not path.is_symlink():
                  continue
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"invalid retained evidence: {path}")
              if path.stat().st_size == 0:
                  raise SystemExit(f"empty retained evidence is forbidden: {path}")
              if len(relative.parts) < 2:
                  raise SystemExit(f"unnamespaced retained evidence is forbidden: {path}")
              if relative.parts[0] == "release-assets":
                  if len(relative.parts) != 2:
                      raise SystemExit(f"nested primary release asset is forbidden: {path}")
                  target_name = path.name
              else:
                  target_name = "--".join(relative.parts)
              target = root / target_name
              if target.exists():
                  raise SystemExit(f"duplicate release asset name: {target_name}")
              shutil.copyfile(path, target)

          assets = []
          for path in sorted(root.iterdir(), key=lambda item: item.name):
              content = path.read_bytes()
              assets.append(
                  {
                      "name": path.name,
                      "sha256": hashlib.sha256(content).hexdigest(),
                      "size": len(content),
                  }
              )
          index = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "releaseRunId": int(os.environ["GITHUB_RUN_ID"]),
              "performanceRunIds": [
                  int(os.environ["PERFORMANCE_RUN_ID_1"]),
                  int(os.environ["PERFORMANCE_RUN_ID_2"]),
                  int(os.environ["PERFORMANCE_RUN_ID_3"]),
              ],
              "candidateRunId": int(os.environ["REVIEWED_CANDIDATE_RUN_ID"]),
              "candidateSource": os.environ["REVIEWED_CANDIDATE_SOURCE_SHA"],
              "contextDigest": os.environ["REVIEWED_CONTEXT_DIGEST"],
              "imageDigest": os.environ["REVIEWED_IMAGE_DIGEST"],
              "publicCliVersion": os.environ["PUBLIC_CLI_VERSION"],
              "pythonDistributionsPublished": [],
              "majorTagMoved": False,
              "tags": [os.environ["PRODUCT_TAG"], os.environ["ACTION_VERSION_TAG"]],
              "assets": assets,
          }
          (root / "release-evidence-index.json").write_text(
              json.dumps(index, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Create, verify, and publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_state=absent
          release_id=""
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > release-pages.json
          release_count="$(jq -r --arg tag "${PRODUCT_TAG}" \
            '[.[][] | select(.tag_name == $tag)] | length' release-pages.json)"
          test "${release_count}" -le 1
          if test "${release_count}" = "1"; then
            release_id="$(jq -r --arg tag "${PRODUCT_TAG}" \
              '.[][] | select(.tag_name == $tag) | .id' release-pages.json)"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              > release-state.json
            jq -e --arg sha "${GITHUB_SHA}" --arg tag "${PRODUCT_TAG}" '
              .tag_name == $tag and
              .target_commitish == $sha and
              .prerelease == false
            ' release-state.json > /dev/null
            if jq -e '.draft == true' release-state.json > /dev/null; then
              release_state=draft
            elif jq -e '.draft == false and .immutable == true' \
              release-state.json > /dev/null; then
              release_state=published
            else
              echo "release publication: existing release is neither resumable nor immutable" >&2
              exit 1
            fi
          fi

          if test "${release_state}" = "absent"; then
            gh release create "${PRODUCT_TAG}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title "attest ${PRODUCT_VERSION} / Action ${ACTION_VERSION_TAG}" \
              --notes-file release/RELEASE_NOTES-v0.1.8.md
            release_state=draft
            for attempt in $(seq 1 30); do
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                > release-pages.json
              release_count="$(jq -r --arg tag "${PRODUCT_TAG}" \
                '[.[][] | select(.tag_name == $tag)] | length' release-pages.json)"
              test "${release_count}" -le 1
              release_id="$(jq -r --arg tag "${PRODUCT_TAG}" \
                '.[][] | select(.tag_name == $tag) | .id' release-pages.json)"
              if test -n "${release_id}"; then
                break
              fi
              if test "${attempt}" = "30"; then
                echo "release publication: draft release was not observed" >&2
                exit 1
              fi
              sleep 2
            done
          fi
          if test "${release_state}" = "draft"; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              > release-state.json
            jq -e \
              --argjson releaseId "${release_id}" \
              --arg tag "${PRODUCT_TAG}" \
              --arg sha "${GITHUB_SHA}" '
                .id == $releaseId and
                .tag_name == $tag and
                .target_commitish == $sha and
                .draft == true and
                .prerelease == false and
                .immutable == false
              ' release-state.json > /dev/null
            python3 - <<'PY'
          import json
          from pathlib import Path

          release = json.loads(Path("release-state.json").read_text(encoding="utf-8"))
          local_names = {
              path.name
              for path in Path("final-release-assets").iterdir()
              if path.is_file()
          }
          remote_names = []
          stale = []
          for asset in release["assets"]:
              asset_id = asset.get("id")
              name = asset.get("name")
              if not isinstance(asset_id, int) or asset_id <= 0:
                  raise SystemExit("release publication: invalid draft asset ID")
              if not isinstance(name, str) or not name:
                  raise SystemExit("release publication: invalid draft asset name")
              remote_names.append(name)
              if name not in local_names:
                  stale.append({"id": asset_id, "name": name})
          if len(remote_names) != len(set(remote_names)):
              raise SystemExit("release publication: duplicate draft asset names")
          Path("stale-release-assets.json").write_text(
              json.dumps(stale, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
            while IFS= read -r asset_id; do
              test "${asset_id}" -gt 0
              gh api --silent --method DELETE \
                "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done < <(jq -r '.[].id' stale-release-assets.json)
            gh release upload "${PRODUCT_TAG}" final-release-assets/* --clobber
          fi

          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              > release-state.json
            if python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          release = json.loads(Path("release-state.json").read_text(encoding="utf-8"))
          remote = {item["name"]: item["digest"] for item in release["assets"]}
          local = {
              path.name: f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}"
              for path in Path("final-release-assets").iterdir()
              if path.is_file()
          }
          if remote != local:
              raise SystemExit("release assets differ from retained local evidence")
          PY
            then
              break
            fi
            if test "${attempt}" = "30"; then
              echo "release publication: exact asset digests were not observed" >&2
              exit 1
            fi
            sleep 2
          done

          if test "${release_state}" = "draft"; then
            jq -n '{draft: false, make_latest: "true"}' \
              | gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                --input - > release-publish-request.json
          fi
          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" \
              > release-published.json
            if jq -e --arg sha "${GITHUB_SHA}" '
              .target_commitish == $sha and
              .draft == false and
              .prerelease == false and
              .immutable == true
            ' release-published.json > /dev/null; then
              break
            fi
            if test "${attempt}" = "30"; then
              echo "release publication: immutable state was not observed" >&2
              exit 1
            fi
            sleep 10
          done

          if action_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ACTION_VERSION_TAG}" \
            --jq '.object.sha' 2>/dev/null)"; then
            test "${action_sha}" = "${GITHUB_SHA}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --field ref="refs/tags/${ACTION_VERSION_TAG}" \
              --field sha="${GITHUB_SHA}" > /dev/null
          fi
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" \
              = "${GITHUB_SHA}"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1" --jq '.object.sha')" \
            = "${PRIOR_RELEASE_SHA}"
