name: release

on:
  workflow_dispatch:
    inputs:
      performance_run_id_1:
        description: First consecutive attempt-1 performance run for this exact main commit
        required: true
        type: string
      performance_run_id_2:
        description: Second consecutive attempt-1 performance run for this exact main commit
        required: true
        type: string
      performance_run_id_3:
        description: Third consecutive attempt-1 performance run for this exact main commit
        required: true
        type: string
      prior_sign_publication_run_id:
        description: Prior release run that published the exact attest-sign artifacts
        required: false
        type: string
      prior_cli_publication_run_id:
        description: Prior release run that published the exact attest-cli artifacts
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-v0.1.5
  cancel-in-progress: false

env:
  PRODUCT_VERSION: "0.1.5"
  PRODUCT_TAG: v0.1.5
  ACTION_VERSION_TAG: v1.0.5
  SIGN_VERSION: "0.1.1"
  PUBLIC_CLI_VERSION: "0.1.4"
  IMAGE_NAME: ghcr.io/parth2412/attest
  PRIOR_RELEASE_SHA: 4e73dcaf888f15967da66826d48cca5ac6684fcb
  REVIEWED_CANDIDATE_RUN_ID: 37770395880
  REVIEWED_CANDIDATE_SOURCE_SHA: e1ad2605b7780d42ab150d3e08f9aa83f6a4ed2b
  REVIEWED_CONTEXT_DIGEST: sha256:548af4fb214b5fd7413fb5d85be9e850b0d24c150c973c6e3d649e92cd2d4cb1
  REVIEWED_IMAGE_DIGEST: sha256:b1046837b75ba271943b561d03392fa7b250d7825caa262f8852fbf56a62179d

jobs:
  preflight:
    if: github.repository == 'Parth2412/attest' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate source and immutable repository controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "main"
          uv lock --check
          mkdir -p release-preflight-evidence
          test "$(git rev-parse "${REVIEWED_CANDIDATE_SOURCE_SHA}:uv.lock")" \
            = "$(git hash-object uv.lock)"

          for distribution in attest-sign attest-cli; do
            environment="pypi-${distribution}"
            gh api "repos/${GITHUB_REPOSITORY}/environments/${environment}" \
              > "release-preflight-evidence/${environment}-environment.json"
            jq -e --arg owner "${GITHUB_REPOSITORY_OWNER}" --arg name "${environment}" '
              .name == $name and
              .can_admins_bypass == false and
              .deployment_branch_policy.protected_branches == true and
              .deployment_branch_policy.custom_branch_policies == false and
              ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 1 and
              ([
                .protection_rules[] |
                select(.type == "required_reviewers") |
                .prevent_self_review
              ] == [false]) and
              ([
                .protection_rules[] |
                select(.type == "required_reviewers") |
                .reviewers[] |
                {type, login: .reviewer.login}
              ] == [{type: "User", login: $owner}])
            ' "release-preflight-evidence/${environment}-environment.json" > /dev/null
          done

          gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            > release-preflight-evidence/rulesets.json
          ruleset_id="$(jq -er \
            '.[] | select(.name == "Protect immutable release tags" and .target == "tag" and .enforcement == "active") | .id' \
            release-preflight-evidence/rulesets.json)"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
            > release-preflight-evidence/tag-ruleset.json
          jq -e '
            (.bypass_actors // []) == [] and
            (.conditions.ref_name.include | sort) ==
              ([
                "refs/tags/v0.1.0",
                "refs/tags/v0.1.1",
                "refs/tags/v0.1.2",
                "refs/tags/v0.1.3",
                "refs/tags/v0.1.4",
                "refs/tags/v0.1.5",
                "refs/tags/v1.0.0",
                "refs/tags/v1.0.1",
                "refs/tags/v1.0.2",
                "refs/tags/v1.0.3",
                "refs/tags/v1.0.4",
                "refs/tags/v1.0.5"
              ] | sort) and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | sort) == (["deletion", "update"] | sort)
          ' release-preflight-evidence/tag-ruleset.json > /dev/null

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > release-preflight-evidence/main-ci-runs.json
          jq -e --arg sha "${GITHUB_SHA}" \
            'any(.workflow_runs[]; .head_sha == $sha and .run_attempt == 1 and .conclusion == "success")' \
            release-preflight-evidence/main-ci-runs.json > /dev/null

          for tag in v0.1.4 v1.0.4 v1; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" \
              = "${PRIOR_RELEASE_SHA}"
          done
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            if observed="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha' 2>/dev/null)"; then
              test "${observed}" = "${GITHUB_SHA}"
            fi
          done

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.4" \
            > release-preflight-evidence/prior-release.json
          jq -e --arg sha "${PRIOR_RELEASE_SHA}" '
            .tag_name == "v0.1.4" and
            .target_commitish == $sha and
            .draft == false and
            .prerelease == false and
            .immutable == true
          ' release-preflight-evidence/prior-release.json > /dev/null
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > release-preflight-evidence/release-pages.json
          jq -e --arg sha "${GITHUB_SHA}" --arg tag "${PRODUCT_TAG}" '
            [.[][] | select(.tag_name == $tag)] as $matches |
            ($matches | length) <= 1 and
            (
              ($matches | length) == 0 or
              (
                $matches[0].target_commitish == $sha and
                $matches[0].prerelease == false and
                (
                  ($matches[0].draft == true and $matches[0].immutable == false) or
                  ($matches[0].draft == false and $matches[0].immutable == true)
                )
              )
            )
          ' release-preflight-evidence/release-pages.json > /dev/null
      - name: Validate the reviewed candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEWED_CANDIDATE_RUN_ID}" \
            > release-preflight-evidence/candidate-run.json
          jq -e \
            --arg source "${REVIEWED_CANDIDATE_SOURCE_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" '
              .name == "action-candidate" and
              .path == ".github/workflows/action-candidate.yml" and
              .event == "push" and
              .head_branch == "dev" and
              .head_sha == $source and
              .repository.full_name == $repository and
              .status == "completed" and
              .conclusion == "success" and
              .run_attempt == 1
            ' release-preflight-evidence/candidate-run.json > /dev/null
      - name: Download the reviewed candidate build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-build-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-build
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Download the reviewed amd64 scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-scan-linux-amd64-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-scan-amd64
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Download the reviewed arm64 scan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-scan-linux-arm64-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-scan-arm64
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Download the reviewed candidate attestation evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-attestation-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-attestation
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Prove candidate context, image, scans, and identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project python scripts/prepare_action_context.py \
            "${RUNNER_TEMP}/release-action-context" \
            --manifest-output release-preflight-evidence/current-context-manifest.json \
            --digest-output release-preflight-evidence/current-context-digest.txt
          uv run --no-project python scripts/validate_release_candidate.py \
            --evidence-directory "${RUNNER_TEMP}/candidate-build" \
            --current-context-manifest release-preflight-evidence/current-context-manifest.json \
            --action-manifest action/action.yml \
            --expected-context-digest "${REVIEWED_CONTEXT_DIGEST}" \
            --expected-image-digest "${REVIEWED_IMAGE_DIGEST}"

          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}" --raw \
            > release-preflight-evidence/live-image-manifest.json
          observed="sha256:$(sha256sum release-preflight-evidence/live-image-manifest.json | cut -d ' ' -f 1)"
          test "${observed}" = "${REVIEWED_IMAGE_DIGEST}"
          cmp "${RUNNER_TEMP}/candidate-build/manifest.json" \
            release-preflight-evidence/live-image-manifest.json
          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}" --format '{{json .Image}}' \
            > release-preflight-evidence/live-image-configs.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          images = json.loads(
              Path("release-preflight-evidence/live-image-configs.json").read_text(
                  encoding="utf-8"
              )
          )
          if set(images) != {"linux/amd64", "linux/arm64"}:
              raise SystemExit(f"unexpected live image platforms: {sorted(images)}")
          expected = {
              "io.github.parth2412.attest.context-digest": os.environ[
                  "REVIEWED_CONTEXT_DIGEST"
              ],
              "org.opencontainers.image.revision": os.environ[
                  "REVIEWED_CANDIDATE_SOURCE_SHA"
              ],
              "org.opencontainers.image.source": "https://github.com/Parth2412/attest",
              "org.opencontainers.image.version": "0.1.5-candidate",
          }
          for platform, image in images.items():
              if image.get("config", {}).get("Labels") != expected:
                  raise SystemExit(f"invalid image labels for {platform}")
          PY

          python3 scripts/check_action_scan.py \
            "${RUNNER_TEMP}/candidate-scan-amd64/trivy-linux-amd64.json"
          python3 scripts/check_action_scan.py \
            "${RUNNER_TEMP}/candidate-scan-arm64/trivy-linux-arm64.json"
          jq -e \
            --arg imageRef "${IMAGE_NAME}:candidate-${REVIEWED_CANDIDATE_SOURCE_SHA}-${REVIEWED_CANDIDATE_RUN_ID}-1" \
            --arg context "${REVIEWED_CONTEXT_DIGEST}" \
            --arg image "${REVIEWED_IMAGE_DIGEST}" '
              ."image-ref" == $imageRef and
              ."context-digest" == $context and
              ."image-digest" == $image
            ' "${RUNNER_TEMP}/candidate-attestation/candidate-outputs.json" > /dev/null
          gh attestation verify \
            "oci://${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/action-candidate.yml" \
            --source-digest "${REVIEWED_CANDIDATE_SOURCE_SHA}" \
            --source-ref refs/heads/dev \
            --deny-self-hosted-runners \
            --format json \
            > release-preflight-evidence/candidate-attestation-verification.json

          cp "${RUNNER_TEMP}/candidate-build/context-manifest.json" \
            release-preflight-evidence/candidate-context-manifest.json
          cp "${RUNNER_TEMP}/candidate-build/manifest.json" \
            release-preflight-evidence/candidate-image-manifest.json
          cp "${RUNNER_TEMP}/candidate-build/manifest-linux-amd64.json" \
            release-preflight-evidence/candidate-image-manifest-linux-amd64.json
          cp "${RUNNER_TEMP}/candidate-build/manifest-linux-arm64.json" \
            release-preflight-evidence/candidate-image-manifest-linux-arm64.json
          cp "${RUNNER_TEMP}/candidate-build/sbom.spdx.json" \
            release-preflight-evidence/candidate-image-sbom.spdx.json
          cp "${RUNNER_TEMP}/candidate-build/provenance.slsa.json" \
            release-preflight-evidence/candidate-image-provenance.slsa.json
          cp "${RUNNER_TEMP}/candidate-scan-amd64/trivy-linux-amd64.json" \
            release-preflight-evidence/candidate-scan-linux-amd64.json
          cp "${RUNNER_TEMP}/candidate-scan-arm64/trivy-linux-arm64.json" \
            release-preflight-evidence/candidate-scan-linux-arm64.json
          cp "${RUNNER_TEMP}/candidate-attestation/candidate-outputs.json" \
            release-preflight-evidence/candidate-outputs.json
      - name: Validate the three consecutive performance runs
        env:
          GH_TOKEN: ${{ github.token }}
          PERFORMANCE_RUN_ID_1: ${{ inputs.performance_run_id_1 }}
          PERFORMANCE_RUN_ID_2: ${{ inputs.performance_run_id_2 }}
          PERFORMANCE_RUN_ID_3: ${{ inputs.performance_run_id_3 }}
        shell: bash
        run: |
          set -euo pipefail
          run_ids=(
            "${PERFORMANCE_RUN_ID_1}"
            "${PERFORMANCE_RUN_ID_2}"
            "${PERFORMANCE_RUN_ID_3}"
          )
          expected_events=("push" "workflow_dispatch" "workflow_dispatch")
          previous=0
          for offset in 0 1 2; do
            index=$((offset + 1))
            run_id="${run_ids[${offset}]}"
            [[ "${run_id}" =~ ^[1-9][0-9]*$ ]]
            test "${run_id}" -gt "${previous}"
            previous="${run_id}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              > "release-preflight-evidence/performance-run-${index}.json"
            jq -e \
              --argjson runId "${run_id}" \
              --arg sha "${GITHUB_SHA}" \
              --arg repository "${GITHUB_REPOSITORY}" \
              --arg event "${expected_events[${offset}]}" '
                .id == $runId and
                .name == "measure Action cold start" and
                .path == ".github/workflows/action-performance.yml" and
                .event == $event and
                .head_branch == "main" and
                .head_sha == $sha and
                .repository.full_name == $repository and
                .status == "completed" and
                .conclusion == "success" and
                .run_attempt == 1
              ' "release-preflight-evidence/performance-run-${index}.json" > /dev/null
          done
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/action-performance.yml/runs?branch=main&per_page=100" \
            > release-preflight-evidence/performance-runs.json
          if ! jq -e \
            --arg sha "${GITHUB_SHA}" \
            --argjson one "${PERFORMANCE_RUN_ID_1}" \
            --argjson two "${PERFORMANCE_RUN_ID_2}" \
            --argjson three "${PERFORMANCE_RUN_ID_3}" '
              [.workflow_runs[] | select(.head_sha == $sha)]
              | sort_by(.run_number)
              | (length >= 3 and (.[-3:] | map(.id)) == [$one, $two, $three])
            ' release-preflight-evidence/performance-runs.json > /dev/null; then
            echo "latest three exact-commit performance runs are not the supplied sequence" >&2
            exit 1
          fi
      - name: Download performance evidence 1
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-performance-v1.0.5-${{ inputs.performance_run_id_1 }}
          path: ${{ runner.temp }}/performance-evidence-1
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ inputs.performance_run_id_1 }}
      - name: Download performance evidence 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-performance-v1.0.5-${{ inputs.performance_run_id_2 }}
          path: ${{ runner.temp }}/performance-evidence-2
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ inputs.performance_run_id_2 }}
      - name: Download performance evidence 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-performance-v1.0.5-${{ inputs.performance_run_id_3 }}
          path: ${{ runner.temp }}/performance-evidence-3
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ inputs.performance_run_id_3 }}
      - name: Recompute all performance results and the 60-sample gate
        env:
          PERFORMANCE_RUN_ID_1: ${{ inputs.performance_run_id_1 }}
          PERFORMANCE_RUN_ID_2: ${{ inputs.performance_run_id_2 }}
          PERFORMANCE_RUN_ID_3: ${{ inputs.performance_run_id_3 }}
        shell: bash
        run: |
          set -euo pipefail
          run_ids=(
            "${PERFORMANCE_RUN_ID_1}"
            "${PERFORMANCE_RUN_ID_2}"
            "${PERFORMANCE_RUN_ID_3}"
          )
          for offset in 0 1 2; do
            index=$((offset + 1))
            evidence="${RUNNER_TEMP}/performance-evidence-${index}"
            run_id="${run_ids[${offset}]}"
            cmp "${evidence}/source/action-performance.yml" \
              .github/workflows/action-performance.yml
            cmp "${evidence}/source/config.yaml" action/performance/config.yaml
            cmp "${evidence}/source/policy.yaml" action/performance/policy.yaml
            cmp "${evidence}/source/summarize_action_performance.py" \
              scripts/summarize_action_performance.py
            cmp "${evidence}/source/combine_action_performance.py" \
              scripts/combine_action_performance.py
            python scripts/summarize_action_performance.py \
              --jobs "${evidence}/jobs.json" \
              --metadata-directory "${evidence}/metadata" \
              --config action/performance/config.yaml \
              --policy action/performance/policy.yaml \
              --output \
                "release-preflight-evidence/recomputed-performance-summary-${index}.json" \
              --repository "${GITHUB_REPOSITORY}" \
              --run-id "${run_id}" \
              --run-attempt 1 \
              --head-sha "${GITHUB_SHA}" \
              --expected-action-sha "${GITHUB_SHA}" \
              --expected-image-digest "${REVIEWED_IMAGE_DIGEST}" \
              --expected-samples 20 \
              --threshold-seconds 15 \
              --require-run-attempt 1
            cmp "${evidence}/summary.json" \
              "release-preflight-evidence/recomputed-performance-summary-${index}.json"
            cp "${evidence}/summary.json" \
              "release-preflight-evidence/performance-summary-${index}.json"
            cp "${evidence}/jobs.json" \
              "release-preflight-evidence/performance-jobs-${index}.json"
            for sample in "${evidence}"/metadata/sample-*.json; do
              cp "${sample}" \
                "release-preflight-evidence/performance-${index}-$(basename "${sample}")"
            done
          done
          python scripts/combine_action_performance.py \
            --summary release-preflight-evidence/performance-summary-1.json \
            --expected-run-id "${PERFORMANCE_RUN_ID_1}" \
            --summary release-preflight-evidence/performance-summary-2.json \
            --expected-run-id "${PERFORMANCE_RUN_ID_2}" \
            --summary release-preflight-evidence/performance-summary-3.json \
            --expected-run-id "${PERFORMANCE_RUN_ID_3}" \
            --output release-preflight-evidence/combined-performance-summary.json \
            --repository "${GITHUB_REPOSITORY}" \
            --head-sha "${GITHUB_SHA}" \
            --expected-image-digest "${REVIEWED_IMAGE_DIGEST}" \
            --expected-runs 3 \
            --expected-samples-per-run 20 \
            --threshold-seconds 15
          cp "${RUNNER_TEMP}/performance-evidence-1/source/action-performance.yml" \
            release-preflight-evidence/performance-workflow.yml
      - name: Retain release preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preflight-evidence-v0.1.5
          path: release-preflight-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  build-patches:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - name: Build and validate only the signer and CLI patches
        shell: bash
        run: |
          set -euo pipefail
          uv build --package attest-sign --out-dir build/sign-dist \
            --clear --no-create-gitignore
          uv run --no-project python scripts/validate_release_artifacts.py \
            build/sign-dist \
            --manifest release/patches/0.1.1-sign.toml \
            --hash-output build/SIGN-SHA256SUMS
          uv build --package attest-cli --out-dir build/cli-dist \
            --clear --no-create-gitignore
          uv run --no-project python scripts/validate_release_artifacts.py \
            build/cli-dist \
            --manifest release/patches/0.1.4.toml \
            --hash-output build/CLI-SHA256SUMS
          mkdir -p build/python-release-assets
          cp build/sign-dist/* build/python-release-assets/
          cp build/cli-dist/* build/python-release-assets/
          cat build/SIGN-SHA256SUMS build/CLI-SHA256SUMS \
            > build/python-release-assets/SHA256SUMS
          git archive \
            --format=tar.gz \
            --prefix="attest-${PRODUCT_VERSION}/" \
            --output="build/python-release-assets/attest-${PRODUCT_VERSION}-source.tar.gz" \
            "${GITHUB_SHA}"
          cd build/python-release-assets
          sha256sum "attest-${PRODUCT_VERSION}-source.tar.gz" >> SHA256SUMS
          LC_ALL=C sort --key=2 --output=SHA256SUMS SHA256SUMS
          LC_ALL=C sort --check=quiet --key=2 SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sign-distributions-v0.1.1
          path: build/sign-dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-distributions-v0.1.4
          path: build/cli-dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-assets-v0.1.5
          path: build/python-release-assets
          if-no-files-found: error
          retention-days: 90

  smoke-patches:
    needs: build-patches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sign-distributions-v0.1.1
          path: sign-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-distributions-v0.1.4
          path: cli-dist
      - name: Install and smoke-test the signer and CLI patches
        shell: bash
        run: |
          set -euo pipefail
          uv venv build/patch-smoke --python "${{ matrix.python }}" --clear
          uv pip install \
            --python build/patch-smoke/bin/python \
            --strict \
            --no-cache \
            sign-dist/attest_sign-0.1.1-py3-none-any.whl \
            cli-dist/attest_cli-0.1.4-py3-none-any.whl
          build/patch-smoke/bin/python - <<'PY'
          from importlib import metadata

          assert metadata.version("attest-sign") == "0.1.1"
          assert metadata.version("attest-cli") == "0.1.4"
          assert metadata.version("attest-store") == "0.1.1"
          for distribution in ("attest-core", "attest-collect", "attest-policy"):
              assert metadata.version(distribution) == "0.1.0"
          PY
          build/patch-smoke/bin/attest --help > /dev/null

  assemble-assets:
    needs: [preflight, build-patches]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-preflight-evidence-v0.1.5
          path: preflight
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-assets-v0.1.5
          path: python-release-assets
      - name: Assemble the bounded package and image release assets
        env:
          PERFORMANCE_RUN_ID_1: ${{ inputs.performance_run_id_1 }}
          PERFORMANCE_RUN_ID_2: ${{ inputs.performance_run_id_2 }}
          PERFORMANCE_RUN_ID_3: ${{ inputs.performance_run_id_3 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp python-release-assets/* release-assets/
          cp action/action.yml release-assets/action-v1.0.5.yml
          cp preflight/candidate-image-manifest.json \
            release-assets/image-manifest-v0.1.5.json
          cp preflight/candidate-image-manifest-linux-amd64.json \
            release-assets/image-manifest-linux-amd64-v0.1.5.json
          cp preflight/candidate-image-manifest-linux-arm64.json \
            release-assets/image-manifest-linux-arm64-v0.1.5.json
          cp preflight/candidate-image-sbom.spdx.json \
            release-assets/image-sbom-v0.1.5.spdx.json
          cp preflight/candidate-image-provenance.slsa.json \
            release-assets/image-provenance-v0.1.5.slsa.json
          cp preflight/performance-summary-1.json \
            release-assets/performance-run-1-summary-v1.0.5.json
          cp preflight/performance-summary-2.json \
            release-assets/performance-run-2-summary-v1.0.5.json
          cp preflight/performance-summary-3.json \
            release-assets/performance-run-3-summary-v1.0.5.json
          cp preflight/combined-performance-summary.json \
            release-assets/performance-summary-v1.0.5.json
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = {
              "schemaVersion": 1,
              "requirement": "REQ-F11-220",
              "acceptanceCriterion": "AC-F11-220",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "productVersion": os.environ["PRODUCT_VERSION"],
              "productTag": os.environ["PRODUCT_TAG"],
              "actionTag": os.environ["ACTION_VERSION_TAG"],
              "publicCliVersion": os.environ["PUBLIC_CLI_VERSION"],
              "pythonDistributionsPublished": [
                  "attest-sign==0.1.1",
                  "attest-cli==0.1.4",
              ],
              "candidate": {
                  "runId": int(os.environ["REVIEWED_CANDIDATE_RUN_ID"]),
                  "source": os.environ["REVIEWED_CANDIDATE_SOURCE_SHA"],
                  "contextDigest": os.environ["REVIEWED_CONTEXT_DIGEST"],
                  "imageDigest": os.environ["REVIEWED_IMAGE_DIGEST"],
              },
              "performanceRunIds": [
                  int(os.environ["PERFORMANCE_RUN_ID_1"]),
                  int(os.environ["PERFORMANCE_RUN_ID_2"]),
                  int(os.environ["PERFORMANCE_RUN_ID_3"]),
              ],
              "majorTagMoved": False,
          }
          Path("release-assets/release-contract-v0.1.5.json").write_text(
              json.dumps(contract, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-v0.1.5
          path: release-assets
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  attest-artifacts:
    needs: [assemble-assets, smoke-patches]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-v0.1.5
          path: release-assets
      - name: Attest the bounded release assets
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publicly verify every release asset attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-asset-attestation-evidence
          for subject in release-assets/*; do
            name="$(basename "${subject}")"
            gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-digest "${GITHUB_SHA}" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --format json \
              > "release-asset-attestation-evidence/${name}.verification.json"
          done
          cp "${{ steps.attest.outputs.bundle-path }}" \
            release-asset-attestation-evidence/github-release-asset-attestations.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-asset-attestation-evidence-v0.1.5
          path: release-asset-attestation-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  inspect-publication:
    needs: [build-patches, smoke-patches]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      sign-publication-required: ${{ steps.inspect.outputs.sign-publication-required }}
      cli-publication-required: ${{ steps.inspect.outputs.cli-publication-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sign-distributions-v0.1.1
          path: sign-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-distributions-v0.1.4
          path: cli-dist
      - name: Inspect the exact public signer and CLI patches
        id: inspect
        env:
          PRIOR_SIGN_PUBLICATION_RUN_ID: ${{ inputs.prior_sign_publication_run_id }}
          PRIOR_CLI_PUBLICATION_RUN_ID: ${{ inputs.prior_cli_publication_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication-state-evidence
          inspect_distribution() {
            local distribution="$1"
            local version="$2"
            local directory="$3"
            local manifest="$4"
            local key="$5"
            local status
            status="$(curl \
              --silent \
              --show-error \
              --output "publication-state-evidence/${distribution}-${version}.json" \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/${distribution}/${version}/json")"
            case "${status}" in
              200)
                uv run --no-project python scripts/verify_published_release.py \
                  "${directory}" \
                  --manifest "${manifest}" \
                  --version "${version}" \
                  | tee "publication-state-evidence/existing-${distribution}-verification.txt"
                printf -v "${key}_publication_required" '%s' false
                printf -v "${key}_publication_state" '%s' existing-exact
                ;;
              404)
                printf -v "${key}_publication_required" '%s' true
                printf -v "${key}_publication_state" '%s' absent
                ;;
              *)
                echo "publication inspection: ${distribution} returned HTTP ${status}" >&2
                exit 1
                ;;
            esac
          }

          inspect_distribution \
            attest-sign "${SIGN_VERSION}" sign-dist \
            release/patches/0.1.1-sign.toml sign
          inspect_distribution \
            attest-cli "${PUBLIC_CLI_VERSION}" cli-dist \
            release/patches/0.1.4.toml cli

          validate_recovery_input() {
            local distribution="$1"
            local publication_required="$2"
            local prior_run_id="$3"
            if test "${publication_required}" = false; then
              if ! [[ "${prior_run_id}" =~ ^[1-9][0-9]*$ ]]; then
                echo "publication inspection: existing ${distribution} requires its prior run ID" >&2
                exit 1
              fi
            elif test -n "${prior_run_id}"; then
              echo "publication inspection: prior run ID supplied for absent ${distribution}" >&2
              exit 1
            fi
          }
          validate_recovery_input \
            attest-sign "${sign_publication_required}" \
            "${PRIOR_SIGN_PUBLICATION_RUN_ID}"
          validate_recovery_input \
            attest-cli "${cli_publication_required}" \
            "${PRIOR_CLI_PUBLICATION_RUN_ID}"

          existing_publication=false
          if test "${sign_publication_required}" = false || \
            test "${cli_publication_required}" = false; then
            existing_publication=true
          fi
          sha256sum sign-dist/* | LC_ALL=C sort --key=2 \
            > publication-state-evidence/rebuilt-sign-sha256.txt
          sha256sum cli-dist/* | LC_ALL=C sort --key=2 \
            > publication-state-evidence/rebuilt-cli-sha256.txt
          export \
            sign_publication_required sign_publication_state \
            cli_publication_required cli_publication_state
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schemaVersion": 1,
              "distributions": {
                  "attest-sign": {
                      "version": os.environ["SIGN_VERSION"],
                      "state": os.environ["sign_publication_state"],
                      "publicationRequired": (
                          os.environ["sign_publication_required"] == "true"
                      ),
                  },
                  "attest-cli": {
                      "version": os.environ["PUBLIC_CLI_VERSION"],
                      "state": os.environ["cli_publication_state"],
                      "publicationRequired": (
                          os.environ["cli_publication_required"] == "true"
                      ),
                  },
              },
              "priorPublicationRunIds": {
                  "attest-sign": os.environ["PRIOR_SIGN_PUBLICATION_RUN_ID"] or None,
                  "attest-cli": os.environ["PRIOR_CLI_PUBLICATION_RUN_ID"] or None,
              },
              "inspectionCommit": os.environ["GITHUB_SHA"],
              "inspectionRunId": int(os.environ["GITHUB_RUN_ID"]),
          }
          Path("publication-state-evidence/publication-state.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "sign-publication-required=${sign_publication_required}" >> "${GITHUB_OUTPUT}"
          echo "cli-publication-required=${cli_publication_required}" >> "${GITHUB_OUTPUT}"
          echo "existing-publication=${existing_publication}" >> "${GITHUB_OUTPUT}"
      - name: Validate prior Trusted Publishing runs
        if: steps.inspect.outputs.existing-publication == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_SIGN_PUBLICATION_RUN_ID: ${{ inputs.prior_sign_publication_run_id }}
          PRIOR_CLI_PUBLICATION_RUN_ID: ${{ inputs.prior_cli_publication_run_id }}
          SIGN_PUBLICATION_REQUIRED: ${{ steps.inspect.outputs.sign-publication-required }}
          CLI_PUBLICATION_REQUIRED: ${{ steps.inspect.outputs.cli-publication-required }}
        shell: bash
        run: |
          set -euo pipefail
          validate_prior_run() {
            local key="$1"
            local run_id="$2"
            local job_name="$3"
            local run_file="publication-state-evidence/prior-${key}-publication-run.json"
            local jobs_file="publication-state-evidence/prior-${key}-publication-jobs.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "${run_file}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              > "${jobs_file}"
            jq -e --arg repository "${GITHUB_REPOSITORY}" '
              .repository.full_name == $repository and
              .path == ".github/workflows/release.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              (.conclusion == "success" or .conclusion == "failure")
            ' "${run_file}" > /dev/null
            prior_sha="$(jq -er .head_sha "${run_file}")"
            git merge-base --is-ancestor "${prior_sha}" "${GITHUB_SHA}"
            jq -e --arg job_name "${job_name}" '
              any(.jobs[]; .name == $job_name and .conclusion == "success")
            ' "${jobs_file}" > /dev/null
          }
          if test "${SIGN_PUBLICATION_REQUIRED}" = false; then
            validate_prior_run sign "${PRIOR_SIGN_PUBLICATION_RUN_ID}" publish-sign
          fi
          if test "${CLI_PUBLICATION_REQUIRED}" = false; then
            validate_prior_run cli "${PRIOR_CLI_PUBLICATION_RUN_ID}" publish-cli
          fi
      - name: Retrieve prior signer Trusted Publishing evidence
        if: steps.inspect.outputs.sign-publication-required == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-publisher-evidence-attest-sign-v0.1.5
          path: prior-trusted-publisher-sign
          run-id: ${{ inputs.prior_sign_publication_run_id }}
          github-token: ${{ github.token }}
      - name: Retrieve prior CLI Trusted Publishing evidence
        if: steps.inspect.outputs.cli-publication-required == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-publisher-evidence-attest-cli-v0.1.5
          path: prior-trusted-publisher-cli
          run-id: ${{ inputs.prior_cli_publication_run_id }}
          github-token: ${{ github.token }}
      - name: Retain prior Trusted Publishing evidence
        if: steps.inspect.outputs.existing-publication == 'true'
        env:
          PRIOR_SIGN_PUBLICATION_RUN_ID: ${{ inputs.prior_sign_publication_run_id }}
          PRIOR_CLI_PUBLICATION_RUN_ID: ${{ inputs.prior_cli_publication_run_id }}
          SIGN_PUBLICATION_REQUIRED: ${{ steps.inspect.outputs.sign-publication-required }}
          CLI_PUBLICATION_REQUIRED: ${{ steps.inspect.outputs.cli-publication-required }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          repository = os.environ["GITHUB_REPOSITORY"]
          workflow_ref = (
              f"{repository}/.github/workflows/release.yml@refs/heads/main"
          )
          publisher_action = (
              "pypa/gh-action-pypi-publish@"
              "dc37677b2e1c63e2034f94d8a5b11f265b73ba33"
          )
          publications = (
              (
                  "attest-sign",
                  "pypi-attest-sign",
                  os.environ["SIGN_PUBLICATION_REQUIRED"],
                  os.environ["PRIOR_SIGN_PUBLICATION_RUN_ID"],
                  Path("prior-trusted-publisher-sign/attest-sign.json"),
              ),
              (
                  "attest-cli",
                  "pypi-attest-cli",
                  os.environ["CLI_PUBLICATION_REQUIRED"],
                  os.environ["PRIOR_CLI_PUBLICATION_RUN_ID"],
                  Path("prior-trusted-publisher-cli/attest-cli.json"),
              ),
          )
          for distribution, environment, required, run_id, source in publications:
              if required == "true":
                  if source.exists():
                      raise SystemExit(
                          f"unexpected prior evidence for unpublished {distribution}"
                      )
                  continue
              run = json.loads(
                  Path(
                      f"publication-state-evidence/prior-"
                      f"{'sign' if distribution == 'attest-sign' else 'cli'}-"
                      "publication-run.json"
                  ).read_text(encoding="utf-8")
              )
              evidence = json.loads(source.read_text(encoding="utf-8"))
              expected = {
                  "schemaVersion": 1,
                  "authentication": "oidc-trusted-publishing",
                  "distribution": distribution,
                  "environment": environment,
                  "repository": repository,
                  "releaseCommit": run["head_sha"],
                  "releaseRef": "refs/heads/main",
                  "releaseRunId": int(run_id),
                  "workflowRef": workflow_ref,
                  "publisherAction": publisher_action,
              }
              for key, value in expected.items():
                  if evidence.get(key) != value:
                      raise SystemExit(
                          f"invalid prior {distribution} evidence field {key}"
                      )
              shutil.copyfile(
                  source,
                  "publication-state-evidence/"
                  f"prior-trusted-publisher-{distribution}.json",
              )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-state-evidence-v0.1.5
          path: publication-state-evidence
          if-no-files-found: error
          retention-days: 90

  publish-sign:
    needs: [attest-artifacts, inspect-publication, smoke-patches]
    if: needs.inspect-publication.outputs.sign-publication-required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-attest-sign
      url: https://pypi.org/p/attest-sign
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sign-distributions-v0.1.1
          path: dist
      - name: Record the bounded signer Trusted Publishing context
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          mkdir -p trusted-publisher-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schemaVersion": 1,
              "authentication": "oidc-trusted-publishing",
              "distribution": "attest-sign",
              "environment": "pypi-attest-sign",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "releaseRef": os.environ["GITHUB_REF"],
              "releaseRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "releaseRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
              "publisherAction": (
                  "pypa/gh-action-pypi-publish@"
                  "dc37677b2e1c63e2034f94d8a5b11f265b73ba33"
              ),
          }
          Path("trusted-publisher-evidence/attest-sign.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-publisher-evidence-attest-sign-v0.1.5
          path: trusted-publisher-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Publish the signer patch with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          print-hash: true
          attestations: true

  publish-cli:
    needs: [attest-artifacts, inspect-publication, smoke-patches]
    if: needs.inspect-publication.outputs.cli-publication-required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-attest-cli
      url: https://pypi.org/p/attest-cli
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-distributions-v0.1.4
          path: dist
      - name: Record the bounded CLI Trusted Publishing context
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          mkdir -p trusted-publisher-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schemaVersion": 1,
              "authentication": "oidc-trusted-publishing",
              "distribution": "attest-cli",
              "environment": "pypi-attest-cli",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "releaseRef": os.environ["GITHUB_REF"],
              "releaseRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "releaseRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
              "publisherAction": (
                  "pypa/gh-action-pypi-publish@"
                  "dc37677b2e1c63e2034f94d8a5b11f265b73ba33"
              ),
          }
          Path("trusted-publisher-evidence/attest-cli.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-publisher-evidence-attest-cli-v0.1.5
          path: trusted-publisher-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Publish the CLI patch with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          print-hash: true
          attestations: true

  verify-published:
    needs: [attest-artifacts, inspect-publication, publish-sign, publish-cli]
    if: >-
      always() && needs.attest-artifacts.result == 'success' &&
      needs.inspect-publication.result == 'success' &&
      (needs.publish-sign.result == 'success' || needs.publish-sign.result == 'skipped') &&
      (needs.publish-cli.result == 'success' || needs.publish-cli.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sign-distributions-v0.1.1
          path: sign-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-distributions-v0.1.4
          path: cli-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: publication-state-evidence-v0.1.5
          path: publication-state
      - name: Download current signer Trusted Publishing evidence
        if: needs.inspect-publication.outputs.sign-publication-required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-publisher-evidence-attest-sign-v0.1.5
          path: trusted-publisher-sign
      - name: Download current CLI Trusted Publishing evidence
        if: needs.inspect-publication.outputs.cli-publication-required == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-publisher-evidence-attest-cli-v0.1.5
          path: trusted-publisher-cli
      - name: Verify public signer and CLI bytes and clean installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-package-evidence
          uv run --no-project python scripts/verify_published_release.py \
            sign-dist \
            --manifest release/patches/0.1.1-sign.toml \
            --version "${SIGN_VERSION}" \
            | tee "public-package-evidence/sign-pypi-verification-python-${{ matrix.python }}.txt"
          uv run --no-project python scripts/verify_published_release.py \
            cli-dist \
            --manifest release/patches/0.1.4.toml \
            --version "${PUBLIC_CLI_VERSION}" \
            | tee "public-package-evidence/cli-pypi-verification-python-${{ matrix.python }}.txt"
          uv venv build/public-package-smoke --python "${{ matrix.python }}" --clear
          uv pip install \
            --python build/public-package-smoke/bin/python \
            --strict \
            --no-cache \
            "attest-sign==${SIGN_VERSION}" \
            "attest-cli==${PUBLIC_CLI_VERSION}"
          uv pip freeze --python build/public-package-smoke/bin/python \
            > "public-package-evidence/installed-python-${{ matrix.python }}.txt"
          build/public-package-smoke/bin/python - <<'PY'
          from importlib import metadata

          assert metadata.version("attest-sign") == "0.1.1"
          assert metadata.version("attest-cli") == "0.1.4"
          assert metadata.version("attest-store") == "0.1.1"
          for distribution in ("attest-core", "attest-collect", "attest-policy"):
              assert metadata.version(distribution) == "0.1.0"
          PY
          build/public-package-smoke/bin/attest --help > /dev/null
          for evidence in publication-state/*; do
            cp "${evidence}" \
              "public-package-evidence/python-${{ matrix.python }}-$(basename "${evidence}")"
          done
          for directory in trusted-publisher-sign trusted-publisher-cli; do
            if test -d "${directory}"; then
              for evidence in "${directory}"/*; do
                cp "${evidence}" \
                  "public-package-evidence/python-${{ matrix.python }}-$(basename "${evidence}")"
              done
            fi
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-package-evidence-python-${{ matrix.python }}-v0.1.5
          path: public-package-evidence
          if-no-files-found: error
          retention-days: 90

  promote-image:
    needs: [preflight, verify-published]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Promote the exact candidate manifest without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          release_image="${IMAGE_NAME}:${PRODUCT_VERSION}"
          mkdir -p image-promotion-evidence
          inspection_state=""
          for attempt in $(seq 1 5); do
            if docker buildx imagetools inspect "${release_image}" --raw \
              > image-promotion-evidence/promoted-image-manifest.json \
              2> image-promotion-evidence/initial-inspection.txt; then
              inspection_state=present
              break
            fi
            if grep -Eiq 'manifest unknown|manifest_unknown|not found' \
              image-promotion-evidence/initial-inspection.txt; then
              inspection_state=absent
              break
            fi
            if test "${attempt}" = "5"; then
              echo "image promotion: registry state remained indeterminate" >&2
              exit 1
            fi
            sleep 2
          done
          if test "${inspection_state}" = "present"; then
            promotion_state=existing-exact
          elif test "${inspection_state}" = "absent"; then
            docker buildx imagetools create \
              --tag "${release_image}" \
              "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}"
            docker buildx imagetools inspect "${release_image}" --raw \
              > image-promotion-evidence/promoted-image-manifest.json
            promotion_state=created
          else
            echo "image promotion: registry state was not classified" >&2
            exit 1
          fi
          observed="sha256:$(sha256sum image-promotion-evidence/promoted-image-manifest.json | cut -d ' ' -f 1)"
          test "${observed}" = "${REVIEWED_IMAGE_DIGEST}"
          printf '%s\n' "${release_image}@${REVIEWED_IMAGE_DIGEST}" \
            > image-promotion-evidence/release-image.txt
          printf '%s\n' "${promotion_state}" \
            > image-promotion-evidence/promotion-state.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-promotion-evidence-v0.1.5
          path: image-promotion-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  dogfood:
    needs: [promote-image, verify-published]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_IDENTITY: https://github.com/Parth2412/attest/.github/workflows/release.yml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - name: Install the exact public signer and CLI patches
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-dogfood-evidence
          uv venv build/release-dogfood --python 3.12 --clear
          uv pip install \
            --python build/release-dogfood/bin/python \
            --strict \
            --no-cache \
            "attest-cli==${PUBLIC_CLI_VERSION}"
          build/release-dogfood/bin/python - <<'PY'
          from importlib import metadata

          if metadata.version("attest-cli") != "0.1.4":
              raise SystemExit("unexpected public CLI version")
          if metadata.version("attest-sign") != "0.1.1":
              raise SystemExit("unexpected public signer version")
          PY
      - name: Attest and publicly verify the release source
        shell: bash
        run: |
          set -euo pipefail
          build/release-dogfood/bin/attest run \
            --output "release-dogfood-evidence/attest-${PRODUCT_TAG}.bundle.json" \
            --repository . \
            --work-directory release-dogfood-evidence/work \
            --policy release/attest-release-policy.yaml \
            --base "${PRIOR_RELEASE_SHA}" \
            --head "${GITHUB_SHA}" \
            --target-branch main \
            --git-backend subprocess \
            --signing-environment production \
            --identity "${RELEASE_IDENTITY}" \
            --issuer "${OIDC_ISSUER}" \
            --verify-environment production \
            --online \
            --store-backend filesystem \
            --store-directory release-dogfood-evidence/store \
            --fallback-directory release-dogfood-evidence/fallback \
            --config release/attest-release-config.yaml \
            --json \
            > release-dogfood-evidence/attest-run-report.json
          build/release-dogfood/bin/attest verify \
            --input "release-dogfood-evidence/attest-${PRODUCT_TAG}.bundle.json" \
            --repository . \
            --base "${PRIOR_RELEASE_SHA}" \
            --head "${GITHUB_SHA}" \
            --identity "${RELEASE_IDENTITY}" \
            --issuer "${OIDC_ISSUER}" \
            --verify-environment production \
            --online \
            --config release/attest-release-config.yaml \
            --json \
            > release-dogfood-evidence/public-verification.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dogfood-evidence-v0.1.5
          path: release-dogfood-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  publish-release:
    needs: [attest-artifacts, dogfood, promote-image, verify-published]
    if: >-
      always() &&
      needs.attest-artifacts.result == 'success' &&
      needs.dogfood.result == 'success' &&
      needs.promote-image.result == 'success' &&
      needs.verify-published.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-v0.1.5
          path: retained/release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-preflight-evidence-v0.1.5
          path: retained/preflight
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-asset-attestation-evidence-v0.1.5
          path: retained/attestations
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image-promotion-evidence-v0.1.5
          path: retained/promotion
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dogfood-evidence-v0.1.5
          path: retained/dogfood
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-package-evidence-python-3.12-v0.1.5
          path: retained/public-package-python-3.12
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: public-package-evidence-python-3.13-v0.1.5
          path: retained/public-package-python-3.13
      - name: Assemble the immutable release evidence index
        env:
          PERFORMANCE_RUN_ID_1: ${{ inputs.performance_run_id_1 }}
          PERFORMANCE_RUN_ID_2: ${{ inputs.performance_run_id_2 }}
          PERFORMANCE_RUN_ID_3: ${{ inputs.performance_run_id_3 }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-release-assets
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path("final-release-assets")
          for path in sorted(Path("retained").rglob("*"), key=lambda item: item.as_posix()):
              relative = path.relative_to("retained")
              if any(part.startswith(".") for part in relative.parts):
                  raise SystemExit(f"hidden retained evidence is forbidden: {path}")
              if path.is_dir() and not path.is_symlink():
                  continue
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"invalid retained evidence: {path}")
              target = root / path.name
              if target.exists():
                  raise SystemExit(f"duplicate release asset name: {path.name}")
              shutil.copyfile(path, target)

          assets = []
          for path in sorted(root.iterdir(), key=lambda item: item.name):
              content = path.read_bytes()
              assets.append(
                  {
                      "name": path.name,
                      "sha256": hashlib.sha256(content).hexdigest(),
                      "size": len(content),
                  }
              )
          index = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "releaseRunId": int(os.environ["GITHUB_RUN_ID"]),
              "performanceRunIds": [
                  int(os.environ["PERFORMANCE_RUN_ID_1"]),
                  int(os.environ["PERFORMANCE_RUN_ID_2"]),
                  int(os.environ["PERFORMANCE_RUN_ID_3"]),
              ],
              "candidateRunId": int(os.environ["REVIEWED_CANDIDATE_RUN_ID"]),
              "candidateSource": os.environ["REVIEWED_CANDIDATE_SOURCE_SHA"],
              "contextDigest": os.environ["REVIEWED_CONTEXT_DIGEST"],
              "imageDigest": os.environ["REVIEWED_IMAGE_DIGEST"],
              "publicCliVersion": os.environ["PUBLIC_CLI_VERSION"],
              "pythonDistributionsPublished": [
                  "attest-sign==0.1.1",
                  "attest-cli==0.1.4",
              ],
              "majorTagMoved": False,
              "tags": [os.environ["PRODUCT_TAG"], os.environ["ACTION_VERSION_TAG"]],
              "assets": assets,
          }
          (root / "release-evidence-index.json").write_text(
              json.dumps(index, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Create, verify, and publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_state=absent
          release_id=""
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            > release-pages.json
          release_count="$(jq -r --arg tag "${PRODUCT_TAG}" \
            '[.[][] | select(.tag_name == $tag)] | length' release-pages.json)"
          test "${release_count}" -le 1
          if test "${release_count}" = "1"; then
            release_id="$(jq -r --arg tag "${PRODUCT_TAG}" \
              '.[][] | select(.tag_name == $tag) | .id' release-pages.json)"
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              > release-state.json
            jq -e --arg sha "${GITHUB_SHA}" --arg tag "${PRODUCT_TAG}" '
              .tag_name == $tag and
              .target_commitish == $sha and
              .prerelease == false
            ' release-state.json > /dev/null
            if jq -e '.draft == true' release-state.json > /dev/null; then
              release_state=draft
            elif jq -e '.draft == false and .immutable == true' \
              release-state.json > /dev/null; then
              release_state=published
            else
              echo "release publication: existing release is neither resumable nor immutable" >&2
              exit 1
            fi
          fi

          if test "${release_state}" = "absent"; then
            gh release create "${PRODUCT_TAG}" \
              --target "${GITHUB_SHA}" \
              --draft \
              --title "attest ${PRODUCT_VERSION} / Action ${ACTION_VERSION_TAG}" \
              --notes-file release/RELEASE_NOTES-v0.1.5.md
            release_state=draft
            for attempt in $(seq 1 30); do
              gh api --paginate --slurp \
                "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
                > release-pages.json
              release_count="$(jq -r --arg tag "${PRODUCT_TAG}" \
                '[.[][] | select(.tag_name == $tag)] | length' release-pages.json)"
              test "${release_count}" -le 1
              release_id="$(jq -r --arg tag "${PRODUCT_TAG}" \
                '.[][] | select(.tag_name == $tag) | .id' release-pages.json)"
              if test -n "${release_id}"; then
                break
              fi
              if test "${attempt}" = "30"; then
                echo "release publication: draft release was not observed" >&2
                exit 1
              fi
              sleep 2
            done
          fi
          if test "${release_state}" = "draft"; then
            gh release upload "${PRODUCT_TAG}" final-release-assets/* --clobber
          fi

          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              > release-state.json
            if python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          release = json.loads(Path("release-state.json").read_text(encoding="utf-8"))
          remote = {item["name"]: item["digest"] for item in release["assets"]}
          local = {
              path.name: f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}"
              for path in Path("final-release-assets").iterdir()
              if path.is_file()
          }
          if remote != local:
              raise SystemExit("release assets differ from retained local evidence")
          PY
            then
              break
            fi
            if test "${attempt}" = "30"; then
              echo "release publication: exact asset digests were not observed" >&2
              exit 1
            fi
            sleep 2
          done

          if test "${release_state}" = "draft"; then
            jq -n '{draft: false, make_latest: "true"}' \
              | gh api --method PATCH \
                "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
                --input - > release-publish-request.json
          fi
          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" \
              > release-published.json
            if jq -e --arg sha "${GITHUB_SHA}" '
              .target_commitish == $sha and
              .draft == false and
              .prerelease == false and
              .immutable == true
            ' release-published.json > /dev/null; then
              break
            fi
            if test "${attempt}" = "30"; then
              echo "release publication: immutable state was not observed" >&2
              exit 1
            fi
            sleep 10
          done

          if action_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ACTION_VERSION_TAG}" \
            --jq '.object.sha' 2>/dev/null)"; then
            test "${action_sha}" = "${GITHUB_SHA}"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              --field ref="refs/tags/${ACTION_VERSION_TAG}" \
              --field sha="${GITHUB_SHA}" > /dev/null
          fi
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" \
              = "${GITHUB_SHA}"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1" --jq '.object.sha')" \
            = "${PRIOR_RELEASE_SHA}"
