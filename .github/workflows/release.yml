name: release

on:
  workflow_dispatch:
    inputs:
      prior_store_publication_run_id:
        description: Prior release run that published the exact attest-store artifacts
        required: false
        type: string
      prior_cli_publication_run_id:
        description: Prior release run that published the exact attest-cli artifacts
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-v0.1.3
  cancel-in-progress: false

env:
  PRODUCT_VERSION: "0.1.3"
  STORE_VERSION: "0.1.1"
  PRODUCT_TAG: v0.1.3
  ACTION_VERSION_TAG: v1.0.3
  IMAGE_NAME: ghcr.io/parth2412/attest
  REVIEWED_CANDIDATE_RUN_ID: 35963124568
  REVIEWED_CANDIDATE_SOURCE_SHA: c62eaf02883bfddf5d2fef38d044266a11f49d7f
  REVIEWED_IMAGE_DIGEST: sha256:d5a370bff96f3dbe8eca341701060b73b915d9bade981e24a835f62362d2e2e1
  REVIEWED_CONTEXT_DIGEST: sha256:947ecc3ee98a9cea0eda2eb0c8ddeb6da6606a2af65fa23308720670f4e835f5
  FIRST_RELEASE_SHA: a1c59cc67bf67aba22ffca876309f855ea8663af
  SECOND_RELEASE_SHA: 9aa18c1d5af6659c4dbc79443dfda93208395dff
  PRIOR_RELEASE_SHA: 60951624b5572aa1f54db9c2693cb7a8e0399425

jobs:
  preflight:
    if: github.repository == 'Parth2412/attest' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate patch source and repository controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "main"
          uv lock --check

          mkdir -p patch-preflight-evidence
          gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            > patch-preflight-evidence/rulesets.json
          ruleset_id="$(jq -er \
            '.[] | select(.name == "Protect immutable release tags" and .target == "tag" and .enforcement == "active") | .id' \
            patch-preflight-evidence/rulesets.json)"
          gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
            > patch-preflight-evidence/tag-ruleset.json
          jq -e '
            (.bypass_actors // []) == [] and
            (.conditions.ref_name.include | sort) ==
              ([
                "refs/tags/v0.1.0",
                "refs/tags/v0.1.1",
                "refs/tags/v0.1.2",
                "refs/tags/v0.1.3",
                "refs/tags/v1.0.0",
                "refs/tags/v1.0.1",
                "refs/tags/v1.0.2",
                "refs/tags/v1.0.3"
              ] | sort) and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | sort) == (["deletion", "update"] | sort)
          ' patch-preflight-evidence/tag-ruleset.json > /dev/null

          for distribution in attest-store attest-cli; do
            environment="pypi-${distribution}"
            gh api "repos/${GITHUB_REPOSITORY}/environments/${environment}" \
              > "patch-preflight-evidence/${environment}-environment.json"
            jq -e --arg owner "${GITHUB_REPOSITORY_OWNER}" --arg name "${environment}" '
              .name == $name and
              .can_admins_bypass == false and
              .deployment_branch_policy.protected_branches == true and
              .deployment_branch_policy.custom_branch_policies == false and
              ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 1 and
              ([
                .protection_rules[] |
                select(.type == "required_reviewers") |
                .prevent_self_review
              ] == [false]) and
              ([
                .protection_rules[] |
                select(.type == "required_reviewers") |
                .reviewers[] |
                {type, login: .reviewer.login}
              ] == [{type: "User", login: $owner}])
            ' "patch-preflight-evidence/${environment}-environment.json" > /dev/null
          done

          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > patch-preflight-evidence/main-ci-runs.json
          jq -e --arg sha "${GITHUB_SHA}" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            patch-preflight-evidence/main-ci-runs.json > /dev/null

          for tag in v0.1.0 v1.0.0 v1; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" \
              = "${FIRST_RELEASE_SHA}"
          done
          test "$(git tag --points-at "${FIRST_RELEASE_SHA}" | LC_ALL=C sort)" = $'v0.1.0\nv1\nv1.0.0'
          for tag in v0.1.1 v1.0.1; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" \
              = "${SECOND_RELEASE_SHA}"
          done
          test "$(git tag --points-at "${SECOND_RELEASE_SHA}" | LC_ALL=C sort)" = $'v0.1.1\nv1.0.1'
          for tag in v0.1.2 v1.0.2; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" \
              = "${PRIOR_RELEASE_SHA}"
          done
          test "$(git tag --points-at "${PRIOR_RELEASE_SHA}" | LC_ALL=C sort)" = $'v0.1.2\nv1.0.2'
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" > /dev/null 2>&1; then
              echo "patch preflight: tag already exists: ${tag}" >&2
              exit 1
            fi
          done
          if gh release view "${PRODUCT_TAG}" > /dev/null 2>&1; then
            echo "patch preflight: release already exists: ${PRODUCT_TAG}" >&2
            exit 1
          fi

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.0" \
            > patch-preflight-evidence/first-release.json
          jq -e --arg sha "${FIRST_RELEASE_SHA}" '
            .tag_name == "v0.1.0" and
            .target_commitish == $sha and
            .draft == false and
            .prerelease == false and
            .immutable == true
          ' patch-preflight-evidence/first-release.json > /dev/null

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.2" \
            > patch-preflight-evidence/prior-release.json
          jq -e --arg sha "${PRIOR_RELEASE_SHA}" '
            .tag_name == "v0.1.2" and
            .target_commitish == $sha and
            .draft == false and
            .prerelease == false and
            .immutable == true
          ' patch-preflight-evidence/prior-release.json > /dev/null

          curl --fail --silent --show-error \
            https://pypi.org/pypi/attest-store/0.1.0/json \
            > patch-preflight-evidence/prior-attest-store-pypi.json
          jq -e '
            .info.name == "attest-store" and
            .info.version == "0.1.0" and
            ([.urls[].filename] | sort) == (
              [
                "attest_store-0.1.0-py3-none-any.whl",
                "attest_store-0.1.0.tar.gz"
              ] | sort
            )
          ' patch-preflight-evidence/prior-attest-store-pypi.json > /dev/null
          curl --fail --silent --show-error \
            https://pypi.org/pypi/attest-cli/0.1.2/json \
            > patch-preflight-evidence/prior-attest-cli-pypi.json
          jq -e '
            .info.name == "attest-cli" and
            .info.version == "0.1.2" and
            ([.urls[].filename] | sort) == (
              [
                "attest_cli-0.1.2-py3-none-any.whl",
                "attest_cli-0.1.2.tar.gz"
              ] | sort
            )
          ' patch-preflight-evidence/prior-attest-cli-pypi.json > /dev/null

          uv run --no-project python - <<'PY'
          import tomllib
          from pathlib import Path

          cli_project = tomllib.loads(
              Path("packages/attest-cli/pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          store_project = tomllib.loads(
              Path("packages/attest-store/pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          cli_patch = tomllib.loads(
              Path("release/patches/0.1.3.toml").read_text(encoding="utf-8")
          )
          store_patch = tomllib.loads(
              Path("release/patches/0.1.1-store.toml").read_text(encoding="utf-8")
          )
          dependencies = {
              value for value in cli_project["dependencies"] if value.startswith("attest-")
          }
          expected = {
              "attest-core==0.1.0",
              "attest-collect==0.1.0",
              "attest-sign==0.1.0",
              "attest-store==0.1.1",
              "attest-policy==0.1.0",
          }
          if cli_project["version"] != "0.1.3" or dependencies != expected:
              raise SystemExit("CLI patch metadata differs from the closed contract")
          if store_project["version"] != "0.1.1" or store_project["dependencies"] != [
              "attest-core==0.1.0",
              "oras",
          ]:
              raise SystemExit("store patch metadata differs from the closed contract")
          if cli_patch["release"] != {
              "version": "0.1.3",
              "distributions": ["attest-cli"],
          }:
              raise SystemExit("CLI manifest differs from the closed distribution set")
          if store_patch["release"] != {
              "version": "0.1.1",
              "distributions": ["attest-store"],
          }:
              raise SystemExit("store manifest differs from the closed distribution set")
          if cli_patch["compatibility"] != {
              "library-version": "0.1.0",
              "store-version": "0.1.1",
              "action-version": "v1.0.3",
              "image": (
                  "ghcr.io/parth2412/attest@sha256:"
                  "d5a370bff96f3dbe8eca341701060b73b915d9bade981e24a835f62362d2e2e1"
              ),
          }:
              raise SystemExit("patch compatibility differs from the closed contract")
          PY

          current_image="$(awk '/^  image: docker:\/\// {sub(/^  image: docker:\/\//, ""); print}' action/action.yml)"
          test "${current_image}" = "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}"
          if grep -F "github." action/action.yml > /dev/null; then
            echo "patch preflight: Action metadata references an unsupported context" >&2
            exit 1
          fi

          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}" --raw \
            > patch-preflight-evidence/image-manifest.json
          observed="sha256:$(sha256sum patch-preflight-evidence/image-manifest.json | cut -d ' ' -f 1)"
          test "${observed}" = "${REVIEWED_IMAGE_DIGEST}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("patch-preflight-evidence/image-manifest.json").read_text(encoding="utf-8")
          )
          platforms = {
              f"{item['platform']['os']}/{item['platform']['architecture']}"
              for item in manifest["manifests"]
              if item["platform"]["os"] != "unknown"
          }
          if platforms != {"linux/amd64", "linux/arm64"}:
              raise SystemExit(f"unexpected image platforms: {sorted(platforms)}")
          PY
      - name: Validate the reviewed candidate run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REVIEWED_CANDIDATE_RUN_ID}" \
            > patch-preflight-evidence/candidate-run.json
          jq -e \
            --arg source "${REVIEWED_CANDIDATE_SOURCE_SHA}" \
            --arg repository "${GITHUB_REPOSITORY}" '
              .name == "action-candidate" and
              .path == ".github/workflows/action-candidate.yml" and
              .event == "push" and
              .head_branch == "dev" and
              .head_sha == $source and
              .repository.full_name == $repository and
              .status == "completed" and
              .conclusion == "success" and
              .run_attempt == 1
            ' patch-preflight-evidence/candidate-run.json > /dev/null
      - name: Download the reviewed candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-candidate-build-${{ env.REVIEWED_CANDIDATE_SOURCE_SHA }}
          path: ${{ runner.temp }}/candidate-evidence
          github-token: ${{ github.token }}
          repository: Parth2412/attest
          run-id: ${{ env.REVIEWED_CANDIDATE_RUN_ID }}
      - name: Prove final context equality and immutable image identity
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-project python scripts/prepare_action_context.py \
            "${RUNNER_TEMP}/release-action-context" \
            --manifest-output patch-preflight-evidence/current-context-manifest.json \
            --digest-output patch-preflight-evidence/current-context-digest.txt
          uv run --no-project python scripts/validate_release_candidate.py \
            --evidence-directory "${RUNNER_TEMP}/candidate-evidence" \
            --current-context-manifest patch-preflight-evidence/current-context-manifest.json \
            --action-manifest action/action.yml \
            --expected-context-digest "${REVIEWED_CONTEXT_DIGEST}" \
            --expected-image-digest "${REVIEWED_IMAGE_DIGEST}"
          cmp --silent \
            "${RUNNER_TEMP}/candidate-evidence/manifest.json" \
            patch-preflight-evidence/image-manifest.json
      - name: Verify the candidate attestation identity again
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh attestation verify \
            "oci://${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/action-candidate.yml" \
            --source-digest "${REVIEWED_CANDIDATE_SOURCE_SHA}" \
            --source-ref refs/heads/dev \
            --deny-self-hosted-runners \
            --format json \
            > patch-preflight-evidence/candidate-attestation-verification.json
      - name: Retain patch preflight evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-preflight-evidence-v0.1.3
          path: patch-preflight-evidence
          if-no-files-found: error
          retention-days: 90

  build-patches:
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - name: Build and validate only the store and CLI patches
        shell: bash
        run: |
          set -euo pipefail
          uv build --package attest-store --out-dir build/store-dist \
            --clear --no-create-gitignore
          uv run --no-project python scripts/validate_release_artifacts.py \
            build/store-dist \
            --manifest release/patches/0.1.1-store.toml \
            --hash-output build/STORE-SHA256SUMS
          uv build --package attest-cli --out-dir build/cli-dist \
            --clear --no-create-gitignore
          uv run --no-project python scripts/validate_release_artifacts.py \
            build/cli-dist \
            --manifest release/patches/0.1.3.toml \
            --hash-output build/CLI-SHA256SUMS
          mkdir -p build/release-assets
          cp build/store-dist/* build/release-assets/
          cp build/cli-dist/* build/release-assets/
          cat build/STORE-SHA256SUMS build/CLI-SHA256SUMS \
            > build/release-assets/SHA256SUMS
          git archive \
            --format=tar.gz \
            --prefix="attest-${PRODUCT_VERSION}/" \
            --output="build/release-assets/attest-${PRODUCT_VERSION}-source.tar.gz" \
            "${GITHUB_SHA}"
          cd build/release-assets
          sha256sum "attest-${PRODUCT_VERSION}-source.tar.gz" >> SHA256SUMS
          LC_ALL=C sort --key=2 --output=SHA256SUMS SHA256SUMS
          LC_ALL=C sort --check=quiet --key=2 SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-distributions-v0.1.1
          path: build/store-dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-distributions-v0.1.3
          path: build/cli-dist
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets-v0.1.3
          path: build/release-assets
          if-no-files-found: error
          retention-days: 90

  smoke-patches:
    needs: build-patches
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-distributions-v0.1.1
          path: store-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-distributions-v0.1.3
          path: cli-dist
      - name: Install and smoke-test the store and CLI patches
        shell: bash
        run: |
          set -euo pipefail
          uv venv build/patch-smoke --python "${{ matrix.python }}" --clear
          uv pip install \
            --python build/patch-smoke/bin/python \
            --strict \
            --no-cache \
            store-dist/attest_store-0.1.1-py3-none-any.whl \
            cli-dist/attest_cli-0.1.3-py3-none-any.whl
          build/patch-smoke/bin/python - <<'PY'
          from importlib import metadata

          assert metadata.version("attest-store") == "0.1.1"
          assert metadata.version("attest-cli") == "0.1.3"
          for distribution in (
              "attest-core",
              "attest-collect",
              "attest-sign",
              "attest-policy",
          ):
              assert metadata.version(distribution) == "0.1.0"
          PY
          build/patch-smoke/bin/attest --help > /dev/null

  attest-artifacts:
    needs: [build-patches, smoke-patches]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-v0.1.3
          path: release-assets
      - name: Attest the source and release artifacts
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publicly verify every GitHub artifact attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patch-attestation-evidence
          for subject in release-assets/*; do
            name="$(basename "${subject}")"
            gh attestation verify "${subject}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml" \
              --source-digest "${GITHUB_SHA}" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              --format json \
              > "patch-attestation-evidence/${name}.verification.json"
          done
          cp "${{ steps.attest.outputs.bundle-path }}" \
            patch-attestation-evidence/github-artifact-attestations.jsonl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: patch-attestation-evidence-v0.1.3
          path: patch-attestation-evidence
          if-no-files-found: error
          retention-days: 90

  inspect-publication:
    needs: [build-patches, smoke-patches]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    outputs:
      store-publication-required: ${{ steps.inspect.outputs.store-publication-required }}
      cli-publication-required: ${{ steps.inspect.outputs.cli-publication-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-distributions-v0.1.1
          path: store-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-distributions-v0.1.3
          path: cli-dist
      - name: Inspect the exact public store and CLI patches
        id: inspect
        env:
          PRIOR_STORE_PUBLICATION_RUN_ID: ${{ inputs.prior_store_publication_run_id }}
          PRIOR_CLI_PUBLICATION_RUN_ID: ${{ inputs.prior_cli_publication_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p publication-state-evidence
          inspect_distribution() {
            local distribution="$1"
            local version="$2"
            local directory="$3"
            local manifest="$4"
            local key="$5"
            local status
            status="$(curl \
              --silent \
              --show-error \
              --output "publication-state-evidence/${distribution}-${version}.json" \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/${distribution}/${version}/json")"
            case "${status}" in
              200)
                uv run --no-project python scripts/verify_published_release.py \
                  "${directory}" \
                  --manifest "${manifest}" \
                  --version "${version}" \
                  | tee "publication-state-evidence/existing-${distribution}-verification.txt"
                printf -v "${key}_publication_required" '%s' false
                printf -v "${key}_publication_state" '%s' existing-exact
                ;;
              404)
                printf -v "${key}_publication_required" '%s' true
                printf -v "${key}_publication_state" '%s' absent
                ;;
              *)
                echo "publication inspection: ${distribution} returned HTTP ${status}" >&2
                exit 1
                ;;
            esac
          }

          inspect_distribution \
            attest-store "${STORE_VERSION}" store-dist \
            release/patches/0.1.1-store.toml store
          inspect_distribution \
            attest-cli "${PRODUCT_VERSION}" cli-dist \
            release/patches/0.1.3.toml cli

          validate_recovery_input() {
            local distribution="$1"
            local publication_required="$2"
            local prior_run_id="$3"
            if test "${publication_required}" = false; then
              if ! [[ "${prior_run_id}" =~ ^[1-9][0-9]*$ ]]; then
                echo "publication inspection: existing ${distribution} requires its prior run ID" >&2
                exit 1
              fi
            elif test -n "${prior_run_id}"; then
              echo "publication inspection: prior run ID supplied for absent ${distribution}" >&2
              exit 1
            fi
          }
          validate_recovery_input \
            attest-store "${store_publication_required}" \
            "${PRIOR_STORE_PUBLICATION_RUN_ID}"
          validate_recovery_input \
            attest-cli "${cli_publication_required}" \
            "${PRIOR_CLI_PUBLICATION_RUN_ID}"

          existing_publication=false
          if test "${store_publication_required}" = false || \
            test "${cli_publication_required}" = false; then
            existing_publication=true
          fi

          sha256sum store-dist/* | LC_ALL=C sort --key=2 \
            > publication-state-evidence/rebuilt-store-sha256.txt
          sha256sum cli-dist/* | LC_ALL=C sort --key=2 \
            > publication-state-evidence/rebuilt-cli-sha256.txt
          export \
            store_publication_required store_publication_state \
            cli_publication_required cli_publication_state \
            existing_publication
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schemaVersion": 1,
              "distributions": {
                  "attest-store": {
                      "version": os.environ["STORE_VERSION"],
                      "state": os.environ["store_publication_state"],
                      "publicationRequired": (
                          os.environ["store_publication_required"] == "true"
                      ),
                  },
                  "attest-cli": {
                      "version": os.environ["PRODUCT_VERSION"],
                      "state": os.environ["cli_publication_state"],
                      "publicationRequired": (
                          os.environ["cli_publication_required"] == "true"
                      ),
                  },
              },
              "priorPublicationRunIds": {
                  "attest-store": (
                      os.environ["PRIOR_STORE_PUBLICATION_RUN_ID"] or None
                  ),
                  "attest-cli": os.environ["PRIOR_CLI_PUBLICATION_RUN_ID"] or None,
              },
              "inspectionCommit": os.environ["GITHUB_SHA"],
              "inspectionRunId": int(os.environ["GITHUB_RUN_ID"]),
          }
          Path("publication-state-evidence/publication-state.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
          echo "store-publication-required=${store_publication_required}" >> "${GITHUB_OUTPUT}"
          echo "cli-publication-required=${cli_publication_required}" >> "${GITHUB_OUTPUT}"
          echo "existing-publication=${existing_publication}" >> "${GITHUB_OUTPUT}"
      - name: Validate the prior Trusted Publishing run
        if: steps.inspect.outputs.existing-publication == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_STORE_PUBLICATION_RUN_ID: ${{ inputs.prior_store_publication_run_id }}
          PRIOR_CLI_PUBLICATION_RUN_ID: ${{ inputs.prior_cli_publication_run_id }}
          STORE_PUBLICATION_REQUIRED: ${{ steps.inspect.outputs.store-publication-required }}
          CLI_PUBLICATION_REQUIRED: ${{ steps.inspect.outputs.cli-publication-required }}
        shell: bash
        run: |
          set -euo pipefail
          validate_prior_run() {
            local key="$1"
            local run_id="$2"
            local job_name="$3"
            local run_file="publication-state-evidence/prior-${key}-publication-run.json"
            local jobs_file="publication-state-evidence/prior-${key}-publication-jobs.json"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > "${run_file}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
              > "${jobs_file}"
            jq -e --arg repository "${GITHUB_REPOSITORY}" '
              .repository.full_name == $repository and
              .path == ".github/workflows/release.yml" and
              .event == "workflow_dispatch" and
              .head_branch == "main" and
              (.conclusion == "success" or .conclusion == "failure")
            ' "${run_file}" > /dev/null
            prior_sha="$(jq -er .head_sha "${run_file}")"
            git merge-base --is-ancestor "${prior_sha}" "${GITHUB_SHA}"
            jq -e --arg job_name "${job_name}" '
              any(.jobs[]; .name == $job_name and .conclusion == "success")
            ' "${jobs_file}" > /dev/null
          }

          if test "${STORE_PUBLICATION_REQUIRED}" = false; then
            validate_prior_run store "${PRIOR_STORE_PUBLICATION_RUN_ID}" publish-store
          fi
          if test "${CLI_PUBLICATION_REQUIRED}" = false; then
            validate_prior_run cli "${PRIOR_CLI_PUBLICATION_RUN_ID}" publish-cli
          fi
      - name: Retrieve prior store Trusted Publishing evidence
        if: steps.inspect.outputs.store-publication-required == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-publisher-evidence-attest-store-v0.1.3
          path: prior-trusted-publisher-store
          run-id: ${{ inputs.prior_store_publication_run_id }}
          github-token: ${{ github.token }}
      - name: Retrieve prior CLI Trusted Publishing evidence
        if: steps.inspect.outputs.cli-publication-required == 'false'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: trusted-publisher-evidence-attest-cli-v0.1.3
          path: prior-trusted-publisher-cli
          run-id: ${{ inputs.prior_cli_publication_run_id }}
          github-token: ${{ github.token }}
      - name: Validate and retain prior Trusted Publishing evidence
        if: steps.inspect.outputs.existing-publication == 'true'
        env:
          PRIOR_STORE_PUBLICATION_RUN_ID: ${{ inputs.prior_store_publication_run_id }}
          PRIOR_CLI_PUBLICATION_RUN_ID: ${{ inputs.prior_cli_publication_run_id }}
          STORE_PUBLICATION_REQUIRED: ${{ steps.inspect.outputs.store-publication-required }}
          CLI_PUBLICATION_REQUIRED: ${{ steps.inspect.outputs.cli-publication-required }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          from pathlib import Path

          publications = (
              (
                  "STORE_PUBLICATION_REQUIRED",
                  "PRIOR_STORE_PUBLICATION_RUN_ID",
                  "attest-store",
                  "pypi-attest-store",
                  Path("prior-trusted-publisher-store/attest-store.json"),
                  Path("publication-state-evidence/prior-store-publication-run.json"),
              ),
              (
                  "CLI_PUBLICATION_REQUIRED",
                  "PRIOR_CLI_PUBLICATION_RUN_ID",
                  "attest-cli",
                  "pypi-attest-cli",
                  Path("prior-trusted-publisher-cli/attest-cli.json"),
                  Path("publication-state-evidence/prior-cli-publication-run.json"),
              ),
          )
          for (
              required_variable,
              run_id_variable,
              distribution,
              environment,
              source,
              run_source,
          ) in publications:
              if os.environ[required_variable] != "false":
                  continue
              run = json.loads(run_source.read_text(encoding="utf-8"))
              evidence = json.loads(source.read_text(encoding="utf-8"))
              expected = {
                  "authentication": "oidc-trusted-publishing",
                  "distribution": distribution,
                  "environment": environment,
                  "repository": os.environ["GITHUB_REPOSITORY"],
                  "releaseCommit": run["head_sha"],
                  "releaseRef": "refs/heads/main",
                  "releaseRunId": int(os.environ[run_id_variable]),
              }
              for key, value in expected.items():
                  if evidence.get(key) != value:
                      raise SystemExit(
                          f"prior Trusted Publishing evidence mismatch: "
                          f"{distribution}: {key}"
                      )
              if evidence.get("workflowRef") != (
                  f"{os.environ['GITHUB_REPOSITORY']}/.github/workflows/"
                  "release.yml@refs/heads/main"
              ):
                  raise SystemExit(
                      f"prior Trusted Publishing workflow identity mismatch: {distribution}"
                  )
              shutil.copyfile(
                  source,
                  Path("publication-state-evidence")
                  / f"prior-trusted-publisher-{distribution}.json",
              )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-state-evidence-v0.1.3
          path: publication-state-evidence
          if-no-files-found: error
          retention-days: 90

  publish-store:
    needs: [attest-artifacts, inspect-publication, smoke-patches]
    if: needs.inspect-publication.outputs.store-publication-required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-attest-store
      url: https://pypi.org/p/attest-store
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-distributions-v0.1.1
          path: dist
      - name: Record the bounded store Trusted Publishing context
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          mkdir -p trusted-publisher-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schemaVersion": 1,
              "authentication": "oidc-trusted-publishing",
              "distribution": "attest-store",
              "environment": "pypi-attest-store",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "releaseRef": os.environ["GITHUB_REF"],
              "releaseRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "releaseRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
              "publisherAction": (
                  "pypa/gh-action-pypi-publish@"
                  "dc37677b2e1c63e2034f94d8a5b11f265b73ba33"
              ),
          }
          Path("trusted-publisher-evidence/attest-store.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-publisher-evidence-attest-store-v0.1.3
          path: trusted-publisher-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Publish the store patch with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          print-hash: true
          attestations: true

  publish-cli:
    needs: [attest-artifacts, inspect-publication, smoke-patches]
    if: needs.inspect-publication.outputs.cli-publication-required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi-attest-cli
      url: https://pypi.org/p/attest-cli
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-distributions-v0.1.3
          path: dist
      - name: Record the bounded CLI Trusted Publishing context
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          mkdir -p trusted-publisher-evidence
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schemaVersion": 1,
              "authentication": "oidc-trusted-publishing",
              "distribution": "attest-cli",
              "environment": "pypi-attest-cli",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "releaseRef": os.environ["GITHUB_REF"],
              "releaseRunAttempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "releaseRunId": int(os.environ["GITHUB_RUN_ID"]),
              "workflowRef": os.environ["GITHUB_WORKFLOW_REF"],
              "publisherAction": (
                  "pypa/gh-action-pypi-publish@"
                  "dc37677b2e1c63e2034f94d8a5b11f265b73ba33"
              ),
          }
          Path("trusted-publisher-evidence/attest-cli.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trusted-publisher-evidence-attest-cli-v0.1.3
          path: trusted-publisher-evidence
          if-no-files-found: error
          retention-days: 90
      - name: Publish the CLI patch with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          print-hash: true
          attestations: true

  verify-published:
    needs: [attest-artifacts, inspect-publication, publish-store, publish-cli]
    if: >-
      always() && needs.attest-artifacts.result == 'success' &&
      needs.inspect-publication.result == 'success' &&
      (needs.publish-store.result == 'success' || needs.publish-store.result == 'skipped') &&
      (needs.publish-cli.result == 'success' || needs.publish-cli.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.2"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: store-distributions-v0.1.1
          path: store-dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cli-distributions-v0.1.3
          path: cli-dist
      - name: Verify public store and CLI bytes and clean installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public-package-evidence
          uv run --no-project python scripts/verify_published_release.py \
            store-dist \
            --manifest release/patches/0.1.1-store.toml \
            --version "${STORE_VERSION}" \
            | tee "public-package-evidence/store-pypi-verification-python-${{ matrix.python }}.txt"
          uv run --no-project python scripts/verify_published_release.py \
            cli-dist \
            --manifest release/patches/0.1.3.toml \
            --version "${PRODUCT_VERSION}" \
            | tee "public-package-evidence/cli-pypi-verification-python-${{ matrix.python }}.txt"
          uv venv build/public-package-smoke --python "${{ matrix.python }}" --clear
          uv pip install \
            --python build/public-package-smoke/bin/python \
            --strict \
            --no-cache \
            "attest-store==${STORE_VERSION}" \
            "attest-cli==${PRODUCT_VERSION}"
          uv pip freeze --python build/public-package-smoke/bin/python \
            > "public-package-evidence/installed-python-${{ matrix.python }}.txt"
          build/public-package-smoke/bin/python - <<'PY'
          from importlib import metadata

          assert metadata.version("attest-store") == "0.1.1"
          assert metadata.version("attest-cli") == "0.1.3"
          for distribution in (
              "attest-core",
              "attest-collect",
              "attest-sign",
              "attest-policy",
          ):
              assert metadata.version(distribution) == "0.1.0"
          PY
          build/public-package-smoke/bin/attest --help > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-package-evidence-python-${{ matrix.python }}-v0.1.3
          path: public-package-evidence
          if-no-files-found: error
          retention-days: 90

  promote-image:
    needs: verify-published
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Promote or recover the exact candidate manifest without rebuilding
        shell: bash
        run: |
          set -euo pipefail
          release_image="${IMAGE_NAME}:${PRODUCT_VERSION}"
          mkdir -p image-promotion-evidence
          inspection_state=""
          for attempt in $(seq 1 5); do
            if docker buildx imagetools inspect "${release_image}" --raw \
              > image-promotion-evidence/promoted-manifest.json \
              2> image-promotion-evidence/initial-inspection.txt; then
              inspection_state=present
              break
            fi
            if grep -Eiq 'manifest unknown|manifest_unknown|not found' \
              image-promotion-evidence/initial-inspection.txt; then
              inspection_state=absent
              break
            fi
            if test "${attempt}" = "5"; then
              echo "image promotion: registry state remained indeterminate" >&2
              exit 1
            fi
            sleep 2
          done
          if test "${inspection_state}" = "present"; then
            promotion_state=existing-exact
          elif test "${inspection_state}" = "absent"; then
            docker buildx imagetools create \
              --tag "${release_image}" \
              "${IMAGE_NAME}@${REVIEWED_IMAGE_DIGEST}"
            docker buildx imagetools inspect "${release_image}" --raw \
              > image-promotion-evidence/promoted-manifest.json
            promotion_state=created
          else
            echo "image promotion: registry state was not classified" >&2
            exit 1
          fi
          observed="sha256:$(sha256sum image-promotion-evidence/promoted-manifest.json | cut -d ' ' -f 1)"
          test "${observed}" = "${REVIEWED_IMAGE_DIGEST}"
          printf '%s\n' "${release_image}@${observed}" \
            > image-promotion-evidence/release-image.txt
          printf '%s\n' "${promotion_state}" \
            > image-promotion-evidence/promotion-state.txt
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("image-promotion-evidence/promoted-manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          platforms = {
              f"{item['platform']['os']}/{item['platform']['architecture']}"
              for item in manifest["manifests"]
              if item["platform"]["os"] != "unknown"
          }
          if platforms != {"linux/amd64", "linux/arm64"}:
              raise SystemExit(f"unexpected promoted platforms: {sorted(platforms)}")
          PY
      - name: Retain exact image-promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-promotion-evidence-v0.1.3
          path: image-promotion-evidence
          if-no-files-found: error
          retention-days: 90

  dogfood:
    needs: [promote-image, verify-published]
    if: >-
      always() && needs.promote-image.result == 'success' &&
      needs.verify-published.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_IDENTITY: https://github.com/Parth2412/attest/.github/workflows/release.yml@refs/heads/main
      OIDC_ISSUER: https://token.actions.githubusercontent.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - name: Install the public CLI patch in isolation
        shell: bash
        run: |
          uv venv build/patch-dogfood --python 3.12 --clear
          uv pip install \
            --python build/patch-dogfood/bin/python \
            --strict \
            --no-cache \
            "attest-cli==${PRODUCT_VERSION}"
      - name: Attest and publicly verify the patch source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          build/patch-dogfood/bin/attest run \
            --output "build/release-evidence/attest-${PRODUCT_TAG}.bundle.json" \
            --repository . \
            --work-directory build/release-evidence/work \
            --policy release/attest-release-policy.yaml \
            --base "${FIRST_RELEASE_SHA}" \
            --head "${GITHUB_SHA}" \
            --target-branch main \
            --git-backend subprocess \
            --signing-environment production \
            --identity "${RELEASE_IDENTITY}" \
            --issuer "${OIDC_ISSUER}" \
            --verify-environment production \
            --online \
            --store-backend filesystem \
            --store-directory build/release-evidence/store \
            --fallback-directory build/release-evidence/fallback \
            --config release/attest-release-config.yaml \
            --json \
            > build/release-evidence/attest-run-report.json
          build/patch-dogfood/bin/attest verify \
            --input "build/release-evidence/attest-${PRODUCT_TAG}.bundle.json" \
            --repository . \
            --base "${FIRST_RELEASE_SHA}" \
            --head "${GITHUB_SHA}" \
            --identity "${RELEASE_IDENTITY}" \
            --issuer "${OIDC_ISSUER}" \
            --verify-environment production \
            --online \
            --config release/attest-release-config.yaml \
            --json \
            > build/release-evidence/public-verification.json
      - name: Retain attest dogfood evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: attest-release-evidence-v0.1.3
          path: build/release-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  publish-release:
    needs: [attest-artifacts, dogfood, promote-image, verify-published]
    if: >-
      always() && needs.attest-artifacts.result == 'success' &&
      needs.dogfood.result == 'success' &&
      needs.promote-image.result == 'success' &&
      needs.verify-published.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets-v0.1.3
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*-evidence*v0.1.3"
          path: retained-evidence
      - name: Assemble the retained release evidence index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p final-release-assets
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          from pathlib import Path

          root = Path("final-release-assets")
          for source_root in (Path("release-assets"), Path("retained-evidence")):
              for path in sorted(source_root.rglob("*"), key=lambda item: item.as_posix()):
                  relative = path.relative_to(source_root)
                  if any(part.startswith(".") for part in relative.parts):
                      raise SystemExit(f"hidden retained evidence is forbidden: {path}")
                  if path.is_dir() and not path.is_symlink():
                      continue
                  if not path.is_file() or path.is_symlink():
                      raise SystemExit(f"invalid retained evidence: {path}")
                  target = root / path.name
                  if target.exists():
                      raise SystemExit(f"duplicate release asset name: {path.name}")
                  shutil.copyfile(path, target)

          assets = []
          for path in sorted(root.iterdir(), key=lambda item: item.name):
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"invalid release asset: {path}")
              content = path.read_bytes()
              assets.append(
                  {
                      "name": path.name,
                      "sha256": hashlib.sha256(content).hexdigest(),
                      "size": len(content),
                  }
              )
          index = {
              "schemaVersion": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "releaseCommit": os.environ["GITHUB_SHA"],
              "releaseRunId": os.environ["GITHUB_RUN_ID"],
              "firstReleaseCommit": os.environ["FIRST_RELEASE_SHA"],
              "secondReleaseCommit": os.environ["SECOND_RELEASE_SHA"],
              "priorReleaseCommit": os.environ["PRIOR_RELEASE_SHA"],
              "storeVersion": os.environ["STORE_VERSION"],
              "candidateRunId": int(os.environ["REVIEWED_CANDIDATE_RUN_ID"]),
              "candidateSource": os.environ["REVIEWED_CANDIDATE_SOURCE_SHA"],
              "contextDigest": os.environ["REVIEWED_CONTEXT_DIGEST"],
              "imageDigest": os.environ["REVIEWED_IMAGE_DIGEST"],
              "majorTagMoved": False,
              "tags": [
                  os.environ["PRODUCT_TAG"],
                  os.environ["ACTION_VERSION_TAG"],
              ],
              "assets": assets,
          }
          (root / "release-evidence-index.json").write_text(
              json.dumps(index, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Create, verify, and publish the immutable patch Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${PRODUCT_TAG}" \
            --target "${GITHUB_SHA}" \
            --draft \
            --title "attest ${PRODUCT_VERSION} / Action ${ACTION_VERSION_TAG}" \
            --notes-file release/RELEASE_NOTES-v0.1.3.md
          gh release upload "${PRODUCT_TAG}" final-release-assets/*

          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${PRODUCT_TAG}\" and .draft == true)" \
              > release-draft.json
            if python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          release = json.loads(Path("release-draft.json").read_text(encoding="utf-8"))
          remote = {item["name"]: item["digest"] for item in release["assets"]}
          local = {
              path.name: f"sha256:{hashlib.sha256(path.read_bytes()).hexdigest()}"
              for path in Path("final-release-assets").iterdir()
              if path.is_file()
          }
          if remote != local:
              raise SystemExit("draft release assets differ from retained local evidence")
          PY
            then
              break
            fi
            if test "${attempt}" = "30"; then
              echo "patch release: draft asset digests were not observed" >&2
              exit 1
            fi
            sleep 2
          done

          gh release edit "${PRODUCT_TAG}" --draft=false --latest
          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" \
              > release-published.json
            if jq -e '
              .draft == false and
              .prerelease == false and
              .immutable == true
            ' release-published.json > /dev/null; then
              break
            fi
            if test "${attempt}" = "30"; then
              echo "patch release: immutable state was not observed" >&2
              exit 1
            fi
            sleep 10
          done

          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --field ref="refs/tags/${ACTION_VERSION_TAG}" \
            --field sha="${GITHUB_SHA}" > /dev/null
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object.sha')" \
              = "${GITHUB_SHA}"
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1" --jq '.object.sha')" \
            = "${FIRST_RELEASE_SHA}"
