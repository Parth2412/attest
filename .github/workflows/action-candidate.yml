name: action-candidate

on:
  push:
    branches: [dev]
    paths:
      - ".dockerignore"
      - ".github/workflows/action-candidate.yml"
      - "action/Dockerfile"
      - "action/entrypoint.py"
      - "action/runtime-components.openvex.json"
      - "action/runtime-source-artifact.Dockerfile"
      - "action/runtime-sources.json"
      - "action/trust/**"
      - "action/verify_trust_seed.py"
      - "packages/attest-core/**"
      - "packages/attest-collect/**"
      - "packages/attest-sign/**"
      - "packages/attest-store/**"
      - "packages/attest-policy/**"
      - "packages/attest-cli/**"
      - "pyproject.toml"
      - "release/packages.toml"
      - "release/patches/0.1.5-unchanged-libraries.toml"
      - "release/patches/0.1.2-store.toml"
      - "release/patches/0.1.1-sign.toml"
      - "release/patches/0.1.5.toml"
      - "scripts/prepare_action_context.py"
      - "scripts/prepare_action_runtime_sources.py"
      - "scripts/check_action_component_scan.py"
      - "scripts/check_action_scan.py"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-candidate-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/parth2412/attest

jobs:
  validate:
    if: github.repository == 'Parth2412/attest' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - run: uv sync --locked --all-packages
      - name: Run the complete release gate
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run python scripts/run_mypy.py
          uv run lint-imports
          uv run pytest
          uv run python scripts/run_test_group.py vectors F-01 F-02
          uv run python scripts/run_test_group.py adversarial F-08
          uv run pytest packages/attest-sign/tests/test_verifier.py \
            packages/attest-sign/tests/test_inspection.py \
            --cov=attest_sign.verifier --cov-report=term-missing --cov-fail-under=95
          uv run pytest packages/attest-collect/tests/test_github_review.py \
            packages/attest-collect/tests/test_github_http.py \
            packages/attest-collect/tests/test_github_checks.py \
            packages/attest-collect/tests/test_github_context.py \
            --cov=attest_collect.github --cov=attest_collect._github_http \
            --cov-report=term-missing --cov-fail-under=90
          uv run pytest packages/attest-policy/tests --cov=attest_policy \
            --cov-report=term-missing --cov-fail-under=95
          uv run pytest packages/attest-store/tests --cov=attest_store \
            --cov-report=term-missing --cov-fail-under=90
          uv run pytest packages/attest-cli/tests -m "not performance" --cov=attest_cli \
            --cov-report=term-missing --cov-fail-under=90
          uv run pytest \
            packages/attest-cli/tests/test_cli_surface.py::test_ten_clean_installed_help_processes_each_finish_under_300ms \
            -m performance
          uv build --package attest-core --out-dir build/library-dist \
            --clear --no-create-gitignore
          uv build --package attest-collect --out-dir build/library-dist --no-create-gitignore
          uv build --package attest-policy --out-dir build/library-dist --no-create-gitignore
          uv run --no-project python scripts/validate_release_artifacts.py \
            build/library-dist \
            --manifest release/patches/0.1.5-unchanged-libraries.toml \
            --hash-output build/LIBRARY-SHA256SUMS
          uv build --package attest-store --out-dir build/store-dist \
            --clear --no-create-gitignore
          uv run --no-project python scripts/validate_release_artifacts.py \
            build/store-dist \
            --manifest release/patches/0.1.2-store.toml \
            --hash-output build/STORE-SHA256SUMS
          uv build --package attest-sign --out-dir build/sign-dist \
            --clear --no-create-gitignore
          uv run --no-project python scripts/validate_release_artifacts.py \
            build/sign-dist \
            --manifest release/patches/0.1.1-sign.toml \
            --hash-output build/SIGN-SHA256SUMS
          uv build --package attest-cli --out-dir build/cli-dist \
            --clear --no-create-gitignore
          uv run --no-project python scripts/validate_release_artifacts.py \
            build/cli-dist \
            --manifest release/patches/0.1.5.toml \
            --hash-output build/CLI-SHA256SUMS
          uv run --no-project python scripts/prepare_action_runtime_sources.py \
            build/action-runtime-sources
          uv run --no-project python scripts/prepare_action_context.py \
            build/action-context \
            --runtime-sources build/action-runtime-sources \
            --manifest-output build/action-context-manifest.json \
            --digest-output build/action-context.sha256
          docker build --tag attest-action-runtime:test \
            --file build/action-context/action/Dockerfile build/action-context
          ATTEST_ACTION_IMAGE=attest-action-runtime:test \
            uv run pytest action/tests/test_container.py -m container
          uv run python scripts/write_schema.py --check
          uv run python scripts/check_banned_language.py
          uv run python scripts/check_traceability.py
          uv run bandit -r packages action --exclude "*/tests/*,*/mutants/*" -c pyproject.toml
          uv run pip-audit

  source:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      source-digest: ${{ steps.source.outputs.digest }}
      source-ref: ${{ steps.source.outputs.reference }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - name: Prepare the hash-verified corresponding source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/source-evidence"
          uv run --no-project python scripts/prepare_action_runtime_sources.py \
            "${RUNNER_TEMP}/runtime-sources"
          cp "${RUNNER_TEMP}/runtime-sources/SOURCE-MANIFEST.json" \
            "${RUNNER_TEMP}/source-evidence/source-manifest.json"
          cp "${RUNNER_TEMP}/runtime-sources/runtime-components.spdx.json" \
            "${RUNNER_TEMP}/source-evidence/runtime-components.spdx.json"
          cp "${RUNNER_TEMP}/runtime-sources/runtime-components.openvex.json" \
            "${RUNNER_TEMP}/source-evidence/runtime-components.openvex.json"
      - name: Select the unique source artifact tag
        id: source-tag
        shell: bash
        run: |
          reference="${IMAGE_NAME}:source-candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Publish corresponding source before the binary candidate
        id: source-build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/runtime-sources
          file: ${{ github.workspace }}/action/runtime-source-artifact.Dockerfile
          platforms: linux/amd64
          pull: true
          outputs: type=image,name=${{ steps.source-tag.outputs.reference }},push=true,oci-mediatypes=true,compression=zstd,compression-level=22,force-compression=true
          provenance: false
          sbom: false
      - name: Prove the public artifact contains the exact verified source
        id: source
        env:
          SOURCE_DIGEST: ${{ steps.source-build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          source_reference="${IMAGE_NAME}@${SOURCE_DIGEST}"
          echo "digest=${SOURCE_DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "reference=${source_reference}" >> "${GITHUB_OUTPUT}"
          printf '%s\n' "${SOURCE_DIGEST}" \
            > "${RUNNER_TEMP}/source-evidence/source-artifact-digest.txt"
          printf '%s\n' "${source_reference}" \
            > "${RUNNER_TEMP}/source-evidence/source-artifact-reference.txt"
          docker buildx imagetools inspect "${source_reference}" --raw \
            > "${RUNNER_TEMP}/source-evidence/source-artifact-manifest.json"
          observed="sha256:$(sha256sum "${RUNNER_TEMP}/source-evidence/source-artifact-manifest.json" | cut -d ' ' -f 1)"
          test "${observed}" = "${SOURCE_DIGEST}"
          docker pull "${source_reference}"
          container="$(docker create "${source_reference}" /unused)"
          trap 'docker rm -f "${container}" >/dev/null 2>&1 || true' EXIT
          mkdir "${RUNNER_TEMP}/exported-runtime-sources"
          docker cp "${container}:/source/." "${RUNNER_TEMP}/exported-runtime-sources"
          python3 - "${RUNNER_TEMP}/runtime-sources" \
            "${RUNNER_TEMP}/exported-runtime-sources" <<'PY'
          from pathlib import Path
          import stat
          import sys

          expected = Path(sys.argv[1])
          observed = Path(sys.argv[2])

          def contents(root: Path) -> dict[str, bytes]:
              result: dict[str, bytes] = {}
              for path in sorted(root.rglob("*")):
                  metadata = path.lstat()
                  if path.is_symlink() or not stat.S_ISREG(metadata.st_mode):
                      if path.is_dir() and not path.is_symlink():
                          continue
                      raise SystemExit("runtime source artifact contains an unsafe path")
                  result[path.relative_to(root).as_posix()] = path.read_bytes()
              return result

          if contents(expected) != contents(observed):
              raise SystemExit("runtime source artifact differs from the verified payload")
          PY
      - name: Attest the corresponding source artifact
        id: source-attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/parth2412/attest
          subject-digest: ${{ steps.source-build.outputs.digest }}
          push-to-registry: true
      - name: Verify the source identity and retain its attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://${{ steps.source.outputs.reference }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/action-candidate.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "refs/heads/dev" \
            --deny-self-hosted-runners \
            --format json \
            > "${RUNNER_TEMP}/source-evidence/source-attestation-verification.json"
          cp "${{ steps.source-attest.outputs.bundle-path }}" \
            "${RUNNER_TEMP}/source-evidence/source-attestation.jsonl"
      - name: Upload verified source inputs for this run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-runtime-sources-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-sources
          if-no-files-found: error
          retention-days: 1
      - name: Upload public corresponding-source evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-candidate-source-${{ github.sha }}
          path: ${{ runner.temp }}/source-evidence
          if-no-files-found: error
          retention-days: 90

  component-scan:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-runtime-sources-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-sources
      - name: Scan exact components
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/component-scan"
          docker run --rm \
            --volume "${RUNNER_TEMP}/runtime-sources:/source:ro" \
            --volume "${RUNNER_TEMP}/component-scan:/evidence" \
            anchore/grype@sha256:8abea00b30d3eefe8903c954da241e751a0a23051e7f6463311611a90d854750 \
            sbom:/source/runtime-components.spdx.json \
            --output json \
            --file /evidence/grype-runtime-components.json
      - name: Upload component scan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-candidate-component-scan-${{ github.sha }}
          path: ${{ runner.temp }}/component-scan/grype-runtime-components.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce the component security gate
        shell: bash
        run: python3 scripts/check_action_component_scan.py "${RUNNER_TEMP}/component-scan/grype-runtime-components.json" --sbom "${RUNNER_TEMP}/runtime-sources/runtime-components.spdx.json" --vex "${RUNNER_TEMP}/runtime-sources/runtime-components.openvex.json"

  build:
    needs: [source, component-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      context-digest: ${{ steps.context.outputs.digest }}
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.image.outputs.reference }}
      source-artifact-digest: ${{ needs.source.outputs.source-digest }}
      source-artifact-ref: ${{ needs.source.outputs.source-ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: action-runtime-sources-${{ github.sha }}
          path: ${{ runner.temp }}/runtime-sources
      - name: Stage and fingerprint the enumerated context
        id: context
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/candidate-evidence"
          uv run --no-project python scripts/prepare_action_context.py \
            "${RUNNER_TEMP}/attest-action-context" \
            --runtime-sources "${RUNNER_TEMP}/runtime-sources" \
            --manifest-output "${RUNNER_TEMP}/candidate-evidence/context-manifest.json" \
            --digest-output "${RUNNER_TEMP}/candidate-evidence/context-digest.txt"
          digest="$(tr -d '\n' < "${RUNNER_TEMP}/candidate-evidence/context-digest.txt")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"
      - name: Select the immutable candidate reference
        id: image
        shell: bash
        run: |
          reference="${IMAGE_NAME}:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "reference=${reference}" >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with: { platforms: "amd64,arm64" }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push the multi-platform candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ runner.temp }}/attest-action-context
          file: ${{ runner.temp }}/attest-action-context/action/Dockerfile
          platforms: linux/amd64,linux/arm64
          pull: true
          outputs: type=image,name=${{ steps.image.outputs.reference }},push=true,oci-mediatypes=true,compression=zstd,compression-level=22,force-compression=true
          labels: |
            io.github.parth2412.attest.context-digest=${{ steps.context.outputs.digest }}
            io.github.parth2412.attest.source-artifact=${{ needs.source.outputs.source-ref }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=0.1.7-candidate
          sbom: true
          provenance: mode=max
      - name: Retain and validate the manifests, SBOM, and provenance
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          image="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker buildx imagetools inspect "${image}" --raw \
            > "${RUNNER_TEMP}/candidate-evidence/manifest.json"
          jq -r '
            .manifests[]
            | select(.platform.os == "linux")
            | [.platform.os, .platform.architecture, .digest]
            | @tsv
          ' "${RUNNER_TEMP}/candidate-evidence/manifest.json" \
            | while IFS=$'\t' read -r operating_system architecture digest; do
                docker buildx imagetools inspect "${IMAGE_NAME}@${digest}" --raw \
                  > "${RUNNER_TEMP}/candidate-evidence/manifest-${operating_system}-${architecture}.json"
              done
          docker buildx imagetools inspect "${image}" --format '{{json .SBOM}}' \
            > "${RUNNER_TEMP}/candidate-evidence/sbom.spdx.json"
          docker buildx imagetools inspect "${image}" --format '{{json .Provenance}}' \
            > "${RUNNER_TEMP}/candidate-evidence/provenance.slsa.json"
          python3 - "${RUNNER_TEMP}/candidate-evidence" "${IMAGE_DIGEST}" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          evidence = pathlib.Path(sys.argv[1])
          image_digest = sys.argv[2]
          manifest = json.loads((evidence / "manifest.json").read_text(encoding="utf-8"))
          descriptors = {
              (item.get("platform") or {}).get("os")
              + "/"
              + (item.get("platform") or {}).get("architecture"): item
              for item in manifest.get("manifests", [])
              if (item.get("platform") or {}).get("os") != "unknown"
          }
          if set(descriptors) != {"linux/amd64", "linux/arm64"}:
              raise SystemExit(f"unexpected candidate platforms: {sorted(descriptors)}")
          layer_media_type = "application/vnd.oci.image.layer.v1.tar+zstd"
          for platform, descriptor in descriptors.items():
              operating_system, architecture = platform.split("/")
              path = evidence / f"manifest-{operating_system}-{architecture}.json"
              raw = path.read_bytes()
              observed_digest = "sha256:" + hashlib.sha256(raw).hexdigest()
              if observed_digest != descriptor.get("digest"):
                  raise SystemExit(f"candidate {platform} manifest digest mismatch")
              document = json.loads(raw)
              layers = document.get("layers")
              if not isinstance(layers, list) or len(layers) != 4:
                  raise SystemExit(f"candidate {platform} manifest does not have four layers")
              if any(layer.get("mediaType") != layer_media_type for layer in layers):
                  raise SystemExit(f"candidate {platform} image layers are not all zstd")
              layer_evidence = {
                  "platform": platform,
                  "primaryLayers": layers[:3],
                  "entrypointLayer": layers[3],
              }
              (evidence / f"layers-{operating_system}-{architecture}.json").write_text(
                  json.dumps(layer_evidence, indent=2, sort_keys=True) + "\n",
                  encoding="utf-8",
              )
          for name in ("sbom.spdx.json", "provenance.slsa.json"):
              value = json.loads((evidence / name).read_text(encoding="utf-8"))
              if not value:
                  raise SystemExit(f"empty candidate evidence: {name}")
          (evidence / "image-digest.txt").write_text(f"{image_digest}\n", encoding="utf-8")
          PY
          printf '%s\n' "${BUILD_METADATA}" \
            > "${RUNNER_TEMP}/candidate-evidence/build-metadata.json"
      - name: Upload candidate build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-candidate-build-${{ github.sha }}
          path: ${{ runner.temp }}/candidate-evidence
          if-no-files-found: error
          retention-days: 90

  test-image:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
          - platform: linux/arm64
            slug: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - run: uv sync --locked --all-packages
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with: { platforms: "amd64,arm64" }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull the exact candidate platform
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.image-digest }}
          PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}@${IMAGE_DIGEST}"
          docker pull --platform "${PLATFORM}" "${image}"
          docker tag "${image}" "attest-action-runtime:test"
      - name: Retain archive and image size evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/container-test-evidence"
          image_bytes="$(docker image inspect "attest-action-runtime:test" --format '{{.Size}}')"
          mapfile -t archive_bytes < <(
            docker run --rm --entrypoint /bin/busybox "attest-action-runtime:test" \
              sh -c \
              '/bin/busybox stat -c %s /usr/local/lib/python312.zip; /bin/busybox stat -c %s /opt/venv/lib/python3.12/site-packages/attest-runtime.zip'
          )
          test "${#archive_bytes[@]}" -eq 2
          mapfile -t transport < <(
            docker run --rm --entrypoint /bin/busybox "attest-action-runtime:test" \
              sh -c '
                /bin/busybox stat -c %s /usr/bin/git
                /bin/busybox sha256sum /usr/bin/git | /bin/busybox cut -d " " -f 1
                /bin/busybox stat -c %s /usr/libexec/git-core/git-remote-http
                /bin/busybox sha256sum /usr/libexec/git-core/git-remote-http | /bin/busybox cut -d " " -f 1
                /bin/busybox stat -Lc %s /usr/lib/libcurl.so.4
                /bin/busybox sha256sum /usr/lib/libcurl.so.4 | /bin/busybox cut -d " " -f 1
                /usr/bin/git --version
              '
          )
          test "${#transport[@]}" -eq 7
          curl_version="$(docker run --rm --entrypoint /opt/venv/bin/python \
            "attest-action-runtime:test" -I -c '
          import ctypes
          version = ctypes.CDLL("/usr/lib/libcurl.so.4").curl_version
          version.restype = ctypes.c_char_p
          print(version().decode())
          ')"
          docker run --rm --entrypoint /bin/busybox "attest-action-runtime:test" \
            cat /usr/share/attest/loader-dependencies.txt \
            > "${RUNNER_TEMP}/container-test-evidence/${{ matrix.slug }}-loader-dependencies.txt"
          jq -n \
            --arg platform "${{ matrix.platform }}" \
            --arg gitSha256 "${transport[1]}" \
            --arg gitRemoteHttpSha256 "${transport[3]}" \
            --arg libcurlSha256 "${transport[5]}" \
            --arg gitVersion "${transport[6]}" \
            --arg curlVersion "${curl_version}" \
            --argjson imageBytes "${image_bytes}" \
            --argjson standardLibraryArchiveBytes "${archive_bytes[0]}" \
            --argjson runtimeArchiveBytes "${archive_bytes[1]}" \
            --argjson gitBytes "${transport[0]}" \
            --argjson gitRemoteHttpBytes "${transport[2]}" \
            --argjson libcurlBytes "${transport[4]}" \
            '{
              platform: $platform,
              imageBytes: $imageBytes,
              standardLibraryArchiveBytes: $standardLibraryArchiveBytes,
              runtimeArchiveBytes: $runtimeArchiveBytes,
              gitBytes: $gitBytes,
              gitSha256: $gitSha256,
              gitRemoteHttpBytes: $gitRemoteHttpBytes,
              gitRemoteHttpSha256: $gitRemoteHttpSha256,
              libcurlBytes: $libcurlBytes,
              libcurlSha256: $libcurlSha256,
              gitVersion: $gitVersion,
              curlVersion: $curlVersion
            }' > "${RUNNER_TEMP}/container-test-evidence/${{ matrix.slug }}-sizes.json"
      - name: Run the real-container contract suite
        env:
          ATTEST_ACTION_IMAGE: attest-action-runtime:test
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/container-test-evidence"
          uv run pytest action/tests/test_container.py -m container \
            --junitxml "${RUNNER_TEMP}/container-test-evidence/${{ matrix.slug }}.xml"
      - name: Retain platform container-test evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-candidate-container-${{ matrix.slug }}-${{ github.sha }}
          path: ${{ runner.temp }}/container-test-evidence
          if-no-files-found: error
          retention-days: 90

  scan:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            slug: linux-amd64
          - platform: linux/arm64
            slug: linux-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Scan the candidate platform
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE_NAME }}@${{ needs.build.outputs.image-digest }}
          scanners: vuln,secret
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          format: json
          output: trivy-${{ matrix.slug }}.json
          exit-code: "0"
          cache: "false"
      - name: Upload platform scan evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-candidate-scan-${{ matrix.slug }}-${{ github.sha }}
          path: trivy-${{ matrix.slug }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce the candidate security gate
        shell: bash
        run: python3 scripts/check_action_scan.py "trivy-${{ matrix.slug }}.json"

  attest:
    needs: [build, test-image, scan, component-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Generate the GitHub artifact attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/parth2412/attest
          subject-digest: ${{ needs.build.outputs.image-digest }}
          push-to-registry: true
      - name: Verify the identity-bound candidate attestation
        env:
          CANDIDATE_OUTPUTS: ${{ toJSON(needs.build.outputs) }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/attestation-evidence"
          gh attestation verify \
            "oci://${IMAGE_NAME}@${{ needs.build.outputs.image-digest }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/action-candidate.yml" \
            --source-digest "${GITHUB_SHA}" \
            --source-ref "refs/heads/dev" \
            --deny-self-hosted-runners \
            --format json \
            > "${RUNNER_TEMP}/attestation-evidence/verification.json"
          cp "${{ steps.attest.outputs.bundle-path }}" \
            "${RUNNER_TEMP}/attestation-evidence/github-attestation.jsonl"
          printf '%s\n' "${CANDIDATE_OUTPUTS}" \
            > "${RUNNER_TEMP}/attestation-evidence/candidate-outputs.json"
      - name: Upload GitHub attestation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-candidate-attestation-${{ github.sha }}
          path: ${{ runner.temp }}/attestation-evidence
          if-no-files-found: error
          retention-days: 90
