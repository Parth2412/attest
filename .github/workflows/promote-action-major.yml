name: promote Action major

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-action-major-v1
  cancel-in-progress: false

env:
  ACTION_MAJOR_TAG: v1
  ACTION_VERSION_TAG: v1.0.8
  PRODUCT_TAG: v0.1.8
  CURRENT_MAJOR_SHA: c42e52d038f5ecdcc498679cb7648e5b0957d489
  TARGET_RELEASE_SHA: 1ea933184d1467c0716a5c23e9a1d005c1906567
  RELEASE_RUN_ID: 40710909968
  PROOF_REPOSITORY: Parth2412/attest-action-proof
  PROOF_PR: 17
  FORK_PROOF_PR: 18
  PROOF_BASE_SHA: 697a7ee4622f7bd318ee24baab3fd1964cc29a8c
  PROOF_HEAD_SHA: de5092864d2cea9313aad285d5fa2a77d73cc482
  PROOF_MERGE_SHA: c8fa440f58aede20eaa8b4530d929d48f0f867e3
  FORK_PROOF_SHA: 12cf842f2a7a98f8fd43beb79c06a6633e7c3bdc
  CHANGESET_DIGEST: 7c896194bfb887eb7d146480ef3d1a62f30bebbf213e259e172890e895a75c64
  DENIED_REF_OID: cbe8307dc364572298de3825eda7b78681826d9b
  DENIED_BLOB_OID: 45d8a334aca46d86d9e7718390601b34123ce2c4
  DENIED_BUNDLE_SHA256: 888d458fe59cf0ea0bf853e9e7a3a5e5233b560a3e6fd317b5faaa671082a1be
  APPROVED_REF_SUFFIX: "3542140461"
  APPROVED_REF_OID: 8aedad2f24647b0bc0878164886baf921fd9bc46
  APPROVED_BLOB_OID: dba3a620270e055820d4f0f0247d4b39640f0c45
  APPROVED_BUNDLE_SHA256: a88c35d3cd9e047c45e0c3547623bfa771159c0ab58512309afda5c3f2e55c69

jobs:
  preflight:
    if: github.repository == 'Parth2412/attest' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - name: Validate the immutable source release and controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "main"
          git merge-base --is-ancestor "${TARGET_RELEASE_SHA}" "${GITHUB_SHA}"
          uv lock --check

          mkdir -p promotion-evidence/source promotion-evidence/proof
          timeout 60s gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > promotion-evidence/source/main-ci-runs.json
          jq -e --arg sha "${GITHUB_SHA}" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            promotion-evidence/source/main-ci-runs.json > /dev/null

          timeout 60s gh api \
            "repos/${GITHUB_REPOSITORY}/environments/action-major" \
            > promotion-evidence/source/action-major-environment.json
          jq -e --arg owner "${GITHUB_REPOSITORY_OWNER}" '
            .name == "action-major" and
            .can_admins_bypass == false and
            .deployment_branch_policy.protected_branches == true and
            .deployment_branch_policy.custom_branch_policies == false and
            ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 1 and
            ([
              .protection_rules[] |
              select(.type == "required_reviewers") |
              .prevent_self_review
            ] == [false]) and
            ([
              .protection_rules[] |
              select(.type == "required_reviewers") |
              .reviewers[] |
              {type, login: .reviewer.login}
            ] == [{type: "User", login: $owner}])
          ' promotion-evidence/source/action-major-environment.json > /dev/null

          timeout 60s gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            > promotion-evidence/source/rulesets.json
          ruleset_id="$(jq -er '
            .[] |
            select(
              .name == "Protect immutable release tags" and
              .target == "tag" and
              .enforcement == "active"
            ) |
            .id
          ' promotion-evidence/source/rulesets.json)"
          timeout 60s gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
            > promotion-evidence/source/tag-ruleset.json
          jq -e '
            (.bypass_actors // []) == [] and
            (.conditions.ref_name.include | sort) ==
              ([
                "refs/tags/v0.1.0",
                "refs/tags/v0.1.1",
                "refs/tags/v0.1.2",
                "refs/tags/v0.1.3",
                "refs/tags/v0.1.4",
                "refs/tags/v0.1.5",
                "refs/tags/v0.1.6",
                "refs/tags/v0.1.7",
                "refs/tags/v0.1.8",
                "refs/tags/v1.0.0",
                "refs/tags/v1.0.1",
                "refs/tags/v1.0.2",
                "refs/tags/v1.0.3",
                "refs/tags/v1.0.4",
                "refs/tags/v1.0.5",
                "refs/tags/v1.0.6",
                "refs/tags/v1.0.7",
                "refs/tags/v1.0.8"
              ] | sort) and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | sort) == (["deletion", "update"] | sort)
          ' promotion-evidence/source/tag-ruleset.json > /dev/null

          for tag in \
            v0.1.0 v1.0.0 v1 \
            v0.1.1 v1.0.1 \
            v0.1.2 v1.0.2 \
            v0.1.3 v1.0.3 \
            v0.1.4 v1.0.4 \
            v0.1.5 v1.0.5 \
            v0.1.6 v1.0.6 \
            v0.1.7 v1.0.7 \
            "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"
          do
            timeout 60s gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              > "promotion-evidence/source/tag-${tag}.json"
          done
          for tag in v0.1.0 v1.0.0; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "a1c59cc67bf67aba22ffca876309f855ea8663af"
          done
          for tag in v0.1.1 v1.0.1; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "9aa18c1d5af6659c4dbc79443dfda93208395dff"
          done
          for tag in v0.1.2 v1.0.2; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "60951624b5572aa1f54db9c2693cb7a8e0399425"
          done
          for tag in v0.1.3 v1.0.3; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "8dcfdaf4b16a0547222e3f174bc0c0e13e3549c8"
          done
          for tag in v0.1.4 v1.0.4; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "4e73dcaf888f15967da66826d48cca5ac6684fcb"
          done
          for tag in v0.1.5 v1.0.5; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "203d2deb7dff946dc82c6efc6506bc34adbcd209"
          done
          for tag in v0.1.6 v1.0.6; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "e693e6b60afdf9c667a913faa4f9652bfd6dc050"
          done
          for tag in v0.1.7 v1.0.7 v1; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "${CURRENT_MAJOR_SHA}"
          done
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "${TARGET_RELEASE_SHA}"
          done

          timeout 60s gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" \
            > promotion-evidence/source/release.json
          jq -e --arg tag "${PRODUCT_TAG}" --arg sha "${TARGET_RELEASE_SHA}" '
            .tag_name == $tag and
            .target_commitish == $sha and
            .draft == false and
            .prerelease == false and
            .immutable == true
          ' promotion-evidence/source/release.json > /dev/null

          timeout 60s gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" \
            > promotion-evidence/source/release-run.json
          jq -e '
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .run_attempt == 1 and
            .head_branch == "main" and
            .head_sha == "1ea933184d1467c0716a5c23e9a1d005c1906567" and
            .path == ".github/workflows/release.yml"
          ' promotion-evidence/source/release-run.json > /dev/null

          timeout 60s gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/artifacts" \
            > promotion-evidence/source/release-run-artifacts.json
          jq -e '
            .total_count == 8 and
            ([.artifacts[] | {
              id,
              name,
              size_in_bytes,
              expired
            }] | sort_by(.id)) == ([
              {
                id: 12824639353,
                name: "release-assets-v0.1.8",
                size_in_bytes: 11083825,
                expired: false
              },
              {
                id: 12824939633,
                name: "release-preflight-evidence-v0.1.8",
                size_in_bytes: 350845,
                expired: false
              },
              {
                id: 12825552585,
                name: "image-promotion-evidence-v0.1.8",
                size_in_bytes: 1170,
                expired: false
              },
              {
                id: 12825887603,
                name: "release-corresponding-source-v0.1.8",
                size_in_bytes: 10968578,
                expired: false
              },
              {
                id: 12826141950,
                name: "release-asset-attestation-evidence-v0.1.8",
                size_in_bytes: 132850,
                expired: false
              },
              {
                id: 12826611034,
                name: "public-package-evidence-python-3.12-v0.1.8",
                size_in_bytes: 11171,
                expired: false
              },
              {
                id: 12826705998,
                name: "public-package-evidence-python-3.13-v0.1.8",
                size_in_bytes: 11171,
                expired: false
              },
              {
                id: 12826975342,
                name: "release-dogfood-evidence-v0.1.8",
                size_in_bytes: 34045,
                expired: false
              }
            ] | sort_by(.id))
          ' promotion-evidence/source/release-run-artifacts.json > /dev/null

          git show "${TARGET_RELEASE_SHA}:action/action.yml" \
            > promotion-evidence/source/action.yml
          observed_image="$(awk '
            /^  image: docker:\/\// {
              sub(/^  image: docker:\/\//, "")
              print
            }
          ' promotion-evidence/source/action.yml)"
          test "${observed_image}" = "ghcr.io/parth2412/attest@sha256:1b40c02bfacaae958a2adf9bfc25485fe0c22794db50c19aa401db530ea36c61"

      - name: Validate public proof metadata
        shell: bash
        run: |
          set -euo pipefail
          public_api() {
            endpoint="$1"
            output="$2"
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --user-agent 'attest-action-major-promotion' \
              "https://api.github.com/repos/${PROOF_REPOSITORY}/${endpoint}" \
              > "promotion-evidence/proof/${output}"
          }

          public_api "pulls/${PROOF_PR}" proof-pr.json
          public_api "pulls/${PROOF_PR}/reviews" proof-reviews.json
          public_api "actions/runs/40714284739" proof-run.json
          public_api "actions/runs/40714284739/attempts/2/jobs" denied-jobs.json
          public_api "actions/runs/40714284739/attempts/3/jobs" approved-jobs.json
          public_api "actions/jobs/122907877939" denied-job.json
          public_api "actions/jobs/122918868298" approved-job.json
          public_api "check-runs/122907877939" denied-check.json
          public_api "check-runs/122918868298" approved-check.json
          public_api "actions/runs/40714241270" blocked-run.json
          public_api "actions/runs/40714241270/artifacts" blocked-artifacts.json
          public_api "pulls/${FORK_PROOF_PR}" fork-pr.json
          public_api "issues/${FORK_PROOF_PR}/comments" fork-comments.json
          public_api "actions/runs/40717727146" fork-run.json
          public_api "actions/jobs/122919867168" fork-job.json
          public_api "check-runs/122919867168" fork-check.json

          jq -e \
            --arg base "${PROOF_BASE_SHA}" \
            --arg head "${PROOF_HEAD_SHA}" \
            --arg merge "${PROOF_MERGE_SHA}" \
            --arg repository "${PROOF_REPOSITORY}" '
              .state == "closed" and
              .merged == true and
              .draft == false and
              .user.id == 41898282 and
              .base.sha == $base and
              .head.sha == $head and
              .base.repo.full_name == $repository and
              .head.repo.full_name == $repository and
              .merge_commit_sha == $merge and
              .merged_by.id == 23364077 and
              .commits == 1 and
              .changed_files == 1
            ' promotion-evidence/proof/proof-pr.json > /dev/null
          jq -e --arg head "${PROOF_HEAD_SHA}" '
            length == 1 and
            .[0].state == "APPROVED" and
            .[0].user.id == 23364077 and
            .[0].commit_id == $head and
            .[0].submitted_at == "2026-10-28T15:34:36Z"
          ' promotion-evidence/proof/proof-reviews.json > /dev/null
          jq -e --arg head "${PROOF_HEAD_SHA}" '
            .id == 40714284739 and
            .event == "pull_request" and
            .status == "completed" and
            .conclusion == "success" and
            .run_attempt == 3 and
            .head_sha == $head and
            .head_repository.full_name == "Parth2412/attest-action-proof" and
            .path == ".github/workflows/attest.yml"
          ' promotion-evidence/proof/proof-run.json > /dev/null
          jq -e '
            (.jobs | length) == 1 and
            .jobs[0].id == 122907877939 and
            .jobs[0].name == "attest" and
            .jobs[0].conclusion == "failure"
          ' promotion-evidence/proof/denied-jobs.json > /dev/null
          jq -e '
            (.jobs | length) == 1 and
            .jobs[0].id == 122918868298 and
            .jobs[0].name == "attest" and
            .jobs[0].conclusion == "success"
          ' promotion-evidence/proof/approved-jobs.json > /dev/null

          jq -e '
            .id == 122907877939 and
            .name == "attest" and
            .conclusion == "failure" and
            any(.steps[];
              .name == "Run Parth2412/attest/action@1ea933184d1467c0716a5c23e9a1d005c1906567" and
              .conclusion == "failure"
            )
          ' promotion-evidence/proof/denied-job.json > /dev/null
          jq -e '
            .id == 122918868298 and
            .name == "attest" and
            .conclusion == "success" and
            any(.steps[];
              .name == "Run Parth2412/attest/action@1ea933184d1467c0716a5c23e9a1d005c1906567" and
              .conclusion == "success"
            )
          ' promotion-evidence/proof/approved-job.json > /dev/null
          jq -e '
            .id == 122907877939 and
            .name == "attest" and
            .status == "completed" and
            .conclusion == "failure" and
            .app.id == 15368
          ' promotion-evidence/proof/denied-check.json > /dev/null
          jq -e '
            .id == 122918868298 and
            .name == "attest" and
            .status == "completed" and
            .conclusion == "success" and
            .app.id == 15368
          ' promotion-evidence/proof/approved-check.json > /dev/null

          jq -e '
            .id == 40714241270 and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .run_attempt == 1 and
            .head_sha == "f8eecb7d55faca85134b848beb0cea6cac3ddabf" and
            .path == ".github/workflows/open-proof-pr.yml"
          ' promotion-evidence/proof/blocked-run.json > /dev/null
          jq -e '
            .total_count == 1 and
            (.artifacts | length) == 1 and
            .artifacts[0].id == 12825699939 and
            .artifacts[0].name == "blocked-review-gate-v0.1.8-evidence-40714241270" and
            .artifacts[0].expired == false and
            .artifacts[0].size_in_bytes == 3007
          ' promotion-evidence/proof/blocked-artifacts.json > /dev/null

          jq -e --arg base "${PROOF_MERGE_SHA}" --arg head "${FORK_PROOF_SHA}" '
            .state == "closed" and
            .merged == false and
            .draft == false and
            .user.id == 23364077 and
            .base.sha == $base and
            .head.sha == $head and
            .base.repo.full_name == "Parth2412/attest-action-proof" and
            .head.repo.full_name == "zettacore-labs/attest-action-proof"
          ' promotion-evidence/proof/fork-pr.json > /dev/null
          jq -e '
            length == 1 and
            .[0].user.id == 23364077 and
            .[0].author_association == "OWNER" and
            (. [0].body | contains("ERR-SIGN-301")) and
            (. [0].body | contains("before reading the deliberately invalid")) and
            (. [0].body | contains("ACTIONS_ID_TOKEN_REQUEST_URL")) and
            (. [0].body | contains("ACTIONS_ID_TOKEN_REQUEST_TOKEN")) and
            (. [0].body | contains("no elevated `pull_request_target`"))
          ' promotion-evidence/proof/fork-comments.json > /dev/null
          jq -e --arg head "${FORK_PROOF_SHA}" '
            .id == 40717727146 and
            .event == "pull_request" and
            .status == "completed" and
            .conclusion == "failure" and
            .run_attempt == 1 and
            .head_sha == $head and
            .head_repository.full_name == "zettacore-labs/attest-action-proof" and
            .path == ".github/workflows/attest.yml"
          ' promotion-evidence/proof/fork-run.json > /dev/null
          jq -e '
            .id == 122919867168 and
            .name == "attest" and
            .conclusion == "failure" and
            any(.steps[];
              .name == "Run Parth2412/attest/action@1ea933184d1467c0716a5c23e9a1d005c1906567" and
              .conclusion == "failure"
            )
          ' promotion-evidence/proof/fork-job.json > /dev/null
          jq -e '
            .id == 122919867168 and
            .name == "attest" and
            .status == "completed" and
            .conclusion == "failure" and
            .app.id == 15368
          ' promotion-evidence/proof/fork-check.json > /dev/null

      - name: Verify retained Git refs and signed Bundles
        env:
          UV_HTTP_TIMEOUT: "60"
        shell: bash
        run: |
          set -euo pipefail
          proof_url="https://github.com/${PROOF_REPOSITORY}.git"
          fork_url="https://github.com/zettacore-labs/attest-action-proof.git"
          denied_ref="refs/attestations/${CHANGESET_DIGEST}"
          approved_ref="refs/attestations/${CHANGESET_DIGEST}-${APPROVED_REF_SUFFIX}"

          timeout 60s git ls-remote "${proof_url}" \
            refs/heads/main \
            "refs/pull/${PROOF_PR}/head" \
            'refs/attestations/*' \
            > promotion-evidence/proof/public-refs.txt
          test "$(wc -l < promotion-evidence/proof/public-refs.txt)" = "36"
          remote_oid() {
            awk -v ref="$1" '$2 == ref { print $1 }' \
              promotion-evidence/proof/public-refs.txt
          }
          test "$(remote_oid refs/heads/main)" = "${PROOF_MERGE_SHA}"
          test "$(remote_oid "refs/pull/${PROOF_PR}/head")" = "${PROOF_HEAD_SHA}"
          test "$(remote_oid "${denied_ref}")" = "${DENIED_REF_OID}"
          test "$(remote_oid "${denied_ref}^{}")" = "${DENIED_BLOB_OID}"
          test "$(remote_oid "${approved_ref}")" = "${APPROVED_REF_OID}"
          test "$(remote_oid "${approved_ref}^{}")" = "${APPROVED_BLOB_OID}"
          test "$(remote_oid refs/attestations/56dee5adb6bba1ea3e329501b3a3695e34f1488eb8c4db6ec235487e69000d3b)" \
            = "ca8577a29099b82e50acb0c2e240c732aadab0a0"
          test "$(remote_oid 'refs/attestations/56dee5adb6bba1ea3e329501b3a3695e34f1488eb8c4db6ec235487e69000d3b^{}')" \
            = "6763e966b9bc3f6fe6343a5d181d5bad4c332bfb"
          test "$(remote_oid refs/attestations/79abea6457325646125c043c7dfc146c57e26c6f3e93b16d5969c50533ab5b0d)" \
            = "eb27efc31f5602262bca1c2baec522ed0ac905f9"
          test "$(remote_oid 'refs/attestations/79abea6457325646125c043c7dfc146c57e26c6f3e93b16d5969c50533ab5b0d^{}')" \
            = "53511a62f4861127f16fb5069a71d4e7fb8caf4d"
          test "$(remote_oid refs/attestations/9b369576434dfecc2d65418479c997533f8926d5c64a58d144c338b3ceaadced)" \
            = "3255cc81ac31134db6a824f64c2af7a4993e1bbb"
          test "$(remote_oid 'refs/attestations/9b369576434dfecc2d65418479c997533f8926d5c64a58d144c338b3ceaadced^{}')" \
            = "399d03ede5be68af483d17708acb2775bd45f43f"
          test "$(remote_oid refs/attestations/9b369576434dfecc2d65418479c997533f8926d5c64a58d144c338b3ceaadced-3276565476)" \
            = "39c92021251ec69d41f008b096da8517419ba301"
          test "$(remote_oid 'refs/attestations/9b369576434dfecc2d65418479c997533f8926d5c64a58d144c338b3ceaadced-3276565476^{}')" \
            = "d60185c1065dd18a8c310fb6013a92ffd8199afb"
          test "$(remote_oid refs/attestations/c27c98ef9fccfb7d316e1554091693dc8f4fa238a2a8f2fabcb9c9b190aa58cb)" \
            = "964deaa54825940b3d07529ad5ca0a439c2ecc4f"
          test "$(remote_oid 'refs/attestations/c27c98ef9fccfb7d316e1554091693dc8f4fa238a2a8f2fabcb9c9b190aa58cb^{}')" \
            = "a88a0fbf0b1d8c4555504f8e6cc11921c3824d9b"
          test "$(remote_oid refs/attestations/7356fbb663dcf6edcd7f40aae67dd4dce34d4004f85037c0057bb62a22df0ac2)" \
            = "2f84619df782264724558446f320add54bf7850e"
