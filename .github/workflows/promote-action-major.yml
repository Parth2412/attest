name: promote Action major

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote-action-major-v1
  cancel-in-progress: false

env:
  ACTION_MAJOR_TAG: v1
  ACTION_VERSION_TAG: v1.0.3
  PRODUCT_TAG: v0.1.3
  CURRENT_MAJOR_SHA: a1c59cc67bf67aba22ffca876309f855ea8663af
  TARGET_RELEASE_SHA: 8dcfdaf4b16a0547222e3f174bc0c0e13e3549c8
  RELEASE_RUN_ID: 35991944542
  PROOF_REPOSITORY: Parth2412/attest-action-proof
  PROOF_PR: 4
  FORK_PROOF_PR: 5
  PROOF_BASE_SHA: f05ab8830df8605c9b23f54721a092dbd0f08068
  PROOF_HEAD_SHA: e61bbc34e5539d09302e9f9d60b62656ed7103d8
  PROOF_MERGE_SHA: 2e584273c7d096ea021dfcc839f712a3596d4657
  FORK_PROOF_SHA: a386c6f908a5d556be5588da9b9403e047624b51
  CHANGESET_DIGEST: 7356fbb663dcf6edcd7f40aae67dd4dce34d4004f85037c0057bb62a22df0ac2
  DENIED_REF_OID: 2f84619df782264724558446f320add54bf7850e
  DENIED_BLOB_OID: 155ce9bd68f5dc5fee12976322c7b653fcd0d8a0
  DENIED_BUNDLE_SHA256: e39d6cb916ca81bb5beaf07048e3f28c74b9142b5e34d9bc91d4aafc6d988533
  APPROVED_REF_SUFFIX: "2938073514"
  APPROVED_REF_OID: d35d3223fcfbb7e943afa2a56afb6bd2729d9a64
  APPROVED_BLOB_OID: 8bc2f89751c52382a628602b8e1ebfbb1856dcc1
  APPROVED_BUNDLE_SHA256: e60df59e1a27fbe7c42b4d7ad484acadbbd8a0ff96937faeb9a371d7d7bde843

jobs:
  preflight:
    if: github.repository == 'Parth2412/attest' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with: { version: "0.11.2", python-version: "3.12", enable-cache: false }
      - name: Validate the immutable source release and controls
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_SHA}" = "$(git rev-parse HEAD)"
          test "$(git branch --show-current)" = "main"
          git merge-base --is-ancestor "${TARGET_RELEASE_SHA}" "${GITHUB_SHA}"
          uv lock --check

          mkdir -p promotion-evidence/source promotion-evidence/proof
          timeout 60s gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&per_page=100" \
            > promotion-evidence/source/main-ci-runs.json
          jq -e --arg sha "${GITHUB_SHA}" \
            'any(.workflow_runs[]; .head_sha == $sha and .conclusion == "success")' \
            promotion-evidence/source/main-ci-runs.json > /dev/null

          timeout 60s gh api \
            "repos/${GITHUB_REPOSITORY}/environments/action-major" \
            > promotion-evidence/source/action-major-environment.json
          jq -e --arg owner "${GITHUB_REPOSITORY_OWNER}" '
            .name == "action-major" and
            .can_admins_bypass == false and
            .deployment_branch_policy.protected_branches == true and
            .deployment_branch_policy.custom_branch_policies == false and
            ([.protection_rules[] | select(.type == "required_reviewers")] | length) == 1 and
            ([
              .protection_rules[] |
              select(.type == "required_reviewers") |
              .prevent_self_review
            ] == [false]) and
            ([
              .protection_rules[] |
              select(.type == "required_reviewers") |
              .reviewers[] |
              {type, login: .reviewer.login}
            ] == [{type: "User", login: $owner}])
          ' promotion-evidence/source/action-major-environment.json > /dev/null

          timeout 60s gh api "repos/${GITHUB_REPOSITORY}/rulesets" \
            > promotion-evidence/source/rulesets.json
          ruleset_id="$(jq -er '
            .[] |
            select(
              .name == "Protect immutable release tags" and
              .target == "tag" and
              .enforcement == "active"
            ) |
            .id
          ' promotion-evidence/source/rulesets.json)"
          timeout 60s gh api "repos/${GITHUB_REPOSITORY}/rulesets/${ruleset_id}" \
            > promotion-evidence/source/tag-ruleset.json
          jq -e '
            (.bypass_actors // []) == [] and
            (.conditions.ref_name.include | sort) ==
              ([
                "refs/tags/v0.1.0",
                "refs/tags/v0.1.1",
                "refs/tags/v0.1.2",
                "refs/tags/v0.1.3",
                "refs/tags/v1.0.0",
                "refs/tags/v1.0.1",
                "refs/tags/v1.0.2",
                "refs/tags/v1.0.3"
              ] | sort) and
            .conditions.ref_name.exclude == [] and
            ([.rules[].type] | sort) == (["deletion", "update"] | sort)
          ' promotion-evidence/source/tag-ruleset.json > /dev/null

          for tag in \
            v0.1.0 v1.0.0 v1 \
            v0.1.1 v1.0.1 \
            v0.1.2 v1.0.2 \
            "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"
          do
            timeout 60s gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              > "promotion-evidence/source/tag-${tag}.json"
          done
          for tag in v0.1.0 v1.0.0 v1; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "${CURRENT_MAJOR_SHA}"
          done
          for tag in v0.1.1 v1.0.1; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "9aa18c1d5af6659c4dbc79443dfda93208395dff"
          done
          for tag in v0.1.2 v1.0.2; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "60951624b5572aa1f54db9c2693cb7a8e0399425"
          done
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            test "$(jq -r .object.sha "promotion-evidence/source/tag-${tag}.json")" \
              = "${TARGET_RELEASE_SHA}"
          done

          timeout 60s gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${PRODUCT_TAG}" \
            > promotion-evidence/source/release.json
          jq -e --arg tag "${PRODUCT_TAG}" --arg sha "${TARGET_RELEASE_SHA}" '
            .tag_name == $tag and
            .target_commitish == $sha and
            .draft == false and
            .prerelease == false and
            .immutable == true
          ' promotion-evidence/source/release.json > /dev/null

          timeout 60s gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/attempts/2" \
            > promotion-evidence/source/release-run.json
          jq -e --arg sha "${TARGET_RELEASE_SHA}" '
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .run_attempt == 2 and
            .head_branch == "main" and
            .head_sha == $sha and
            .path == ".github/workflows/release.yml"
          ' promotion-evidence/source/release-run.json > /dev/null

          git show "${TARGET_RELEASE_SHA}:action/action.yml" \
            > promotion-evidence/source/action.yml
          observed_image="$(awk '
            /^  image: docker:\/\// {
              sub(/^  image: docker:\/\//, "")
              print
            }
          ' promotion-evidence/source/action.yml)"
          test "${observed_image}" = "ghcr.io/parth2412/attest@sha256:d5a370bff96f3dbe8eca341701060b73b915d9bade981e24a835f62362d2e2e1"

      - name: Validate public proof metadata
        shell: bash
        run: |
          set -euo pipefail
          public_api() {
            endpoint="$1"
            output="$2"
            curl --fail --silent --show-error \
              --retry 4 --retry-all-errors --connect-timeout 10 --max-time 60 \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --user-agent 'attest-action-major-promotion' \
              "https://api.github.com/repos/${PROOF_REPOSITORY}/${endpoint}" \
              > "promotion-evidence/proof/${output}"
          }

          public_api "pulls/${PROOF_PR}" proof-pr.json
          public_api "pulls/${PROOF_PR}/reviews" proof-reviews.json
          public_api "actions/runs/35996154567" proof-run.json
          public_api "actions/runs/35996154567/attempts/2/jobs" denied-jobs.json
          public_api "actions/runs/35996154567/attempts/3/jobs" approved-jobs.json
          public_api "actions/jobs/107621975743" denied-job.json
          public_api "actions/jobs/107627293997" approved-job.json
          public_api "check-runs/107621975743" denied-check.json
          public_api "check-runs/107627293997" approved-check.json
          public_api "actions/runs/35996139827" blocked-run.json
          public_api "actions/runs/35996139827/artifacts" blocked-artifacts.json
          public_api "pulls/${FORK_PROOF_PR}" fork-pr.json
          public_api "issues/${FORK_PROOF_PR}/comments" fork-comments.json
          public_api "actions/runs/35998481445" fork-run.json
          public_api "actions/jobs/107629036816" fork-job.json
          public_api "check-runs/107629036816" fork-check.json

          jq -e \
            --arg base "${PROOF_BASE_SHA}" \
            --arg head "${PROOF_HEAD_SHA}" \
            --arg merge "${PROOF_MERGE_SHA}" \
            --arg repository "${PROOF_REPOSITORY}" '
              .state == "closed" and
              .merged == true and
              .draft == false and
              .user.id == 41898282 and
              .base.sha == $base and
              .head.sha == $head and
              .base.repo.full_name == $repository and
              .head.repo.full_name == $repository and
              .merge_commit_sha == $merge and
              .merged_by.id == 23364077 and
              .commits == 3 and
              .changed_files == 4
            ' promotion-evidence/proof/proof-pr.json > /dev/null
          jq -e --arg head "${PROOF_HEAD_SHA}" '
            length == 1 and
            .[0].state == "APPROVED" and
            .[0].user.id == 23364077 and
            .[0].commit_id == $head and
            .[0].submitted_at == "2026-09-24T12:15:18Z"
          ' promotion-evidence/proof/proof-reviews.json > /dev/null
          jq -e --arg head "${PROOF_HEAD_SHA}" '
            .id == 35996154567 and
            .event == "pull_request" and
            .status == "completed" and
            .conclusion == "success" and
            .run_attempt == 3 and
            .head_sha == $head and
            .head_repository.full_name == "Parth2412/attest-action-proof" and
            .path == ".github/workflows/attest.yml"
          ' promotion-evidence/proof/proof-run.json > /dev/null
          jq -e '
            (.jobs | length) == 1 and
            .jobs[0].id == 107621975743 and
            .jobs[0].name == "attest" and
            .jobs[0].conclusion == "failure"
          ' promotion-evidence/proof/denied-jobs.json > /dev/null
          jq -e '
            (.jobs | length) == 1 and
            .jobs[0].id == 107627293997 and
            .jobs[0].name == "attest" and
            .jobs[0].conclusion == "success"
          ' promotion-evidence/proof/approved-jobs.json > /dev/null

          jq -e '
            .id == 107621975743 and
            .name == "attest" and
            .conclusion == "failure" and
            any(.steps[];
              .name == "Run Parth2412/attest/action@8dcfdaf4b16a0547222e3f174bc0c0e13e3549c8" and
              .conclusion == "failure"
            )
          ' promotion-evidence/proof/denied-job.json > /dev/null
          jq -e '
            .id == 107627293997 and
            .name == "attest" and
            .conclusion == "success" and
            any(.steps[];
              .name == "Run Parth2412/attest/action@8dcfdaf4b16a0547222e3f174bc0c0e13e3549c8" and
              .conclusion == "success"
            )
          ' promotion-evidence/proof/approved-job.json > /dev/null
          jq -e '
            .id == 107621975743 and
            .name == "attest" and
            .status == "completed" and
            .conclusion == "failure" and
            .app.id == 15368
          ' promotion-evidence/proof/denied-check.json > /dev/null
          jq -e '
            .id == 107627293997 and
            .name == "attest" and
            .status == "completed" and
            .conclusion == "success" and
            .app.id == 15368
          ' promotion-evidence/proof/approved-check.json > /dev/null

          jq -e '
            .id == 35996139827 and
            .event == "workflow_dispatch" and
            .status == "completed" and
            .conclusion == "success" and
            .run_attempt == 1 and
            .head_sha == "beb92d01213b58c67e59549b53fb1b390d53e750" and
            .path == ".github/workflows/open-proof-pr.yml"
          ' promotion-evidence/proof/blocked-run.json > /dev/null
          jq -e '
            .total_count == 1 and
            (.artifacts | length) == 1 and
            .artifacts[0].id == 10806770017 and
            .artifacts[0].name == "blocked-before-check-evidence-35996139827" and
            .artifacts[0].expired == false and
            .artifacts[0].size_in_bytes == 2948
          ' promotion-evidence/proof/blocked-artifacts.json > /dev/null

          jq -e --arg base "${PROOF_MERGE_SHA}" --arg head "${FORK_PROOF_SHA}" '
            .state == "closed" and
            .merged == false and
            .draft == false and
            .user.id == 23364077 and
            .base.sha == $base and
            .head.sha == $head and
            .base.repo.full_name == "Parth2412/attest-action-proof" and
            .head.repo.full_name == "zettacore-labs/attest-action-proof"
          ' promotion-evidence/proof/fork-pr.json > /dev/null
          jq -e '
            length == 1 and
            .[0].user.id == 23364077 and
            .[0].author_association == "OWNER" and
            (. [0].body | contains("ERR-SIGN-301")) and
            (. [0].body | contains("before reading the deliberately invalid")) and
            (. [0].body | contains("no OIDC request variables")) and
            (. [0].body | contains("no elevated event"))
          ' promotion-evidence/proof/fork-comments.json > /dev/null
          jq -e --arg head "${FORK_PROOF_SHA}" '
            .id == 35998481445 and
            .event == "pull_request" and
            .status == "completed" and
            .conclusion == "failure" and
            .run_attempt == 1 and
            .head_sha == $head and
            .head_repository.full_name == "zettacore-labs/attest-action-proof" and
            .path == ".github/workflows/attest.yml"
          ' promotion-evidence/proof/fork-run.json > /dev/null
          jq -e '
            .id == 107629036816 and
            .name == "attest" and
            .conclusion == "failure" and
            any(.steps[];
              .name == "Run Parth2412/attest/action@8dcfdaf4b16a0547222e3f174bc0c0e13e3549c8" and
              .conclusion == "failure"
            )
          ' promotion-evidence/proof/fork-job.json > /dev/null
          jq -e '
            .id == 107629036816 and
            .name == "attest" and
            .status == "completed" and
            .conclusion == "failure" and
            .app.id == 15368
          ' promotion-evidence/proof/fork-check.json > /dev/null

      - name: Verify retained Git refs and signed Bundles
        env:
          UV_HTTP_TIMEOUT: "60"
        shell: bash
        run: |
          set -euo pipefail
          proof_url="https://github.com/${PROOF_REPOSITORY}.git"
          fork_url="https://github.com/zettacore-labs/attest-action-proof.git"
          denied_ref="refs/attestations/${CHANGESET_DIGEST}"
          approved_ref="refs/attestations/${CHANGESET_DIGEST}-${APPROVED_REF_SUFFIX}"

          timeout 60s git ls-remote "${proof_url}" \
            refs/heads/main \
            "refs/pull/${PROOF_PR}/head" \
            'refs/attestations/*' \
            > promotion-evidence/proof/public-refs.txt
          test "$(wc -l < promotion-evidence/proof/public-refs.txt)" = "10"
          remote_oid() {
            awk -v ref="$1" '$2 == ref { print $1 }' \
              promotion-evidence/proof/public-refs.txt
          }
          test "$(remote_oid refs/heads/main)" = "${PROOF_MERGE_SHA}"
          test "$(remote_oid "refs/pull/${PROOF_PR}/head")" = "${PROOF_HEAD_SHA}"
          test "$(remote_oid "${denied_ref}")" = "${DENIED_REF_OID}"
          test "$(remote_oid "${denied_ref}^{}")" = "${DENIED_BLOB_OID}"
          test "$(remote_oid "${approved_ref}")" = "${APPROVED_REF_OID}"
          test "$(remote_oid "${approved_ref}^{}")" = "${APPROVED_BLOB_OID}"
          test "$(remote_oid refs/attestations/79abea6457325646125c043c7dfc146c57e26c6f3e93b16d5969c50533ab5b0d)" \
            = "eb27efc31f5602262bca1c2baec522ed0ac905f9"
          test "$(remote_oid 'refs/attestations/79abea6457325646125c043c7dfc146c57e26c6f3e93b16d5969c50533ab5b0d^{}')" \
            = "53511a62f4861127f16fb5069a71d4e7fb8caf4d"
          test "$(remote_oid refs/attestations/c27c98ef9fccfb7d316e1554091693dc8f4fa238a2a8f2fabcb9c9b190aa58cb)" \
            = "964deaa54825940b3d07529ad5ca0a439c2ecc4f"
          test "$(remote_oid 'refs/attestations/c27c98ef9fccfb7d316e1554091693dc8f4fa238a2a8f2fabcb9c9b190aa58cb^{}')" \
            = "a88a0fbf0b1d8c4555504f8e6cc11921c3824d9b"

          timeout 60s git ls-remote "${fork_url}" \
            refs/heads/proof/fork-oidc-denial-v0.1.3 \
            > promotion-evidence/proof/fork-ref.txt
          test "$(awk '{ print $1 }' promotion-evidence/proof/fork-ref.txt)" \
            = "${FORK_PROOF_SHA}"

          timeout 120s git clone --quiet --no-checkout "${proof_url}" proof
          timeout 120s git -C proof fetch --quiet origin \
            "+refs/pull/${PROOF_PR}/head:refs/remotes/origin/proof-pr-${PROOF_PR}" \
            "+${denied_ref}:${denied_ref}" \
            "+${approved_ref}:${approved_ref}"
          git -C proof remote add fork "${fork_url}"
          timeout 120s git -C proof fetch --quiet fork \
            "+refs/heads/proof/fork-oidc-denial-v0.1.3:refs/remotes/fork/proof-fork"

          test "$(git -C proof rev-parse origin/main)" = "${PROOF_MERGE_SHA}"
          test "$(git -C proof rev-parse refs/remotes/origin/proof-pr-${PROOF_PR})" \
            = "${PROOF_HEAD_SHA}"
          test "$(git -C proof rev-parse refs/remotes/fork/proof-fork)" \
            = "${FORK_PROOF_SHA}"
          test "$(git -C proof rev-parse "${PROOF_HEAD_SHA}^{tree}")" \
            = "$(git -C proof rev-parse "${PROOF_MERGE_SHA}^{tree}")"

          git -C proof show \
            beb92d01213b58c67e59549b53fb1b390d53e750:.github/workflows/open-proof-pr.yml \
            > promotion-evidence/proof/open-proof-pr.yml
          grep -F 'test "$(jq '\''[.check_runs[] | select(.name == "attest")] | length'\''' \
            promotion-evidence/proof/open-proof-pr.yml > /dev/null
          grep -F 'test "${state}" = BLOCKED' \
            promotion-evidence/proof/open-proof-pr.yml > /dev/null

          git -C proof show "${PROOF_HEAD_SHA}:.github/workflows/attest.yml" \
            > promotion-evidence/proof/proof-workflow.yml
          git -C proof show "${FORK_PROOF_SHA}:.github/workflows/attest.yml" \
            > promotion-evidence/proof/fork-workflow.yml
          cmp promotion-evidence/proof/proof-workflow.yml \
            promotion-evidence/proof/fork-workflow.yml
          grep -F 'uses: Parth2412/attest/action@8dcfdaf4b16a0547222e3f174bc0c0e13e3549c8' \
            promotion-evidence/proof/proof-workflow.yml > /dev/null
          if grep -F 'pull_request_target' promotion-evidence/proof/proof-workflow.yml > /dev/null; then
            echo "promotion proof: elevated pull request event is forbidden" >&2
            exit 1
          fi

          git -C proof show "${PROOF_HEAD_SHA}:sitecustomize.py" \
            > promotion-evidence/proof/sitecustomize.py
          test "$(sha256sum promotion-evidence/proof/sitecustomize.py | cut -d ' ' -f 1)" \
            = "352e1c5c6a289a7ee9beccc8ca52ae003658b78176d04c094fa971dd00fd6895"
          git -C proof show "${FORK_PROOF_SHA}:.attest/policy.yaml" \
            > promotion-evidence/proof/fork-policy.yaml
          grep -Fx 'version: [' promotion-evidence/proof/fork-policy.yaml > /dev/null

          test "$(git -C proof cat-file -t "${DENIED_REF_OID}")" = "tag"
          test "$(git -C proof rev-parse "${DENIED_REF_OID}^{}")" = "${DENIED_BLOB_OID}"
          test "$(git -C proof cat-file -t "${APPROVED_REF_OID}")" = "tag"
          test "$(git -C proof rev-parse "${APPROVED_REF_OID}^{}")" \
            = "${APPROVED_BLOB_OID}"
          git -C proof cat-file -p "${DENIED_REF_OID}" \
            > promotion-evidence/proof/denied-tag.txt
          git -C proof cat-file -p "${APPROVED_REF_OID}" \
            > promotion-evidence/proof/approved-tag.txt
          git -C proof cat-file -p "${DENIED_BLOB_OID}" \
            > promotion-evidence/proof/denied-bundle.sigstore.json
          git -C proof cat-file -p "${APPROVED_BLOB_OID}" \
            > promotion-evidence/proof/approved-bundle.sigstore.json
          test "$(sha256sum promotion-evidence/proof/denied-bundle.sigstore.json | cut -d ' ' -f 1)" \
            = "${DENIED_BUNDLE_SHA256}"
          test "$(sha256sum promotion-evidence/proof/approved-bundle.sigstore.json | cut -d ' ' -f 1)" \
            = "${APPROVED_BUNDLE_SHA256}"

          git -C proof worktree add --quiet --detach ../proof-checkout "${PROOF_HEAD_SHA}"
          timeout 60s uv venv --quiet --python 3.12 proof-venv
          timeout 180s uv pip install --quiet --python proof-venv/bin/python \
            "attest-cli==0.1.3"
          proof-venv/bin/attest --version \
            > promotion-evidence/proof/attest-version.txt
          test "$(cat promotion-evidence/proof/attest-version.txt)" = "attest 0.1.3"
          uv pip freeze --python proof-venv/bin/python \
            > promotion-evidence/proof/installed-packages.txt

          identity="https://github.com/Parth2412/attest-action-proof/.github/workflows/attest.yml@refs/pull/4/merge"
          proof_root="${GITHUB_WORKSPACE}/proof-checkout"
          cli="${GITHUB_WORKSPACE}/proof-venv/bin/attest"
          denied_bundle="${GITHUB_WORKSPACE}/promotion-evidence/proof/denied-bundle.sigstore.json"
          approved_bundle="${GITHUB_WORKSPACE}/promotion-evidence/proof/approved-bundle.sigstore.json"
          cd "${proof_root}"
          timeout 120s "${cli}" verify \
            --input "${denied_bundle}" \
            --repository . \
            --base "${PROOF_BASE_SHA}" \
            --head "${PROOF_HEAD_SHA}" \
            --config .attest/config.yaml \
            --json \
            > "${GITHUB_WORKSPACE}/promotion-evidence/proof/denied-verify.json"
          set +e
          timeout 120s "${cli}" gate \
            --input "${denied_bundle}" \
            --repository . \
            --base "${PROOF_BASE_SHA}" \
            --head "${PROOF_HEAD_SHA}" \
            --target-branch main \
            --config .attest/config.yaml \
            --policy .attest/policy.yaml \
            --json \
            > "${GITHUB_WORKSPACE}/promotion-evidence/proof/denied-gate.json"
          denied_exit="$?"
          set -e
          test "${denied_exit}" = "3"

          timeout 120s "${cli}" verify \
            --input "${approved_bundle}" \
            --repository . \
            --base "${PROOF_BASE_SHA}" \
            --head "${PROOF_HEAD_SHA}" \
            --config .attest/config.yaml \
            --json \
            > "${GITHUB_WORKSPACE}/promotion-evidence/proof/approved-verify.json"
          timeout 120s "${cli}" gate \
            --input "${approved_bundle}" \
            --repository . \
            --base "${PROOF_BASE_SHA}" \
            --head "${PROOF_HEAD_SHA}" \
            --target-branch main \
            --config .attest/config.yaml \
            --policy .attest/policy.yaml \
            --json \
            > "${GITHUB_WORKSPACE}/promotion-evidence/proof/approved-gate.json"

          cd "${GITHUB_WORKSPACE}"
          for report in denied-verify approved-verify; do
            jq -e --arg digest "${CHANGESET_DIGEST}" --arg identity "${identity}" '
              .outcome == "success" and
              .exitCode == 0 and
              .data.verification.status == "verified" and
              .data.verification.transparencyLogVerified == true and
              .data.verification.verifiedIdentity == $identity and
              .data.verification.verifiedIssuer == "https://token.actions.githubusercontent.com" and
              .data.verification.statement.subject == [
                {name: "changeset", digest: {sha256: $digest}}
              ]
            ' "promotion-evidence/proof/${report}.json" > /dev/null
          done
          jq -e --arg digest "${CHANGESET_DIGEST}" '
            .outcome == "denied" and
            .exitCode == 3 and
            .data.verification.status == "verified" and
            .data.verification.statement.predicate.changeSet.digest == $digest and
            .data.verification.statement.predicate.review.state == "none" and
            .data.verification.statement.predicate.review.humanApprovals == 0 and
            .data.verification.statement.predicate.collection.environment.runId == "35996154567" and
            .data.verification.statement.predicate.collection.environment.runAttempt == 2 and
            .data.decision.outcome == "deny" and
            .data.decision.exitCode == 3
          ' promotion-evidence/proof/denied-gate.json > /dev/null
          jq -e --arg digest "${CHANGESET_DIGEST}" '
            .outcome == "success" and
            .exitCode == 0 and
            .data.verification.status == "verified" and
            .data.verification.statement.predicate.changeSet.digest == $digest and
            .data.verification.statement.predicate.review.state == "approved" and
            .data.verification.statement.predicate.review.humanApprovals == 1 and
            .data.verification.statement.predicate.review.reviewers == [{
              identity: "github:23364077:Parth2412",
              identityProvider: "github",
              verdict: "approved",
              submittedAt: "2026-09-24T12:15:18Z",
              effective: true,
              isChangeAuthor: false,
              evidence: {
                kind: "forge-api",
                digest: "4e85879108f81ac96e510ba7ae16b8059293fc7efb45380d6c0574866836635b"
              }
            }] and
            .data.verification.statement.predicate.collection.environment.runId == "35996154567" and
            .data.verification.statement.predicate.collection.environment.runAttempt == 3 and
            any(.data.verification.statement.predicate.checks[];
              .name == "attest" and
              .conclusion == "failure" and
              .runId == "107621975743"
            ) and
            .data.decision.outcome == "allow" and
            .data.decision.exitCode == 0
          ' promotion-evidence/proof/approved-gate.json > /dev/null

          jq -n \
            --arg releaseSha "${TARGET_RELEASE_SHA}" \
            --arg proofBase "${PROOF_BASE_SHA}" \
            --arg proofHead "${PROOF_HEAD_SHA}" \
            --arg proofMerge "${PROOF_MERGE_SHA}" \
            --arg forkHead "${FORK_PROOF_SHA}" \
            --arg digest "${CHANGESET_DIGEST}" \
            --arg deniedBundleSha256 "${DENIED_BUNDLE_SHA256}" \
            --arg approvedBundleSha256 "${APPROVED_BUNDLE_SHA256}" \
            '{
              schemaVersion: 1,
              releaseCommit: $releaseSha,
              proofPullRequest: 4,
              proofBase: $proofBase,
              proofHead: $proofHead,
              proofMerge: $proofMerge,
              forkProofPullRequest: 5,
              forkHead: $forkHead,
              changeSetDigest: $digest,
              deniedBundleSha256: $deniedBundleSha256,
              approvedBundleSha256: $approvedBundleSha256,
              deniedDecision: "deny",
              approvedDecision: "allow"
            }' > promotion-evidence/proof/index.json

      - name: Retain preflight promotion evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-major-preflight-v1.0.3-${{ github.run_id }}
          path: promotion-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90

  promote:
    needs: preflight
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: action-major
      url: https://github.com/Parth2412/attest/releases/tag/v0.1.3
    permissions:
      actions: read
      contents: write
    steps:
      - name: Recover validated preflight evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: action-major-preflight-v1.0.3-${{ github.run_id }}
          path: promotion-evidence
      - name: Revalidate and move the Action major tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p promotion-evidence/final
          test -f promotion-evidence/proof/index.json
          test -f promotion-evidence/proof/denied-gate.json
          test -f promotion-evidence/proof/approved-gate.json

          read_tag() {
            tag="$1"
            timeout 60s gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" \
              > "promotion-evidence/final/tag-${tag}.json"
            jq -r .object.sha "promotion-evidence/final/tag-${tag}.json"
          }

          before="$(read_tag "${ACTION_MAJOR_TAG}")"
          test "${before}" = "${CURRENT_MAJOR_SHA}"
          for tag in v0.1.0 v1.0.0; do
            test "$(read_tag "${tag}")" = "${CURRENT_MAJOR_SHA}"
          done
          for tag in v0.1.1 v1.0.1; do
            test "$(read_tag "${tag}")" \
              = "9aa18c1d5af6659c4dbc79443dfda93208395dff"
          done
          for tag in v0.1.2 v1.0.2; do
            test "$(read_tag "${tag}")" \
              = "60951624b5572aa1f54db9c2693cb7a8e0399425"
          done
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            test "$(read_tag "${tag}")" = "${TARGET_RELEASE_SHA}"
          done

          timeout 60s gh api \
            --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${ACTION_MAJOR_TAG}" \
            --field sha="${TARGET_RELEASE_SHA}" \
            --field force=true \
            > promotion-evidence/final/tag-update-response.json

          after="$(read_tag "${ACTION_MAJOR_TAG}")"
          test "${after}" = "${TARGET_RELEASE_SHA}"
          for tag in v0.1.0 v1.0.0; do
            test "$(read_tag "${tag}")" = "${CURRENT_MAJOR_SHA}"
          done
          for tag in v0.1.1 v1.0.1; do
            test "$(read_tag "${tag}")" \
              = "9aa18c1d5af6659c4dbc79443dfda93208395dff"
          done
          for tag in v0.1.2 v1.0.2; do
            test "$(read_tag "${tag}")" \
              = "60951624b5572aa1f54db9c2693cb7a8e0399425"
          done
          for tag in "${PRODUCT_TAG}" "${ACTION_VERSION_TAG}"; do
            test "$(read_tag "${tag}")" = "${TARGET_RELEASE_SHA}"
          done

          jq -n \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg actor "${GITHUB_ACTOR}" \
            --arg tag "${ACTION_MAJOR_TAG}" \
            --arg before "${before}" \
            --arg after "${after}" \
            --arg immutableActionTag "${ACTION_VERSION_TAG}" \
            --arg immutableProductTag "${PRODUCT_TAG}" \
            '{
              schemaVersion: 1,
              repository: $repository,
              workflowRunId: $runId,
              workflowRunAttempt: $runAttempt,
              actor: $actor,
              environment: "action-major",
              tag: $tag,
              before: $before,
              after: $after,
              immutableActionTag: $immutableActionTag,
              immutableProductTag: $immutableProductTag,
              reviewed: true
            }' > promotion-evidence/final/promotion-result.json

          {
            echo '## Action major promotion complete'
            echo
            echo "- \`${ACTION_MAJOR_TAG}\`: \`${before}\` → \`${after}\`"
            echo "- Immutable Action tag: \`${ACTION_VERSION_TAG}\`"
            echo "- Immutable product release: \`${PRODUCT_TAG}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - name: Retain final promotion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: action-major-promotion-v1.0.3-${{ github.run_id }}
          path: promotion-evidence
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 90
