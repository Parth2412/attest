          test "$(remote_oid refs/attestations/fff2a2fb95c00780d2ea40341195a369fa72c084aa4a2dd7c9539ae2ae9c1c44)" \
            = "82556c69b09fea969b9bd5a2706a199ba8a56642"
          test "$(remote_oid 'refs/attestations/fff2a2fb95c00780d2ea40341195a369fa72c084aa4a2dd7c9539ae2ae9c1c44^{}')" \
            = "31e7867da77993fd45252e4d04ec8deec34e5171"
