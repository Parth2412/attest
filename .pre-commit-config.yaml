repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy strict
        entry: uv run python scripts/run_mypy.py
        language: system
        pass_filenames: false
        types: [python]
      - id: import-linter
        name: import boundaries
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      - id: banned-language
        name: banned language check
        entry: uv run python scripts/check_banned_language.py
        language: system
        pass_filenames: false
