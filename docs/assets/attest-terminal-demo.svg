<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Attest terminal demo</title>
  <desc id="desc">A terminal session types Attest gate commands, denies an unreviewed ChangeSet, records an independent approval, and allows the same ChangeSet.</desc>
  <style>
    text { font-family: "Cascadia Mono", "Ubuntu Mono", "DejaVu Sans Mono", Consolas, monospace; font-size: 17px; }
    .prompt { fill: #63e68b; font-weight: 700; }
    .path { fill: #68a9ff; font-weight: 700; }
    .white { fill: #e7e7e7; }
    .green { fill: #63e68b; }
    .red { fill: #ff6b78; }
    .cyan { fill: #61dafb; }
    .amber { fill: #ffd166; }
    .muted { fill: #909090; }
    .strong { font-weight: 800; }
    .typed-1 { clip-path: inset(0 100% 0 0); animation: type1 15s steps(58, end) infinite; }
    .typed-2 { clip-path: inset(0 100% 0 0); animation: type2 15s steps(27, end) infinite; }
    .typed-3 { clip-path: inset(0 100% 0 0); animation: type3 15s steps(57, end) infinite; }
    .s1 { opacity: 0; animation: show1 15s step-end infinite; }
    .s2 { opacity: 0; animation: show2 15s step-end infinite; }
    .s3 { opacity: 0; animation: show3 15s step-end infinite; }
    .s4 { opacity: 0; animation: show4 15s step-end infinite; }
    .s5 { opacity: 0; animation: show5 15s step-end infinite; }
    .s6 { opacity: 0; animation: show6 15s step-end infinite; }
    .s7 { opacity: 0; animation: show7 15s step-end infinite; }
    .s8 { opacity: 0; animation: show8 15s step-end infinite; }
    .s9 { opacity: 0; animation: show9 15s step-end infinite; }
    .s10 { opacity: 0; animation: show10 15s step-end infinite; }
    .s11 { opacity: 0; animation: show11 15s step-end infinite; }
    .s12 { opacity: 0; animation: show12 15s step-end infinite; }
    .s13 { opacity: 0; animation: show13 15s step-end infinite; }
    .cursor { fill: #e7e7e7; animation: blink 1s step-end infinite; }
    @keyframes type1 { 0% { clip-path: inset(0 100% 0 0); } 15%, 99.9% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes type2 { 0%, 38% { clip-path: inset(0 100% 0 0); } 49%, 99.9% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes type3 { 0%, 57% { clip-path: inset(0 100% 0 0); } 72%, 99.9% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes show1 { 0%, 17% { opacity: 0; } 18%, 99.9% { opacity: 1; } }
    @keyframes show2 { 0%, 20% { opacity: 0; } 21%, 99.9% { opacity: 1; } }
    @keyframes show3 { 0%, 23% { opacity: 0; } 24%, 99.9% { opacity: 1; } }
    @keyframes show4 { 0%, 26% { opacity: 0; } 27%, 99.9% { opacity: 1; } }
    @keyframes show5 { 0%, 50% { opacity: 0; } 51%, 99.9% { opacity: 1; } }
    @keyframes show6 { 0%, 53% { opacity: 0; } 54%, 99.9% { opacity: 1; } }
    @keyframes show7 { 0%, 74% { opacity: 0; } 75%, 99.9% { opacity: 1; } }
    @keyframes show8 { 0%, 77% { opacity: 0; } 78%, 99.9% { opacity: 1; } }
    @keyframes show9 { 0%, 80% { opacity: 0; } 81%, 99.9% { opacity: 1; } }
    @keyframes show10 { 0%, 83% { opacity: 0; } 84%, 99.9% { opacity: 1; } }
    @keyframes show11 { 0%, 86% { opacity: 0; } 87%, 99.9% { opacity: 1; } }
    @keyframes show12 { 0%, 89% { opacity: 0; } 90%, 99.9% { opacity: 1; } }
    @keyframes show13 { 0%, 93% { opacity: 0; } 94%, 99.9% { opacity: 1; } }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .12; } }
  </style>

  <rect width="1200" height="675" fill="#000"/>
  <rect x="22" y="20" width="1156" height="635" rx="8" fill="#050505" stroke="#343434"/>
  <path d="M30 20h1140a8 8 0 0 1 8 8v38H22V28a8 8 0 0 1 8-8z" fill="#1d1d1d"/>
  <line x1="22" y1="66" x2="1178" y2="66" stroke="#303030"/>
  <text x="40" y="49" class="amber">◆</text>
  <text x="60" y="49" fill="#d6d6d6" font-size="15">vulcan@attest: ~/attest</text>
  <text x="1090" y="49" fill="#8a8a8a" font-size="15">—  □  ×</text>

  <g transform="translate(46 96)">
    <text y="0"><tspan class="prompt">vulcan@attest</tspan><tspan class="white">:</tspan><tspan class="path">~/attest</tspan><tspan class="white">$ </tspan><tspan class="white typed-1">attest gate --input before-review.bundle.json $GATE_ARGS</tspan></text>
    <text y="30" class="green s1">✓ policy evaluation complete</text>
    <text y="60" class="green s2">✓ signature + workflow identity verified</text>
    <text y="90" class="red s3">✗ human approvals 0 / 1</text>
    <text y="120" class="red strong s4">decision DENY</text>
    <text y="150" class="red s4">exit status 3</text>

    <text y="205"><tspan class="prompt">vulcan@attest</tspan><tspan class="white">:</tspan><tspan class="path">~/attest</tspan><tspan class="white">$ </tspan><tspan class="white typed-2">gh pr review 13 --approve</tspan></text>
    <text y="235" class="green s5">✓ independent review submitted APPROVED</text>
    <text y="265" class="cyan s6">reviewer.isChangeAuthor false</text>

    <text y="320"><tspan class="prompt">vulcan@attest</tspan><tspan class="white">:</tspan><tspan class="path">~/attest</tspan><tspan class="white">$ </tspan><tspan class="white typed-3">attest gate --input after-review.bundle.json $GATE_ARGS</tspan></text>
    <text y="350" class="green s7">✓ policy evaluation complete</text>
    <text y="380" class="cyan s8">✓ same ChangeSet 13a9767a…c09e3987</text>
    <text y="410" class="green s9">✓ human approvals 1 / 1</text>
    <text y="440" class="green s10">✓ reviewer is not change author satisfied</text>
    <text y="470" class="green strong s11">decision ALLOW</text>
    <text y="500" class="green s12">exit status 0</text>
    <text y="530" class="s13"><tspan class="prompt">vulcan@attest</tspan><tspan class="white">:</tspan><tspan class="path">~/attest</tspan><tspan class="white">$</tspan></text>
    <rect x="207" y="512" width="10" height="21" class="cursor s13"/>
  </g>
</svg>
