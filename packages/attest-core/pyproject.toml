[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attest-core"
version = "0.1.0"
description = "attest core domain model, canonicalisation, and CSD-1 digest"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Parth (ZettaCore)" }]
keywords = ["ai", "attestation", "provenance", "sigstore", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "pydantic==2.13.5",
  "rfc8785==0.1.4",
  "jsonschema==4.26.0",
]

[project.urls]
Homepage = "https://github.com/Parth2412/attest"
Documentation = "https://github.com/Parth2412/attest/tree/main/docs"
Repository = "https://github.com/Parth2412/attest.git"
Issues = "https://github.com/Parth2412/attest/issues"
Changelog = "https://github.com/Parth2412/attest/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/attest_core"]

[tool.mutmut]
source_paths = ["src/attest_core"]
only_mutate = ["src/attest_core/canonical.py", "src/attest_core/digest.py"]
on_dependency_change = "rerun"
pytest_add_cli_args_test_selection = [
  "tests/test_canonical.py",
  "tests/test_digest.py",
  "tests/test_path.py",
  "tests/test_properties.py",
]
