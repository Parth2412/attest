[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attest-sign"
version = "0.1.0"
description = "attest Sigstore signing and verification adapters"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "attest-core",
  "sigstore==4.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/attest_sign"]
