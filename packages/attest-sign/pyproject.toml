[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attest-sign"
version = "0.1.0"
description = "attest Sigstore signing and verification adapters"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Parth (ZettaCore)" }]
keywords = ["ai", "attestation", "provenance", "sigstore", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "attest-core==0.1.0",
  "sigstore==4.5.0",
]

[project.urls]
Homepage = "https://github.com/Parth2412/attest"
Documentation = "https://github.com/Parth2412/attest/tree/main/docs"
Repository = "https://github.com/Parth2412/attest.git"
Issues = "https://github.com/Parth2412/attest/issues"
Changelog = "https://github.com/Parth2412/attest/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/attest_sign"]

[tool.mutmut]
source_paths = ["src/attest_sign"]
only_mutate = ["src/attest_sign/verifier.py"]
on_dependency_change = "rerun"
pytest_add_cli_args_test_selection = ["tests/test_verifier.py", "tests/test_inspection.py"]
