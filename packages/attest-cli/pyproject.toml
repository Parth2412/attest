[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attest-cli"
version = "0.1.0"
description = "attest command-line composition and presentation layer"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "attest-core",
  "attest-collect",
  "attest-sign",
  "attest-store",
  "attest-policy",
  "attest-export",
  "typer",
  "rich",
  "structlog",
  "pyyaml",
  "pydantic>=2.13.5",
  "httpx>=0.28.1",
]

[project.scripts]
attest = "attest_cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/attest_cli"]
