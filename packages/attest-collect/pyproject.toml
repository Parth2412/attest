[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attest-collect"
version = "0.1.0"
description = "attest Git and provenance-signal collectors"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Parth (ZettaCore)" }]
keywords = ["ai", "attestation", "provenance", "sigstore", "supply-chain"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "attest-core==0.1.0",
  "httpx",
]

[project.optional-dependencies]
pygit2 = ["pygit2==1.20.0"]

[project.urls]
Homepage = "https://github.com/Parth2412/attest"
Documentation = "https://github.com/Parth2412/attest/tree/main/docs"
Repository = "https://github.com/Parth2412/attest.git"
Issues = "https://github.com/Parth2412/attest/issues"
Changelog = "https://github.com/Parth2412/attest/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/attest_collect"]
