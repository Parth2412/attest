[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attest-collect"
version = "0.1.0"
description = "attest Git and provenance-signal collectors"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "attest-core",
  "httpx",
]

[project.optional-dependencies]
pygit2 = ["pygit2==1.20.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/attest_collect"]
